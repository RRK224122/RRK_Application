    if(s && needsApproval('Edit supplier: '+s.name, ()=>document.getElementById('supForm').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true})))) return;
    let saved;
    if(s){
      const oldName = s.name;
      const supBefore = Object.assign({}, s);
      s.name = name; s.phone = phone; s.gstin = gstin; s.address = address;
      saved = s;
      logActivity('Edit supplier', diffText(supBefore, s, ['name','phone','gstin','address'], oldName));
      if(oldName !== name){
        state.inventory.forEach(x=>{ if(x.supplier===oldName) x.supplier = name; });
      }
    } else {
      saved = {id: uid(), name, phone, gstin, address};
      state.suppliers.push(saved);
      logActivity('Add supplier', name);
    }
    save(); closeModal(); toast(s?'Supplier updated':'Supplier added','success');
    if(onSaved) onSaved(saved);
  });
}

/* ---- Record sale ---- */
function openSaleModal(){
  if(!state.inventory.length){ toast('Add a product to inventory first','danger'); return; }
  openModal(`
    <div class="modal-head"><div class="modal-title">Record sale</div><button class="modal-close" data-close>${ICON.close}</button></div>
    <form id="saleForm">
      <div class="field">
        <label>Product code</label>
        <div class="field-with-btn">
          <input type="text" id="s_code" required list="itemCodesList" placeholder="Type, pick or scan">
          <button type="button" class="btn btn-icon" id="scanSaleBtn" title="Scan barcode">${ICON.scan}</button>
        </div>
        <datalist id="itemCodesList">${state.inventory.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist>
        <div class="field-hint" id="s_itemInfo"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantity sold</label><input type="number" id="s_qty" min="1" step="1" value="1" required></div>
        <div class="field"><label>Selling price / unit</label><input type="number" id="s_price" min="0" step="0.01" required></div>
      </div>
      <div class="field"><label>Date</label><input type="date" id="s_date" value="${todayISO()}"></div>
      <div class="modal-actions"><button type="submit" class="btn btn-primary btn-block">Record sale</button></div>
    </form>
  `);
  const codeInput = document.getElementById('s_code');
  function refreshInfo(){
    const item = state.inventory.find(x=>x.code.toLowerCase()===codeInput.value.trim().toLowerCase());
    const info = document.getElementById('s_itemInfo');
    if(item){
      info.textContent = `${item.name} — ${item.qty} in stock`;
      info.style.color = item.qty<=0 ? 'var(--danger)' : '';
      if(!document.getElementById('s_price').value) document.getElementById('s_price').value = item.sellPrice;
    } else {
      info.textContent = codeInput.value ? 'No product with this code' : '';
      info.style.color = codeInput.value ? 'var(--danger)' : '';
    }
  }
  codeInput.addEventListener('input', refreshInfo);
  document.getElementById('scanSaleBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ codeInput.value = code; refreshInfo(); });
  });
  document.getElementById('saleForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const code = codeInput.value.trim();
    const item = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase());
    if(!item){ toast('No product matches that code','danger'); return; }
    const qty = parseFloat(document.getElementById('s_qty').value)||0;
    const price = parseFloat(document.getElementById('s_price').value)||0;
    const date = document.getElementById('s_date').value || todayISO();
    if(qty<=0){ toast('Enter a quantity greater than 0','danger'); return; }
    if(qty > item.qty){ toast(`Only ${item.qty} in stock`,'danger'); return; }
    item.qty -= qty;
    state.sales.push({id:uid(),code:item.code,name:item.name,qty,price,total:qty*price,costAtSale:item.costPrice,date});
    logActivity('Add sale', item.name+' ('+item.code+') × '+qty+' — '+money(qty*price));
    save(); closeModal(); renderAll();
    toast('Sale recorded','success');
  });
}

function currentBillGstSettings(){
  const enabledEl = document.getElementById('bill_gstEnabled');
  const rateEl = document.getElementById('bill_gstRate');
  const typeEl = document.getElementById('bill_gstType');
  const modeEl = document.getElementById('bill_priceMode');
  return {
    enabled: enabledEl ? enabledEl.checked : false,
    rate: rateEl ? (parseFloat(rateEl.value)||0) : state.defaultGstRate,
    type: typeEl ? typeEl.value : state.defaultGstType,
    mode: modeEl ? modeEl.value : 'exclusive'
  };
}

function renderBillItemsContainer(){
  const container = document.getElementById('billItemsContainer');
  if(!container) return;
  const subtotal = billDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  const g = currentBillGstSettings();
  const calc = computeGst(subtotal, g.enabled, g.rate, g.type, g.mode);
  container.innerHTML = `
    ${billDraftItems.length ? `
    <div class="list" style="margin-bottom:12px;">
      ${billDraftItems.map((x,i)=>`
        <div class="ledger-row">
          <div class="ledger-main">
            <div class="ledger-title">${esc(x.name)} <span class="item-code" style="margin-left:4px;">${esc(x.code)}</span></div>
            <div class="ledger-sub">${x.qty} &times; ${money(x.price)}</div>
          </div>
          <div class="ledger-amt">${money(x.qty*x.price)}</div>
          <button type="button" class="ledger-del" data-action="remove-bill-item" data-index="${i}" aria-label="Remove item">${ICON.trash}</button>
        </div>`).join('')}
    </div>` : `<div class="empty-state" style="padding:22px;">${ICON.empty}<div class="empty-state-title">No items added yet</div></div>`}
    <div class="card" style="padding:10px 14px;">
      <table class="report-table">
        <tr><td>Subtotal</td><td>${money(subtotal)}</td></tr>
        ${g.enabled ? (g.type==='inter'
          ? `<tr><td>IGST (${g.rate}%)</td><td>${money(calc.igst)}</td></tr>`
          : `<tr><td>CGST (${g.rate/2}%)</td><td>${money(calc.cgst)}</td></tr><tr><td>SGST (${g.rate/2}%)</td><td>${money(calc.sgst)}</td></tr>`) : ''}
        <tr class="total-row"><td>Grand total</td><td>${money(calc.grandTotal)}</td></tr>
      </table>
    </div>
  `;
  container.querySelectorAll('[data-action="remove-bill-item"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      billDraftItems.splice(parseInt(btn.dataset.index,10), 1);
      renderBillItemsContainer();
    });
  });
}

function finalizeBill(kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  if(!billDraftItems.length){ toast('Add at least one item to the '+(isProforma?'proforma':'bill'),'danger'); return; }
  const grouped = {};
  billDraftItems.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
  for(const code in grouped){
    const item = state.inventory.find(x=>x.code===code);
    if(!item || grouped[code] > item.qty){
      toast(`Not enough stock for ${item?item.name:code}`,'danger');
      return;
    }
  }
  const customerName = document.getElementById('bill_custName').value.trim();
  const customerPhone = document.getElementById('bill_custPhone').value.trim();
  const customerGstin = document.getElementById('bill_custGstin').value.trim().toUpperCase();
  const customerAddress = document.getElementById('bill_custAddress').value.trim();
  const shipDifferent = document.getElementById('bill_shipDifferent').checked;
  const shipToName = shipDifferent ? document.getElementById('bill_shipName').value.trim() : '';
  const shipToPhone = shipDifferent ? document.getElementById('bill_shipPhone').value.trim() : '';
  const shipToAddress = shipDifferent ? document.getElementById('bill_shipAddress').value.trim() : '';
  const shipSameAsBilling = !shipDifferent;
  const deliveryPartner = isProforma ? '' : document.getElementById('bill_deliveryPartner').value.trim();
  const trackingId = isProforma ? '' : document.getElementById('bill_trackingId').value.trim();
  const custSelectEl = document.getElementById('bill_custSelect');
  const saveCustEl = document.getElementById('bill_saveCust');
  let customerId = custSelectEl ? (custSelectEl.value || null) : null;
  if(!customerId && customerName && saveCustEl && saveCustEl.checked){
    const newCust = {id: uid(), name: customerName, phone: customerPhone, gstin: customerGstin, address: customerAddress};
    state.customers.push(newCust);
    customerId = newCust.id;
  }
  const notes = document.getElementById('bill_notes').value.trim();
  const validUntilEl = document.getElementById('bill_validUntil');
  const validUntil = isProforma && validUntilEl ? validUntilEl.value : '';
  const g = currentBillGstSettings();
  const subtotal = billDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  const calc = computeGst(subtotal, g.enabled, g.rate, g.type, g.mode);

  if(isProforma){
    const piNo = piNoStr(state.nextProformaNo);
    const pi = {
      id: uid(), piNo, date: todayISO(),
      customerId, customerName, customerPhone, customerGstin, customerAddress,
      shipSameAsBilling, shipToName, shipToPhone, shipToAddress,
      items: billDraftItems.slice(),
      subtotal, gstEnabled: g.enabled, gstRate: g.rate, gstType: g.type, priceMode: g.mode,
      taxable: calc.taxable, gstAmount: calc.gstAmount, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst, grandTotal: calc.grandTotal,
      notes, validUntil, status: 'pending', convertedBillId: null, convertedBillNo: null
    };
    state.proformas.push(pi);
    state.nextProformaNo += 1;
    logActivity('Create proforma', piNo+' — '+money(calc.grandTotal));
    save(); closeModal();
    salesSubTab = 'proforma';
    renderAll();
    toast('Proforma invoice generated','success');
    openInvoicePreview(pi.id, 'proforma');
    if(dataDirHandle){
      writeFileToDataFolder('proforma-'+pi.piNo+'.html', new Blob([invoiceStandaloneHtml(pi,'proforma')], {type:'text/html'}));
    }
    return;
  }

  billDraftItems.forEach(x=>{
    const item = state.inventory.find(inv=>inv.code===x.code);
    if(item) item.qty -= x.qty;
  });

  const billNo = billNoStr(state.nextBillNo);
  const bill = {
    id: uid(), billNo, date: todayISO(),
    customerId, customerName, customerPhone, customerGstin, customerAddress,
    shipSameAsBilling, shipToName, shipToPhone, shipToAddress,
    deliveryPartner, trackingId,
    items: billDraftItems.slice(),
    subtotal, gstEnabled: g.enabled, gstRate: g.rate, gstType: g.type, priceMode: g.mode,
    taxable: calc.taxable, gstAmount: calc.gstAmount, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst, grandTotal: calc.grandTotal,
    notes
  };
  state.bills.push(bill);
  state.nextBillNo += 1;

  const totalUnits = billDraftItems.reduce((s,x)=>s+x.qty,0);
  state.sales.push({
    id: uid(), code: billNo,
    name: `Bill ${billNo} (${billDraftItems.length} item${billDraftItems.length===1?'':'s'})`,
    qty: totalUnits, price: totalUnits ? (calc.taxable/totalUnits) : 0, total: calc.taxable,
    costAtSale: 0, date: bill.date, billId: bill.id, billNo
  });
  logActivity('Create bill', billNo+' — '+money(calc.grandTotal));
  save();
  closeModal();
  salesSubTab = 'bills';
  renderAll();
  toast('Bill generated','success');
  openInvoicePreview(bill.id, 'invoice');
  if(dataDirHandle){
    writeFileToDataFolder('invoice-'+bill.billNo+'.html', new Blob([invoiceStandaloneHtml(bill,'invoice')], {type:'text/html'}));
  }
}

  const custSelect = document.getElementById('dc_custSelect');

  function applyCustomerSelection(){

}
function finalizeDc(editDcId){
  if(!dcDraftItems.length){ toast('Add at least one item to the challan','danger'); return; }
  const editing = editDcId ? state.deliveryChallans.find(x=>x.id===editDcId) : null;
  if(editing && needsApproval('Edit delivery challan: '+editing.dcNo, ()=>finalizeDc(editDcId))) return;
  const reduceStock = document.getElementById('dc_reduceStock').checked;

  // Validate stock availability before touching anything.
  if(reduceStock){
    const grouped = {};
    dcDraftItems.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
    for(const code in grouped){
      const item = state.inventory.find(x=>x.code===code);
      const originalQty = editing ? editing.items.filter(x=>x.code===code).reduce((s,x)=>s+x.qty,0) : 0;
      const available = (item?item.qty:0) + (editing && editing.reducesStock ? originalQty : 0);
      if(!item || grouped[code] > available){
        toast(`Not enough stock for ${item?item.name:code}`,'danger');
        return;
      }
    }
  }

  const customerName = document.getElementById('dc_custName').value.trim();
  const customerPhone = document.getElementById('dc_custPhone').value.trim();
  const customerAddress = document.getElementById('dc_custAddress').value.trim();
  const custSelectEl = document.getElementById('dc_custSelect');
  const saveCustEl = document.getElementById('dc_saveCust');
  let customerId = custSelectEl ? (custSelectEl.value || null) : null;
  if(!customerId && customerName && saveCustEl && saveCustEl.checked){
    const newCust = {id: uid(), name: customerName, phone: customerPhone, gstin:'', address: customerAddress};
    state.customers.push(newCust);
    customerId = newCust.id;
  }
  const reason = document.getElementById('dc_reason').value;
  const vehicleNo = document.getElementById('dc_vehicle').value.trim();
  const notes = document.getElementById('dc_notes').value.trim();

  // Restore stock from the OLD version of this DC (if editing and it previously reduced stock),
  // then deduct stock for the NEW item list (if this version reduces stock).
  if(editing && editing.reducesStock){
    editing.items.forEach(x=>{
      const item = state.inventory.find(inv=>inv.code===x.code);
      if(item) item.qty += x.qty;
    });
  }
  if(reduceStock){
    dcDraftItems.forEach(x=>{
      const item = state.inventory.find(inv=>inv.code===x.code);
      if(item) item.qty -= x.qty;
    });
  }

  if(editing){
    const dcFields = ['customerName','customerPhone','customerAddress','reason','vehicleNo','notes','items'];
    const dcBefore = {customerName:editing.customerName, customerPhone:editing.customerPhone, customerAddress:editing.customerAddress, reason:editing.reason, vehicleNo:editing.vehicleNo, notes:editing.notes, items:editing.items.map(x=>x.code+' x'+x.qty).join(', ')};
    const dcAfter = {customerName, customerPhone, customerAddress, reason, vehicleNo, notes, items:dcDraftItems.map(x=>x.code+' x'+x.qty).join(', ')};
    logActivity('Edit delivery challan', diffText(dcBefore, dcAfter, dcFields, editing.dcNo));
    Object.assign(editing, {
      customerId, customerName, customerPhone, customerAddress,
      reason, vehicleNo, notes, reducesStock: reduceStock,
      items: dcDraftItems.slice()
    });
    save(); closeModal(); renderAll(); toast('Delivery challan updated','success');
    openDcPreview(editing.id);
    if(dataDirHandle) writeFileToDataFolder('dc-'+editing.dcNo+'.html', new Blob([dcStandaloneHtml(editing)], {type:'text/html'}));
  } else {
    const dcNo = dcNoStr(state.nextDcNo);
    const dc = {
      id: uid(), dcNo, date: todayISO(),
      customerId, customerName, customerPhone, customerAddress,
      reason, vehicleNo, notes, reducesStock: reduceStock,
      items: dcDraftItems.slice()
    };
    state.deliveryChallans.push(dc);
    state.nextDcNo += 1;
    logActivity('Create delivery challan', dcNo);
    save(); closeModal();
    salesSubTab = 'dc';
    renderAll();
    toast('Delivery challan generated','success');
    openDcPreview(dc.id);
    if(dataDirHandle) writeFileToDataFolder('dc-'+dc.dcNo+'.html', new Blob([dcStandaloneHtml(dc)], {type:'text/html'}));
  }
}

  openModal(`

    <div style="background:#fff;color:#1a1a1a;border-radius:var(--radius-m);padding:16px;font-size:13px;border:1px solid var(--border);">

/* ---- Invoice / proforma preview / print / delete ---- */
function openInvoicePreview(id, kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  const b = isProforma ? state.proformas.find(x=>x.id===id) : state.bills.find(x=>x.id===id);
  if(!b) return;
  const docNo = isProforma ? b.piNo : b.billNo;
  const isConverted = isProforma && b.status==='converted';
  openModal(`
    <div class="modal-head"><div class="modal-title">${esc(docNo)}</div><button class="modal-close" data-close>${ICON.close}</button></div>
    <div style="background:#fff;color:#1a1a1a;border-radius:var(--radius-m);padding:16px;font-size:13px;border:1px solid var(--border);">
      ${invoiceHtmlBody(b, kind)}
    </div>
    ${isConverted?`
    <div class="card" style="margin-top:14px;background:var(--success-soft);border-color:transparent;">
      <div style="font-size:13px;color:var(--success);font-weight:600;">Converted to invoice ${esc(b.convertedBillNo)}</div>
      <button type="button" class="btn btn-block" style="margin-top:10px;" id="viewConvertedBtn">View invoice</button>
    </div>
    `:''}
    ${isProforma ? '' : `
    <div class="section-label"><span>Delivery tracking</span></div>
    <div class="field-row">
      <div class="field"><label>Delivery partner</label><input type="text" id="pv_deliveryPartner" list="deliveryPartnerList" value="${esc(b.deliveryPartner||'')}"></div>
      <div class="field"><label>Tracking ID</label><input type="text" id="pv_trackingId" value="${esc(b.trackingId||'')}"></div>
    </div>
    <datalist id="deliveryPartnerList">
      <option value="Delhivery"></option>
      <option value="Blue Dart"></option>
      <option value="DTDC"></option>
      <option value="India Post"></option>
      <option value="Ekart"></option>
      <option value="Xpressbees"></option>
      <option value="Self / own delivery"></option>
    </datalist>
    <button type="button" class="btn btn-block" id="saveTrackingBtn">Save delivery info</button>
    `}
    ${(isProforma && !isConverted) ? `<button type="button" class="btn btn-primary btn-block" style="margin-top:14px;" id="convertBillBtn">Convert to Invoice</button>` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="deleteBillBtn">Delete</button>
      <button type="button" class="btn" id="saveBillBtn"><span>${isProforma?'Save proforma file':'Save invoice file'}</span></button>
      <button type="button" class="btn btn-primary" id="printBillBtn">${ICON.printer}<span>Print / Save as PDF</span></button>
    </div>
  `);
  document.getElementById('printBillBtn').addEventListener('click', ()=> printHtmlDocument(invoiceStandaloneHtml(b, kind)));
  document.getElementById('saveBillBtn').addEventListener('click', ()=>{
    const filename = (isProforma?'proforma-':'invoice-') + docNo + '.html';
    saveHtmlFileGeneric(filename, invoiceStandaloneHtml(b, kind), isProforma?'Proforma':'Invoice');
  });
  if(isConverted){
    document.getElementById('viewConvertedBtn').addEventListener('click', ()=> openInvoicePreview(b.convertedBillId, 'invoice'));
  }
  if(!isProforma){
    document.getElementById('saveTrackingBtn').addEventListener('click', ()=>{
      b.deliveryPartner = document.getElementById('pv_deliveryPartner').value.trim();
      b.trackingId = document.getElementById('pv_trackingId').value.trim();
      save();
      toast('Delivery info saved','success');
      openInvoicePreview(b.id, 'invoice');
    });
  }
  if(isProforma && !isConverted){
    document.getElementById('convertBillBtn').addEventListener('click', ()=>{
      confirmModal(`Convert ${esc(docNo)} to a real invoice? This will deduct stock and record revenue.`, ()=> convertProformaToInvoice(b.id), 'Convert');
    });
  }
  document.getElementById('deleteBillBtn').addEventListener('click', ()=>{
    if(isProforma){
      confirmModal('Delete this proforma invoice?', ()=>{
        state.proformas = state.proformas.filter(x=>x.id!==b.id);
        logActivity('Delete proforma', docNo);
        save(); closeModal(); renderAll(); toast('Proforma deleted');
      });
    } else {
      confirmModal('Delete this bill? Stock will not be restored automatically, and its linked revenue entry will also be removed.', ()=>{
        state.bills = state.bills.filter(x=>x.id!==b.id);
        state.sales = state.sales.filter(x=>x.billId!==b.id);
        logActivity('Delete bill', docNo);
        save(); closeModal(); renderAll(); toast('Bill deleted');
      });
    }
  });
}
function convertProformaToInvoice(proformaId){
  const pi = state.proformas.find(x=>x.id===proformaId);
  if(!pi || pi.status==='converted') return;
  const grouped = {};
  pi.items.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
  for(const code in grouped){
    const item = state.inventory.find(x=>x.code===code);
    if(!item || grouped[code] > item.qty){
      toast(`Not enough stock for ${item?item.name:code} — adjust stock or the proforma before converting`,'danger');
      return;
    }
  }
  pi.items.forEach(x=>{
    const item = state.inventory.find(inv=>inv.code===x.code);
    if(item) item.qty -= x.qty;
  });
  const billNo = billNoStr(state.nextBillNo);
  const bill = {
    id: uid(), billNo, date: todayISO(),
    customerId: pi.customerId||null, customerName: pi.customerName, customerPhone: pi.customerPhone,
    customerGstin: pi.customerGstin, customerAddress: pi.customerAddress,
    shipSameAsBilling: pi.shipSameAsBilling, shipToName: pi.shipToName, shipToPhone: pi.shipToPhone, shipToAddress: pi.shipToAddress,
    deliveryPartner: '', trackingId: '',
    items: pi.items.slice(),
    subtotal: pi.subtotal, gstEnabled: pi.gstEnabled, gstRate: pi.gstRate, gstType: pi.gstType, priceMode: pi.priceMode,
    taxable: pi.taxable, gstAmount: pi.gstAmount, cgst: pi.cgst, sgst: pi.sgst, igst: pi.igst, grandTotal: pi.grandTotal,
    notes: pi.notes, fromProformaId: pi.id, fromProformaNo: pi.piNo
  };
  state.bills.push(bill);
  state.nextBillNo += 1;
  const totalUnits = pi.items.reduce((s,x)=>s+x.qty,0);
  state.sales.push({
    id: uid(), code: billNo,
    name: `Bill ${billNo} (${pi.items.length} item${pi.items.length===1?'':'s'})`,
    qty: totalUnits, price: totalUnits ? (pi.taxable/totalUnits) : 0, total: pi.taxable,
    costAtSale: 0, date: bill.date, billId: bill.id, billNo
  });
  pi.status = 'converted';
  pi.convertedBillId = bill.id;
  pi.convertedBillNo = billNo;
  save(); closeModal();
  salesSubTab = 'bills';
  renderAll();
  toast('Converted to invoice '+billNo,'success');
  openInvoicePreview(bill.id, 'invoice');
  if(dataDirHandle){
    writeFileToDataFolder('invoice-'+bill.billNo+'.html', new Blob([invoiceStandaloneHtml(bill,'invoice')], {type:'text/html'}));
  }
}

function printHtmlDocument(html){
  // Print via a hidden same-page iframe instead of window.open(), so this
  // works even when browsers or embedded viewers block pop-up windows.
  let frame = document.getElementById('invoicePrintFrame');
  if(!frame){
    frame = document.createElement('iframe');
    frame.id = 'invoicePrintFrame';
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    document.body.appendChild(frame);
  }
  try{
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(()=>{
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }catch(e){
        console.error('Print failed', e);
        toast('Could not open the print dialog — use the Save file option instead','danger');
      }
    }, 250);
  }catch(e){
    console.error('Print setup failed', e);
    toast('Could not prepare the document for printing — use the Save file option instead','danger');
  }
}
function saveHtmlFileGeneric(filename, html, label){
  const blob = new Blob([html], {type:'text/html'});
  if(dataDirHandle){
    writeFileToDataFolder(filename, blob).then(ok=>{
      if(ok) toast((label||'File')+' saved to your data folder','success');
      else { triggerDownload(filename, blob); toast((label||'File')+' downloaded','success'); }
    });
  } else {
    triggerDownload(filename, blob);
    toast((label||'File')+' downloaded — open it in a browser to view or print','success');
  }
}

      const emp = (state.employees||[]).find(x=>x.id===empSel.value);
      if(!emp){ hint.textContent = ''; return; }
      amtEl.value = emp.monthlySalary || '';
      const month = document.getElementById('c_month').value || currentMonthStr();
      const paid = employeeNetForMonth(emp, month);
      hint.innerHTML = 'Set monthly salary: <strong>'+money(emp.monthlySalary||0)+'</strong>'+(paid?' &middot; <span style="color:var(--danger);">already paid for '+monthLabel(month)+' (slip '+esc(paid.payslipNo)+')</span>':'');
    };
    const showSalary = ()=>{ box.style.display = 'block'; fillEmployees(); };
    catSel.addEventListener('change', ()=>{
      if(catSel.value==='Salary'){
        if(canViewEmployees()){ prevCat = 'Salary'; showSalary(); return; }
        requestAdminApproval('Salary entry needs employee information', ()=>{
          employeeViewUntil = Date.now() + unlockMs();
          logActivity('Employee information opened', 'Admin approved access for '+(currentUser?currentUser.username:'')+' (salary entry)');
          prevCat = 'Salary'; showSalary();
        }, ()=>{ catSel.value = prevCat; });
      } else {
        prevCat = catSel.value; box.style.display = 'none';
      }
    });
    empSel.addEventListener('change', refreshSalaryHint);
    document.getElementById('c_month').addEventListener('change', refreshSalaryHint);
  }
  document.getElementById('cashForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const amount = parseFloat(document.getElementById('c_amount').value)||0;
    const note = document.getElementById('c_note').value.trim();
    const date = document.getElementById('c_date').value || todayISO();
    if(amount<=0){ toast('Enter an amount greater than 0','danger'); return; }
    if(isExp){
      const category = document.getElementById('c_category').value;
      if(category==='Salary'){
        const emp = (state.employees||[]).find(x=>x.id===document.getElementById('c_employee').value);
        if(!emp){ toast('Select the employee being paid','danger'); return; }
        const month = document.getElementById('c_month').value || currentMonthStr();
        const payment = recordSalaryPayment(emp, {month, basic:amount, allowances:0, deductions:0, paidDate:date, notes:note});
        save(); closeModal(); renderAll();
        toast('Salary paid to '+emp.name+' — '+money(amount),'success');
        openPayslipPreview(payment.id);
        return;
      }
      state.expenses.push({id:uid(),category,amount,note,date});
      logActivity('Add expense', category+' — '+money(amount));
    } else {
      state.investments.push({id:uid(),amount,note,date});
      logActivity('Add investment', money(amount));
    }
    save(); closeModal(); renderAll();
    toast(isExp?'Expense added':'Investment added','success');
  });
}

function confirmModal(message, onConfirm, confirmLabel){
  const label = confirmLabel || 'Delete';
  const danger = label === 'Delete';
  openModal(`
    <div class="modal-head"><div class="modal-title">Please confirm</div><button class="modal-close" data-close>${ICON.close}</button></div>

    <div class="modal-actions">
      <button class="btn" data-close>Cancel</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmYes">${esc(label)}</button>
    </div>
  `);
  document.getElementById('confirmYes').addEventListener('click', onConfirm);
}

function openEmployeeIdsModal(){

  document.getElementById('eidBackBtn').addEventListener('click', openEmployeeSettingsModal);
  const saveBtn = document.getElementById('eidSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const inputs = Array.from(document.querySelectorAll('.eid-input'));
    const wanted = inputs.map(i=>({emp: state.employees.find(x=>x.id===i.dataset.id), id: i.value.trim().toUpperCase()}));
    const seen = new Set();
    for(const w of wanted){
      if(!w.id){ toast('Employee ID cannot be empty ('+w.emp.name+')','danger'); return; }
      if(seen.has(w.id)){ toast('Duplicate ID: '+w.id,'danger'); return; }
      seen.add(w.id);
    }
    const changes = wanted.filter(w=>w.emp && w.emp.empId!==w.id);
    if(!changes.length){ toast('No changes to save'); return; }
    if(needsApproval('Change employee ID for '+changes.map(c=>c.emp.name).join(', '), ()=>saveBtn.click())) return;
    changes.forEach(c=>{ logActivity('Edit employee ID', c.emp.name+': '+c.emp.empId+' → '+c.id); c.emp.empId = c.id; });
    save(); closeModal(); renderAll();
    toast('Employee ID updated','success');
  });
}

let lastActivityAt = Date.now();
function setupIdleTimer(){
  ['click','keydown','touchstart','scroll','mousemove'].forEach(ev=>document.addEventListener(ev, ()=>{ lastActivityAt = Date.now(); }, {passive:true}));
  setInterval(()=>{
    const m = Number(setting('autoLogoutMin',0));
    if(m>0 && currentUser && Date.now()-lastActivityAt > m*60000){
      logActivity('Auto sign-out', 'inactive for '+m+' minutes');
      closeModal(); document.getElementById('approvalRoot').innerHTML = '';
      doLogout(false);
      toast('Signed out because of inactivity');
    }
  }, 15000);
}

/* ============================================================
   DATA FOLDER — auto-save JSON / Excel / SQLite next to the file
   ============================================================ */
let dataDirHandle = null;
const DIRDB_NAME = 'shopledger_dirdb';
const DIRDB_STORE = 'handles';

function idbGetDirHandle(){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(null); return; }
    let req;
    try{ req = indexedDB.open(DIRDB_NAME, 1); }catch(e){ resolve(null); return; }
    req.onupgradeneeded = ()=> req.result.createObjectStore(DIRDB_STORE);
    req.onsuccess = ()=>{
      const db = req.result;
      try{
        const tx = db.transaction(DIRDB_STORE, 'readonly');
        const getReq = tx.objectStore(DIRDB_STORE).get('dir');
        getReq.onsuccess = ()=> resolve(getReq.result || null);
        getReq.onerror = ()=> resolve(null);
      }catch(e){ resolve(null); }
    };
    req.onerror = ()=> resolve(null);
  });
}
function idbSetDirHandle(handle){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(); return; }
    let req;
    try{ req = indexedDB.open(DIRDB_NAME, 1); }catch(e){ resolve(); return; }
    req.onupgradeneeded = ()=> req.result.createObjectStore(DIRDB_STORE);
    req.onsuccess = ()=>{
      const db = req.result;
      const tx = db.transaction(DIRDB_STORE, 'readwrite');
      tx.objectStore(DIRDB_STORE).put(handle, 'dir');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> resolve();
    };
    req.onerror = ()=> resolve();
  });
}

async function initDataFolder(){
  try{
    const handle = await idbGetDirHandle();
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      dataDirHandle = handle;
      updateDataFolderStatus();
    } else {
      updateDataFolderStatus(true);
    }
  }catch(e){ /* handle from a previous browser/session may no longer be valid — ignore */ }
}

async function chooseDataFolder(){
  if(!window.showDirectoryPicker){
    toast("This browser can't save straight to a folder — use the download buttons instead", 'danger');
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    dataDirHandle = handle;
    await idbSetDirHandle(handle);
    updateDataFolderStatus();
    toast('Data folder set — backups will auto-save here','success');
    await syncToDataFolder();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('Could not access that folder','danger');
  }
}
async function reconnectDataFolder(){
  if(!dataDirHandle){
    const handle = await idbGetDirHandle();
    if(!handle) return chooseDataFolder();
    dataDirHandle = handle;
  }
  const ok = await ensureDataFolderPermission();
  if(ok){ updateDataFolderStatus(); toast('Data folder reconnected','success'); await syncToDataFolder(); }
  else toast('Folder access was not granted','danger');
}
async function ensureDataFolderPermission(){
  if(!dataDirHandle) return false;
  try{
    let perm = await dataDirHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') perm = await dataDirHandle.requestPermission({mode:'readwrite'});
    return perm === 'granted';
  }catch(e){ return false; }
}
async function writeFileToDataFolder(filename, blob){
  if(!dataDirHandle) return false;
  const ok = await ensureDataFolderPermission();
  if(!ok) return false;
  try{
    const fileHandle = await dataDirHandle.getFileHandle(filename, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return true;
  }catch(e){ console.error('Write failed', filename, e); return false; }
}
function updateDataFolderStatus(needsReconnect){
  const el = document.getElementById('dataFolderStatus');
  if(el){
    el.textContent = dataDirHandle
      ? ('Auto-saving JSON, Excel and SQLite to: '+(dataDirHandle.name||'selected folder'))
      : (needsReconnect ? 'Folder was set previously — reconnect to resume auto-save' : 'Not set — data only lives in this browser until you export it');
  }
  const btn = document.getElementById('chooseDataFolderBtn');
  if(btn) btn.textContent = dataDirHandle ? 'Change data folder' : (needsReconnect ? 'Set up data folder (auto-save)' : 'Set up data folder (auto-save)');
  const reconnectBtn = document.getElementById('reconnectDataFolderBtn');
  if(reconnectBtn) reconnectBtn.style.display = (needsReconnect && !dataDirHandle) ? '' : 'none';
}

let syncTimer = null;
function scheduleFolderSync(){
  if(!dataDirHandle) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToDataFolder, 800);
}
async function syncToDataFolder(){
  if(!dataDirHandle) return;
  const ok = await ensureDataFolderPermission();
  if(!ok) return;
  try{
    await writeFileToDataFolder('shop-ledger-backup.json', new Blob([JSON.stringify(Object.assign({}, state, {activityLog: auditLog}),null,2)],{type:'application/json'}));
    await writeFileToDataFolder('shop-ledger-activity-log.json', new Blob([JSON.stringify(auditLog,null,2)],{type:'application/json'}));
    const xlsxBlob = await buildXlsxBlob();
    if(xlsxBlob) await writeFileToDataFolder('shop-ledger-data.xlsx', xlsxBlob);
    const dbBlob = await buildDbBlob();
    if(dbBlob) await writeFileToDataFolder('shop-ledger-data.db', dbBlob);
  }catch(e){ console.error('Folder sync failed', e); }
}

let xlsxLoadPromise = null;
function loadXlsxLib(){

/* ---- SQLite (.db) export via sql.js ---- */
let sqlJsLoadPromise = null;
function loadSqlJsLib(){
  if(window.__SQL) return Promise.resolve(window.__SQL);
  if(sqlJsLoadPromise) return sqlJsLoadPromise;
  sqlJsLoadPromise = loadScriptOnce('https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js')
    .then(()=> window.initSqlJs({locateFile: f => 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'+f}))
    .then(SQL => { window.__SQL = SQL; return SQL; })
    .catch(err=>{ sqlJsLoadPromise = null; throw err; });
  return sqlJsLoadPromise;
}
async function buildDbBlob(){
  try{
    const SQL = await loadSqlJsLib();
    const db = new SQL.Database();
    db.run(`
      CREATE TABLE inventory (code TEXT, name TEXT, category TEXT, supplier TEXT, qty REAL, min_qty REAL, cost_price REAL, sell_price REAL);
      CREATE TABLE sales (date TEXT, code TEXT, name TEXT, qty REAL, price REAL, total REAL, cost_at_sale REAL, bill_no TEXT);
      CREATE TABLE bills (bill_no TEXT, date TEXT, customer_name TEXT, customer_phone TEXT, customer_gstin TEXT, customer_address TEXT, delivery_partner TEXT, tracking_id TEXT, subtotal REAL, gst_amount REAL, grand_total REAL, notes TEXT);
      CREATE TABLE bill_items (bill_no TEXT, item_code TEXT, item_name TEXT, qty REAL, price REAL, amount REAL);
      CREATE TABLE expenses (date TEXT, category TEXT, amount REAL, note TEXT);
      CREATE TABLE investments (date TEXT, amount REAL, note TEXT);
      CREATE TABLE customers (name TEXT, phone TEXT, gstin TEXT, address TEXT);
      CREATE TABLE delivery_challans (dc_no TEXT, date TEXT, customer_name TEXT, customer_phone TEXT, customer_address TEXT, reason TEXT, vehicle_no TEXT, reduces_stock TEXT, notes TEXT);
      CREATE TABLE dc_items (dc_no TEXT, item_code TEXT, item_name TEXT, qty REAL, declared_value_per_unit REAL);
      CREATE TABLE suppliers (name TEXT, phone TEXT, gstin TEXT, address TEXT);
      CREATE TABLE categories (category TEXT);
      CREATE TABLE proforma_invoices (pi_no TEXT, date TEXT, customer_name TEXT, customer_phone TEXT, customer_gstin TEXT, customer_address TEXT, subtotal REAL, gst_amount REAL, grand_total REAL, status TEXT, valid_until TEXT, converted_bill_no TEXT, notes TEXT);
      CREATE TABLE proforma_items (pi_no TEXT, item_code TEXT, item_name TEXT, qty REAL, price REAL, amount REAL);
    `);
    const insert = (sql, rows) => {
      const stmt = db.prepare(sql);
      rows.forEach(r => { stmt.run(r); });
      stmt.free();
    };
    insert('INSERT INTO inventory VALUES (?,?,?,?,?,?,?,?)',
      state.inventory.map(x=>[x.code,x.name,x.category,x.supplier||'',x.qty,x.minQty,x.costPrice,x.sellPrice]));
    insert('INSERT INTO sales VALUES (?,?,?,?,?,?,?,?)',
      state.sales.map(x=>[x.date,x.code,x.name,x.qty,x.price,x.total,x.costAtSale,x.billNo||'']));
    insert('INSERT INTO bills VALUES (?,?,?,?,?,?,?,?,?,?,?,?)',
      state.bills.map(b=>[b.billNo,b.date,b.customerName,b.customerPhone,b.customerGstin,b.customerAddress||'',b.deliveryPartner||'',b.trackingId||'',b.subtotal,b.gstAmount,b.grandTotal,b.notes||'']));
    const billItemRows = [];
    state.bills.forEach(b=> b.items.forEach(it=> billItemRows.push([b.billNo,it.code,it.name,it.qty,it.price,it.qty*it.price])));
    insert('INSERT INTO bill_items VALUES (?,?,?,?,?,?)', billItemRows);
    insert('INSERT INTO expenses VALUES (?,?,?,?)', (state.expenses||[]).map(x=>[x.date,x.category,x.amount,x.note||'']));
    insert('INSERT INTO investments VALUES (?,?,?)', (state.investments||[]).map(x=>[x.date,x.amount,x.note||'']));
    insert('INSERT INTO customers VALUES (?,?,?,?)', (state.customers||[]).map(c=>[c.name,c.phone||'',c.gstin||'',c.address||'']));
    insert('INSERT INTO delivery_challans VALUES (?,?,?,?,?,?,?,?,?)',
      (state.deliveryChallans||[]).map(d=>[d.dcNo,d.date,d.customerName||'',d.customerPhone||'',d.customerAddress||'',d.reason||'',d.vehicleNo||'',d.reducesStock?'Yes':'No',d.notes||'']));
    const dcItemRows2 = [];
    (state.deliveryChallans||[]).forEach(d=> d.items.forEach(it=> dcItemRows2.push([d.dcNo,it.code,it.name,it.qty,it.price||0])));
    insert('INSERT INTO dc_items VALUES (?,?,?,?,?)', dcItemRows2);
    insert('INSERT INTO suppliers VALUES (?,?,?,?)', (state.suppliers||[]).map(s=>[s.name,s.phone||'',s.gstin||'',s.address||'']));
    insert('INSERT INTO categories VALUES (?)', (state.categories||[]).map(c=>[c]));
    insert('INSERT INTO proforma_invoices VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)',
      (state.proformas||[]).map(p=>[p.piNo,p.date,p.customerName||'',p.customerPhone||'',p.customerGstin||'',p.customerAddress||'',p.subtotal,p.gstAmount,p.grandTotal,p.status,p.validUntil||'',p.convertedBillNo||'',p.notes||'']));
    const piItemRows2 = [];
    (state.proformas||[]).forEach(p=> p.items.forEach(it=> piItemRows2.push([p.piNo,it.code,it.name,it.qty,it.price,it.qty*it.price])));
    insert('INSERT INTO proforma_items VALUES (?,?,?,?,?,?)', piItemRows2);
    const data = db.export();
    db.close();
    return new Blob([data], {type:'application/x-sqlite3'});
  }catch(e){ console.error('db build failed', e); return null; }
}

function handleScanResult(onResult, rawText){
  const code = String(rawText||'').trim();
  closeScannerOverlay();
  try{ onResult(code); }catch(e){ console.error('Scan result handler failed', e); }
  toast('Code scanned','success');
}

function cameraErrorMessage(err){
  const name = err && err.name;
  if(name==='NotAllowedError' || name==='PermissionDeniedError'){
    return 'Camera permission was denied. Allow camera access for this site in your browser settings, then try again.';
  }
  if(name==='NotFoundError' || name==='DevicesNotFoundError'){
    return 'No camera was found on this device.';
  }
  if(name==='NotReadableError' || name==='TrackStartError'){
    return 'The camera is already in use by another app. Close other camera apps and try again.';
  }
  if(name==='OverconstrainedError'){
    return 'This device has no rear camera matching what was requested. Type the code manually.';
  }
  return 'Could not access the camera. Check camera permission for this page, or type the code manually.';
}
async function startScanner(onResult){
  const statusEl = document.getElementById('scannerStatus');
  const view = document.getElementById('scannerView');

  // --- Upfront checks with clear, specific messages ---
  if(!window.isSecureContext){
    if(statusEl) statusEl.textContent = 'Camera access needs a secure page. Open this app from its https:// link (not a file opened directly) and try again.';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(statusEl) statusEl.textContent = 'This browser does not support camera access here. Try Chrome or Safari, or type the code manually.';
    return;
  }

  // --- Preferred path: native BarcodeDetector, works fully offline ---
  if('BarcodeDetector' in window){
    try{
      let formats;
      try{ formats = await BarcodeDetector.getSupportedFormats(); }catch(e){ formats = null; }
      const wanted = ['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf'];
      const useFormats = formats ? wanted.filter(f=>formats.includes(f)) : wanted;
      const detector = new BarcodeDetector(useFormats.length ? {formats:useFormats} : undefined);
      nativeStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const video = document.createElement('video');
      video.setAttribute('playsinline',''); video.muted = true;
      video.style.cssText = 'width:100%;display:block;border-radius:inherit;';
      view.innerHTML = ''; view.appendChild(video);
      video.srcObject = nativeStream;
      await video.play();
      if(statusEl) statusEl.textContent = 'Point the camera at a barcode or QR code';
      const scanLoop = async ()=>{
        if(!nativeStream) return; // stopped
        try{
          const codes = video.readyState >= 2 ? await detector.detect(video) : [];
          if(codes && codes.length){
            handleScanResult(onResult, codes[0].rawValue);
            return;
          }
        }catch(e){ /* transient decode error, keep scanning */ }
        nativeRAF = requestAnimationFrame(scanLoop);
      };
      scanLoop();
      return;
    }catch(err){
      console.error('Native scanner failed', err);
      stopScanner();
      const n = err && err.name;
      if(['NotAllowedError','PermissionDeniedError','NotFoundError','DevicesNotFoundError','NotReadableError','TrackStartError'].includes(n)){
        if(statusEl) statusEl.textContent = cameraErrorMessage(err);
        return; // a camera/permission failure won't be fixed by the fallback library
      }
      view.innerHTML = ''; // otherwise fall through to the library scanner
    }
  }

  // --- Fallback: html5-qrcode library, loaded on demand ---
  if(statusEl) statusEl.textContent = 'Loading scanner\u2026';
  try{
    await loadHtml5Qrcode();
    startHtml5QrcodeScanner(onResult);
  }catch(err){
    console.error('Scanner library failed to load', err);
    if(statusEl) statusEl.textContent = 'Scanner could not load — check your internet connection, or type the code manually.';
  }
}

function loadScriptOnce(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('Failed to load '+url));
    document.head.appendChild(s);
  });
}
function loadHtml5Qrcode(){
  if(typeof Html5Qrcode !== 'undefined') return Promise.resolve();
  if(html5QrcodeLoadPromise) return html5QrcodeLoadPromise;
  const urls = [
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.0.7/html5-qrcode.min.js'
  ];
  html5QrcodeLoadPromise = urls.reduce(
    (p, url) => p.catch(()=> loadScriptOnce(url)),
    Promise.reject()
  ).then(()=>{
    if(typeof Html5Qrcode === 'undefined') throw new Error('Library loaded but Html5Qrcode is undefined');
  }).catch((err)=>{ html5QrcodeLoadPromise = null; throw err; });
  return html5QrcodeLoadPromise;
}
function startHtml5QrcodeScanner(onResult){
  const statusEl = document.getElementById('scannerStatus');
  let formatsToSupport;
  try{
    formatsToSupport = [
      Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.ITF
    ];
  }catch(e){ formatsToSupport = undefined; }
  scannerInstance = new Html5Qrcode('scannerView', formatsToSupport ? {formatsToSupport, verbose:false} : {verbose:false});
  scannerInstance.start(
    {facingMode:'environment'},
    {fps:10, qrbox:{width:230,height:150}},
    (decodedText)=>{
      handleScanResult(onResult, decodedText);
    },
    ()=>{ /* per-frame scan failure, ignore */ }
  ).then(()=>{ if(statusEl) statusEl.textContent = 'Point the camera at a barcode or QR code'; })
   .catch((err)=>{
      if(statusEl) statusEl.textContent = cameraErrorMessage(err);
      console.error(err);
   });
}
function stopScanner(){
  if(nativeRAF){ cancelAnimationFrame(nativeRAF); nativeRAF = null; }
  if(nativeStream){ nativeStream.getTracks().forEach(t=>t.stop()); nativeStream = null; }
  if(scannerInstance){
    try{
      scannerInstance.stop().then(()=>{ try{scannerInstance.clear();}catch(e){} scannerInstance=null; })
        .catch(()=>{ scannerInstance=null; });
    }catch(e){ scannerInstance=null; }
  }
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function attachPageHandlers(){
  const openAddItem = document.getElementById('openAddItem');
  if(openAddItem) openAddItem.addEventListener('click', ()=>openItemModal(null));

  document.querySelectorAll('[data-action="edit-item"]').forEach(row=>{
    row.addEventListener('click', ()=>openItemModal(row.dataset.id));
  });

  const invSearch = document.getElementById('invSearch');
  if(invSearch) invSearch.addEventListener('input', ()=>{ inventoryQuery = invSearch.value; renderPageInPlace('inventory'); });
  const invCatFilter = document.getElementById('invCatFilter');
  if(invCatFilter) invCatFilter.addEventListener('change', ()=>{ inventoryCatFilter = invCatFilter.value; renderAll(); });
  const manageCategoriesBtnToolbar = document.getElementById('manageCategoriesBtnToolbar');
  if(manageCategoriesBtnToolbar) manageCategoriesBtnToolbar.addEventListener('click', ()=>openCategoriesModal(null));

  const openAddSale = document.getElementById('openAddSale');
  if(openAddSale) openAddSale.addEventListener('click', openSaleModal);
  document.querySelectorAll('[data-action="del-sale"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const sale = state.sales.find(x=>x.id===btn.dataset.id);
      const msg = sale && sale.billId
        ? 'This entry belongs to a bill. Deleting it here removes it from revenue but leaves the bill itself — delete it from the Bills tab instead to remove both together. Delete anyway?'
        : 'Delete this sale? Stock quantity will not be restored automatically.';
      confirmModal(msg, ()=>{
        if(sale) logActivity('Delete sale', (sale.name||sale.code)+' × '+sale.qty+' — '+money(sale.total)+' — '+sale.date);
        state.sales = state.sales.filter(x=>x.id!==btn.dataset.id);
        save(); closeModal(); renderAll(); toast('Sale deleted');
      });
    });
  });

  const openNewBill = document.getElementById('openNewBill');
  if(openNewBill) openNewBill.addEventListener('click', ()=>openNewBillModal('invoice'));
  document.querySelectorAll('[data-action="view-bill"]').forEach(row=>{
    row.addEventListener('click', ()=>openInvoicePreview(row.dataset.id, 'invoice'));
  });

  const openNewProforma = document.getElementById('openNewProforma');
  if(openNewProforma) openNewProforma.addEventListener('click', ()=>openNewBillModal('proforma'));
  document.querySelectorAll('[data-action="view-proforma"]').forEach(row=>{
    row.addEventListener('click', ()=>openInvoicePreview(row.dataset.id, 'proforma'));
  });

  const openNewDc = document.getElementById('openNewDc');
  if(openNewDc) openNewDc.addEventListener('click', ()=>openNewDcModal(null));
  document.querySelectorAll('[data-action="view-dc"]').forEach(row=>{
    row.addEventListener('click', ()=>openDcPreview(row.dataset.id));
  });

  document.querySelectorAll('.subtab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.subtabGroup==='sales'){ salesSubTab = btn.dataset.subtab; }
      else{ cashSubTab = btn.dataset.subtab; }
      renderAll();
    });
  });
  const openAddCash = document.getElementById('openAddCash');
  if(openAddCash) openAddCash.addEventListener('click', openCashModal);
  document.querySelectorAll('[data-action="del-expense"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exCheck = state.expenses.find(x=>x.id===btn.dataset.id);
      const exMsg = exCheck && exCheck.salaryPaymentId ? 'This is a salary payment. Deleting it adds the amount back to your profit and cash balance, but the payslip stays. Delete anyway?' : 'Delete this expense entry?';
      confirmModal(exMsg, ()=>{
        const ex = state.expenses.find(x=>x.id===btn.dataset.id);
        if(ex) logActivity('Delete expense', ex.category+' — '+money(ex.amount)+(ex.note?' — '+ex.note:'')+' — '+ex.date);
        state.expenses = state.expenses.filter(x=>x.id!==btn.dataset.id);
        save(); closeModal(); renderAll(); toast('Expense deleted');
      });
    });
  });
  document.querySelectorAll('[data-action="del-investment"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      confirmModal('Delete this investment entry?', ()=>{
        const inv = state.investments.find(x=>x.id===btn.dataset.id);
        if(inv) logActivity('Delete investment', money(inv.amount)+(inv.note?' — '+inv.note:'')+' — '+inv.date);
        state.investments = state.investments.filter(x=>x.id!==btn.dataset.id);
        save(); closeModal(); renderAll(); toast('Investment deleted');
      });
    });
  });

  document.querySelectorAll('[data-report-range]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ reportRange = parseInt(btn.dataset.reportRange,10); renderAll(); });
  });
  const expBtn = document.getElementById('exportInventoryCsv');
  if(expBtn) expBtn.addEventListener('click', ()=>{
    const rows = [['Code','Name','Category','Supplier','Quantity','Cost Price','Selling Price','Stock Value']];
    state.inventory.forEach(x=>rows.push([x.code,x.name,x.category,x.supplier||'',x.qty,x.costPrice,x.sellPrice,(x.qty*x.costPrice).toFixed(2)]));
    downloadCsv('inventory-'+todayISO()+'.csv', rows);
    toast('Inventory CSV downloaded','success');
  });
  const expSalesBtn = document.getElementById('exportSalesCsv');
  if(expSalesBtn) expSalesBtn.addEventListener('click', ()=>{
    const rows = [['Date','Code','Name','Qty','Price','Total','Cost At Sale']];
    state.sales.forEach(x=>rows.push([x.date,x.code,x.name,x.qty,x.price,x.total,x.costAtSale]));
    downloadCsv('sales-'+todayISO()+'.csv', rows);
    toast('Sales CSV downloaded','success');
  });
  const expBillsBtn = document.getElementById('exportBillsCsv');
  if(expBillsBtn) expBillsBtn.addEventListener('click', ()=>{
    const rows = [['Bill No','Date','Customer','Customer GSTIN','Customer Address','Delivery Partner','Tracking ID','Subtotal','GST Rate','GST Type','CGST','SGST','IGST','Grand Total']];
    state.bills.forEach(b=>rows.push([b.billNo,b.date,b.customerName||'',b.customerGstin||'',b.customerAddress||'',b.deliveryPartner||'',b.trackingId||'',b.subtotal.toFixed(2),b.gstEnabled?b.gstRate:0,b.gstEnabled?b.gstType:'',b.cgst.toFixed(2),b.sgst.toFixed(2),b.igst.toFixed(2),b.grandTotal.toFixed(2)]));
    downloadCsv('bills-'+todayISO()+'.csv', rows);
    toast('Bills CSV downloaded','success');
  });
  const expProformaBtn = document.getElementById('exportProformaCsv');
  if(expProformaBtn) expProformaBtn.addEventListener('click', ()=>{
    const rows = [['Proforma No','Date','Customer','Customer GSTIN','Customer Address','Subtotal','GST Rate','GST Type','CGST','SGST','IGST','Grand Total','Status','Converted Bill No']];
    state.proformas.forEach(p=>rows.push([p.piNo,p.date,p.customerName||'',p.customerGstin||'',p.customerAddress||'',p.subtotal.toFixed(2),p.gstEnabled?p.gstRate:0,p.gstEnabled?p.gstType:'',p.cgst.toFixed(2),p.sgst.toFixed(2),p.igst.toFixed(2),p.grandTotal.toFixed(2),p.status,p.convertedBillNo||'']));
    downloadCsv('proforma-'+todayISO()+'.csv', rows);
    toast('Proforma CSV downloaded','success');
  });
  const expBackupBtn = document.getElementById('exportBackupJson');
  if(expBackupBtn) expBackupBtn.addEventListener('click', downloadBackup);
}
// Lightweight partial re-render for the search box so focus isn't lost while typing.
function renderPageInPlace(pageId){
  if(currentPage!==pageId) return;
  const main = document.getElementById('pages');
  const activeEl = document.activeElement;
  const isSearch = activeEl && activeEl.id==='invSearch';
  const selStart = isSearch ? activeEl.selectionStart : null;
  if(pageId==='inventory') main.innerHTML = pageInventory();
  attachPageHandlers();
  if(isSearch){
    const el = document.getElementById('invSearch');
    if(el){ el.focus(); if(selStart!=null) el.setSelectionRange(selStart, selStart); }
  }
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(mode){
  if(mode){ document.documentElement.setAttribute('data-theme', mode); localStorage.setItem(THEME_KEY, mode); }
  const current = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
}
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  applyTheme(null);
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  load();
  await ensureDefaultAdmin();
  initTheme();
  applyBackground((state.uiSettings && state.uiSettings.background) || 'grid');
  applyFont();
  setupIdleTimer();
  const nameInput = document.getElementById('shopNameInput');
  nameInput.value = state.shopName;
  nameInput.addEventListener('change', ()=>{
    const oldName = state.shopName;
    const newName = nameInput.value.trim() || 'My Shop';
    if(newName === oldName) return;
    if(needsApproval('Change business name', ()=>nameInput.dispatchEvent(new Event('change')), ()=>{ nameInput.value = oldName; })) return;
    state.shopName = newName;
    save(); refreshBrandLogo();
    logActivity('Edit business name', oldName+' → '+newName);
  });
  document.getElementById('backupBtn').insertAdjacentHTML('afterbegin', ICON.backup);
  document.getElementById('backupBtn').addEventListener('click', openBackupModal);
  document.getElementById('businessBtn').insertAdjacentHTML('afterbegin', ICON.settings);
  document.getElementById('businessBtn').addEventListener('click', openSettingsModal);
  document.getElementById('customersBtn').insertAdjacentHTML('afterbegin', ICON.users);
  document.getElementById('customersBtn').addEventListener('click', openCustomersModal);
  document.getElementById('suppliersBtn').insertAdjacentHTML('afterbegin', ICON.truck);
  document.getElementById('suppliersBtn').addEventListener('click', ()=>openSuppliersModal(null));
  document.getElementById('employeesBtn').insertAdjacentHTML('afterbegin', ICON.badge);
  document.getElementById('employeesBtn').addEventListener('click', openEmployeesWithAccess);
  document.getElementById('activityLogBtn').insertAdjacentHTML('afterbegin', ICON.history);
  document.getElementById('activityLogBtn').addEventListener('click', ()=>{ currentPage='activityLog'; renderAll(); window.scrollTo({top:0}); });
  initAuthUI();
  refreshBrandLogo();
  initDataFolder();

  if(tryRestoreSession()){
    showAuthOverlay(false);
    currentPage = canAccessPage(currentPage) ? currentPage : firstAllowedPage();
    applyRoleVisibility();
    renderUserChip();
    renderAll();
  } else {
    showAuthOverlay(true);
    applyRoleVisibility();
    const lu = document.getElementById('loginUsername');
    if(lu) lu.focus();
  }
}
document.addEventListener('DOMContentLoaded', init);
})();
