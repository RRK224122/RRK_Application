<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shop Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --bg2:#EAE5DA;
  --surface:#FFFFFF; --surface2:#F7F4EC;
  --border:#D9D2C2; --border-strong:#C4BBA4;
  --text:#221E17; --text-dim:#6B6252; --text-faint:#948C78;
  --accent:#B5651D; --accent-ink:#FFFFFF; --accent-soft:#EFD9BC;
  --accent2:#2D6E68; --accent2-soft:#D6E6E3;
  --danger:#B33D2E; --danger-soft:#F2DCD6;
  --success:#2E7D4F; --success-soft:#DCEBDF;
  --radius-s:3px; --radius-m:8px; --radius-l:14px;
  --shadow: 0 1px 2px rgba(34,30,23,.06), 0 6px 18px rgba(34,30,23,.06);
}
:root[data-theme="dark"]{
  --bg:#10151B; --bg2:#0C1015;
  --surface:#1A212B; --surface2:#212A36;
  --border:#2B3542; --border-strong:#3A4657;
  --text:#E9EDF2; --text-dim:#9AA7B6; --text-faint:#69768A;
  --accent:#E2963C; --accent-ink:#1A140A; --accent-soft:#3A2C16;
  --accent2:#4FBDB2; --accent2-soft:#16302D;
  --danger:#E2694F; --danger-soft:#3A1F19;
  --success:#5BC98A; --success-soft:#173425;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --bg2:#0C1015;
    --surface:#1A212B; --surface2:#212A36;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E9EDF2; --text-dim:#9AA7B6; --text-faint:#69768A;
    --accent:#E2963C; --accent-ink:#1A140A; --accent-soft:#3A2C16;
    --accent2:#4FBDB2; --accent2-soft:#16302D;
    --danger:#E2694F; --danger-soft:#3A1F19;
    --success:#5BC98A; --success-soft:#173425;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:28px 28px;
  background-attachment:fixed;
  background-position:-1px -1px;
}
:root[data-theme="dark"] body, @media (prefers-color-scheme:dark){ body{ } }
body{ }
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}

#app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;flex-direction:column;
  padding:16px 18px 12px;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;width:100%;}
.brand-mark{
  width:34px;height:34px;border-radius:var(--radius-s);
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;
}
.brand-text{display:flex;flex-direction:column;min-width:0;flex:1;}
#shopNameInput{
  background:transparent;border:none;color:var(--text);
  font-size:17px;font-weight:600;padding:2px 0;width:100%;
  border-bottom:1px solid transparent;
}
#shopNameInput:focus{outline:none;border-bottom:1px solid var(--accent);}
.brand-sub{font-size:11px;color:var(--text-faint);letter-spacing:.02em;}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;width:100%;}
.icon-btn{
  width:38px;height:38px;border-radius:var(--radius-m);
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .15s, color .15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn svg{width:17px;height:17px;}

/* ---------- Layout ---------- */
main{flex:1;padding:4px 16px 96px;}
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ .page{animation:none;} }

h1,h2,h3{font-weight:600;margin:0;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 14px;gap:10px;flex-wrap:wrap;}
.page-title{font-size:20px;}
.page-sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-l);padding:16px;box-shadow:var(--shadow);
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:var(--radius-m);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:transform .1s, border-color .15s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;}
.btn-ghost:hover{border-color:var(--accent);}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-icon{padding:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  max-width:1100px;margin:0 auto;z-index:40;
}
.nav-btn{
  flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-faint);padding:6px 2px;
  cursor:pointer;border-radius:var(--radius-m);font-size:10.5px;font-weight:500;
}
.nav-btn svg{width:20px;height:20px;}
.nav-btn.active{color:var(--accent);}
.nav-btn:active{background:var(--surface2);}

@media (min-width:760px){
  .bottomnav{position:static;border-top:none;justify-content:flex-start;gap:6px;padding:0 16px 8px;background:transparent;}
  .nav-btn{flex:none;max-width:none;flex-direction:row;padding:9px 14px;border:1px solid transparent;font-size:13px;}
  .nav-btn.active{background:var(--surface);border-color:var(--border);}
  main{padding-bottom:32px;}
}

/* ---------- Dashboard ---------- */
.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero-trace{position:absolute;top:0;right:0;height:100%;width:150px;opacity:.5;pointer-events:none;}
.hero-label{font-size:12px;color:var(--text-faint);}
.hero-value{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.hero-value.neg{color:var(--danger);}
.hero-value.pos{color:var(--success);}
.hero-row{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;}
.hero-stat{min-width:100px;}
.hero-stat-label{font-size:11px;color:var(--text-faint);}
.hero-stat-value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin-top:3px;}

.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:13px 14px;}
.stat-card-label{font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
.stat-card-label svg{width:13px;height:13px;flex-shrink:0;}
.stat-card-value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:6px;}

.section-label{font-size:12.5px;font-weight:600;color:var(--text-dim);margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;}

.low-stock-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.low-stock-row:last-child{border-bottom:none;}
.pill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;font-family:'IBM Plex Mono',monospace;}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-warn{background:var(--accent-soft);color:var(--accent);}
.pill-ok{background:var(--success-soft);color:var(--success);}
.pill-muted{background:var(--surface2);color:var(--text-faint);}

/* ---------- Toolbar / search ---------- */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1;min-width:160px;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
.search-wrap input{width:100%;padding:10px 12px 10px 34px;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;}
.search-wrap input:focus{outline:none;border-color:var(--accent);}
select.filter-select{padding:10px 10px;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;}

/* ---------- List rows / table ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.item-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:12px 13px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:border-color .15s;
}
.item-row:hover{border-color:var(--border-strong);}
.item-code{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent);
  background:var(--accent-soft);padding:3px 7px;border-radius:var(--radius-s);flex-shrink:0;
  white-space:nowrap;
}
.item-main{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.item-right{text-align:right;flex-shrink:0;}
.item-price{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
.item-qty{font-size:11px;color:var(--text-faint);margin-top:2px;}

.ledger-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:12px 13px;display:flex;align-items:center;gap:12px;
}
.ledger-icon{
  width:34px;height:34px;border-radius:var(--radius-m);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ledger-icon svg{width:16px;height:16px;}
.ledger-main{flex:1;min-width:0;}
.ledger-title{font-size:13.5px;font-weight:500;}
.ledger-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.ledger-amt{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;flex-shrink:0;}
.ledger-del{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:6px;flex-shrink:0;}
.ledger-del:hover{color:var(--danger);}
.ledger-del svg{width:15px;height:15px;display:block;}

.empty-state{
  text-align:center;padding:44px 20px;color:var(--text-faint);
  border:1px dashed var(--border-strong);border-radius:var(--radius-l);
}
.empty-state svg{width:30px;height:30px;margin-bottom:10px;opacity:.6;}
.empty-state-title{font-size:14px;color:var(--text-dim);font-weight:500;}
.empty-state-sub{font-size:12.5px;margin-top:4px;}

/* ---------- Tabs (Cash page) ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);padding:4px;border-radius:var(--radius-m);width:fit-content;}
.subtab{padding:7px 15px;border-radius:var(--radius-s);border:none;background:none;color:var(--text-faint);font-size:13px;font-weight:500;cursor:pointer;}
.subtab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:84px;z-index:41;
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);border:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);
  cursor:pointer;
}
.fab svg{width:23px;height:23px;}
@media (min-width:760px){ .fab{bottom:30px;} }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s ease;
}
@media (min-width:640px){ .modal-backdrop{align-items:center;} }
.modal-sheet{
  background:var(--bg2);border:1px solid var(--border);border-top:1px solid var(--border);
  border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
@media (min-width:640px){ .modal-sheet{border-radius:var(--radius-l);max-height:85vh;} }
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:16.5px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;}
.modal-close svg{width:19px;height:19px;display:block;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-m);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-with-btn{display:flex;gap:8px;}
.field-with-btn input{flex:1;}
.field-hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.field-check{display:flex;align-items:flex-start;gap:9px;background:var(--surface2);padding:11px 12px;border-radius:var(--radius-m);}
.field-check input{width:16px;height:16px;margin-top:1px;flex-shrink:0;}
.field-check-text{font-size:12.5px;color:var(--text-dim);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

/* ---------- Scanner ---------- */
#scannerView{width:100%;border-radius:var(--radius-m);overflow:hidden;background:#000;min-height:240px;}
.scanner-status{text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:10px;}

/* ---------- Reports ---------- */
.report-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.report-table tr{border-bottom:1px solid var(--border);}
.report-table tr:last-child{border-bottom:none;}
.report-table td{padding:10px 4px;}
.report-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.report-table tr.total-row td{border-top:2px solid var(--border-strong);font-weight:700;padding-top:13px;}
.report-table tr.sub td:first-child{padding-left:18px;color:var(--text-dim);font-weight:400;}
.report-table tr.sub td:last-child{font-weight:500;}

/* ---------- Toast ---------- */
.toast{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:var(--radius-m);font-size:13px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast svg{width:15px;height:15px;flex-shrink:0;}
.toast.success{border-color:var(--success);color:var(--success);}
.toast.danger{border-color:var(--danger);color:var(--danger);}

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible, .item-row:focus-visible, .nav-btn:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}

/* ---------- Background variants ---------- */
body[data-bg="plain"]{ background-image:none; }
body[data-bg="dots"]{
  background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
  background-size:20px 20px; background-position:-1px -1px;
}
body[data-bg="soft"]{
  background-image: radial-gradient(circle at 15% 0%, var(--accent-soft) 0%, transparent 45%),
                     radial-gradient(circle at 100% 20%, var(--accent2-soft) 0%, transparent 40%);
  background-size:auto; background-attachment:fixed;
}

/* ---------- Brand logo mark ---------- */
.brand-mark{width:38px;height:38px;flex-shrink:0;}
.brand-mark svg{width:100%;height:100%;display:block;}

/* ---------- Auth overlay ---------- */
.auth-overlay{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:20px;
}
.auth-overlay.hidden{display:none;}
.auth-card{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-l);padding:28px 24px;box-shadow:var(--shadow);text-align:center;
}
.auth-logo{width:56px;height:56px;margin:0 auto 14px;}
.auth-logo svg{width:100%;height:100%;display:block;}
.auth-shopname{font-weight:700;font-size:16.5px;margin-bottom:2px;}
.auth-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:18px;}
.auth-card form{text-align:left;}
.auth-error{color:var(--danger);font-size:12.5px;margin:-4px 0 12px;min-height:1px;}
.auth-hint{font-size:11px;color:var(--text-faint);margin-top:14px;line-height:1.5;}

/* ---------- Users & Activity log ---------- */
.role-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);}
.role-pill.role-admin{background:var(--accent-soft);color:var(--accent);}
.role-pill.role-manager{background:var(--accent2-soft);color:var(--accent2);}
.role-pill.role-cashier{background:var(--success-soft);color:var(--success);}
.role-pill.role-viewer{background:var(--surface2);color:var(--text-dim);}
.user-row, .log-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
.user-row:last-child, .log-row:last-child{border-bottom:none;}
.user-row-main{flex:1;min-width:0;}
.user-row-name{font-weight:600;font-size:13.5px;}
.user-row-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.log-row-main{flex:1;min-width:0;}
.log-row-action{font-size:13px;}
.log-row-meta{font-size:11px;color:var(--text-faint);margin-top:1px;}
.topbar-userchip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-dim);padding:0 2px;}
.hidden-role{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div class="brand-text">
        <input id="shopNameInput" type="text" maxlength="40" spellcheck="false">
        <span class="brand-sub">Electronics &middot; Electrical &middot; Mobile</span>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="topbar-userchip" id="userChip"></span>
      <button class="icon-btn" id="customersBtn" title="Customers" aria-label="Customers"></button>
      <button class="icon-btn" id="suppliersBtn" title="Suppliers" aria-label="Suppliers"></button>
      <button class="icon-btn" id="usersBtn" title="Users &amp; access" aria-label="Users and access"></button>
      <button class="icon-btn" id="activityLogBtn" title="Activity log" aria-label="Activity log"></button>
      <button class="icon-btn" id="appearanceBtn" title="Appearance" aria-label="Appearance"></button>
      <button class="icon-btn" id="businessBtn" title="Business &amp; GST details" aria-label="Business and GST details"></button>
      <button class="icon-btn" id="themeToggleBtn" title="Toggle theme" aria-label="Toggle theme"></button>
      <button class="icon-btn" id="backupBtn" title="Backup &amp; restore" aria-label="Backup and restore"></button>
      <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out"></button>
    </div>
  </header>

  <nav class="bottomnav" id="bottomNav"></nav>

  <main id="pages"></main>

</div>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo" id="authLogoMark"></div>
    <div class="auth-shopname" id="authShopName"></div>
    <div class="auth-sub">Sign in to continue</div>
    <form id="loginForm" autocomplete="off">
      <div class="field">

let state = null;

function defaultState(){
  return {
    shopName:'RRK Printing Solutions & Automation',
    shopAddress:'', shopPhone:'', shopGstin:'',
    bankName:'', bankAccountNo:'', bankIfsc:'', bankUpi:'',
    invoiceTerms:'',

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    state = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){
    console.error('Load failed', e);
    state = defaultState();
  }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Save failed', e);
    toast('Could not save — device storage may be full', 'danger');
  }
  scheduleFolderSync();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   AUTH — roles, users, session, activity log
   ============================================================ */
const SESSION_KEY = 'shopledger_session';
const ROLES = {
  admin:{
    label:'Admin', desc:'Full access — data, settings, users and backups.',
    pages:'*', users:true, business:true, backup:true, log:true, topbar:true
  },
  manager:{
    label:'Manager', desc:'Runs day-to-day operations and reports; no user or backup control.',
    pages:['dashboard','inventory','sales','cash','reports'], users:false, business:false, backup:false, log:true, topbar:true
  },
  cashier:{
    label:'Cashier', desc:'Billing counter — sales, invoices, proforma and delivery challans only.',
    pages:['dashboard','sales'], users:false, business:false, backup:false, log:false, topbar:false
  },
  viewer:{
    label:'Viewer', desc:'Read-only — dashboard and reports, no editing anywhere.',
    pages:['dashboard','reports'], users:false, business:false, backup:false, log:false, topbar:false
  }
};
let currentUser = null;

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function ensureDefaultAdmin(){
  if(state.users && state.users.length) return;
  const hash = await sha256Hex('admin123');
  state.users.push({id:uid(), username:'admin', name:'Administrator', role:'admin', passHash:hash, active:true, mustChangePw:true, createdAt:todayISO()});
  save();
}
function findUser(username){
  return state.users.find(u=>u.username.toLowerCase()===String(username||'').trim().toLowerCase());
}
function roleOf(user){ return ROLES[user && user.role] || ROLES.viewer; }
function canAccessPage(pageId){
  if(!currentUser) return false;
  const r = roleOf(currentUser);
  return r.pages==='*' || r.pages.includes(pageId);
}
function firstAllowedPage(){
  const r = roleOf(currentUser);
  if(r.pages==='*') return 'dashboard';
  return r.pages[0] || 'dashboard';
}
function logActivity(action, details){
  if(!state.activityLog) state.activityLog = [];
  state.activityLog.unshift({
    id:uid(), ts:new Date().toISOString(),
    userId: currentUser ? currentUser.id : null,
    username: currentUser ? currentUser.username : 'system',
    role: currentUser ? currentUser.role : '',
    action, details: details||''
  });
  if(state.activityLog.length > 2000) state.activityLog.length = 2000;
  save();
}
function renderUserChip(){
  const chip = document.getElementById('userChip');
  if(!chip) return;
  if(currentUser){
    chip.textContent = currentUser.name || currentUser.username;
    chip.title = 'Signed in as '+currentUser.username+' ('+roleOf(currentUser).label+')';
  } else chip.textContent = '';
}
function applyRoleVisibility(){
  const r = currentUser ? roleOf(currentUser) : ROLES.viewer;
  document.getElementById('usersBtn').style.display = r.users ? '' : 'none';
  document.getElementById('activityLogBtn').style.display = r.log ? '' : 'none';
  document.getElementById('businessBtn').style.display = r.business ? '' : 'none';
  document.getElementById('backupBtn').style.display = r.backup ? '' : 'none';
  document.getElementById('customersBtn').style.display = r.topbar ? '' : 'none';
  document.getElementById('suppliersBtn').style.display = r.topbar ? '' : 'none';
  document.getElementById('shopNameInput').disabled = !r.business;
}
function showAuthOverlay(show){
  document.getElementById('authOverlay').classList.toggle('hidden', !show);
  document.getElementById('app').style.display = show ? 'none' : '';
}
function doLogout(manual){
  if(currentUser && manual) logActivity('Logout', '');
  currentUser = null;
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
  showAuthOverlay(true);
}
async function attemptLogin(username, password){
  const errEl = document.getElementById('loginError');
  const u = findUser(username);
  if(!u || !u.active){ errEl.textContent = 'Invalid username or password.'; return; }
  const hash = await sha256Hex(password);
  if(hash !== u.passHash){ errEl.textContent = 'Invalid username or password.'; return; }
  currentUser = u;
  sessionStorage.setItem(SESSION_KEY, u.id);
  errEl.textContent = '';
  showAuthOverlay(false);
  currentPage = firstAllowedPage();
  applyRoleVisibility();
  renderUserChip();
  logActivity('Login', '');
  renderAll();
}
function tryRestoreSession(){
  const uidSaved = sessionStorage.getItem(SESSION_KEY);
  if(!uidSaved) return false;
  const u = state.users.find(x=>x.id===uidSaved && x.active);
  if(!u) return false;
  currentUser = u;
  return true;
}
function initAuthUI(){
  document.getElementById('authShopName').textContent = state.shopName || 'Shop Ledger';
  document.getElementById('authLogoMark').innerHTML = brandLogoSvg();
  document.getElementById('authHint').textContent = 'First time? Default admin login is admin / admin123 — change it from Users & access after signing in.';
  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    attemptLogin(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
  });
  document.getElementById('logoutBtn').innerHTML = ICON.logout;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    confirmModal('Sign out of this session?', ()=>{ closeModal(); doLogout(true); }, 'Sign out');
  });
}

/* ============================================================
   HELPERS
   ============================================================ */
function money(n){
  n = Number(n)||0;
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'-₹':'₹') + v;
}
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function amountInWordsIndian(n){
  n = Math.round(Number(n)||0);
  if(n===0) return 'Zero Rupees Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(num){
    if(num < 20) return ones[num];
    return tens[Math.floor(num/10)] + (num%10 ? ' '+ones[num%10] : '');
  }
  function threeDigits(num){
    if(num >= 100) return ones[Math.floor(num/100)] + ' Hundred' + (num%100 ? ' '+twoDigits(num%100) : '');
    return twoDigits(num);
  }
  const neg = n < 0;
  const original = Math.abs(n);
  let n2 = original;
  const crore = Math.floor(n2 / 10000000); n2 %= 10000000;
  const lakh = Math.floor(n2 / 100000); n2 %= 100000;
  const thousand = Math.floor(n2 / 1000); n2 %= 1000;
  const hundred = n2;
  let parts = [];
  if(crore) parts.push(threeDigits(crore) + ' Crore');
  if(lakh) parts.push(threeDigits(lakh) + ' Lakh');
  if(thousand) parts.push(threeDigits(thousand) + ' Thousand');
  if(hundred) parts.push(threeDigits(hundred));
  return (neg?'Minus ':'') + (parts.join(' ') || 'Zero') + (original===1 ? ' Rupee Only' : ' Rupees Only');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.innerHTML = (kind==='success'?ICON.check:kind==='danger'?ICON.alert:'') + '<span>'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function totals(){
  const totalInvested = state.investments.reduce((s,x)=>s+x.amount,0);
  const totalRevenue = state.sales.reduce((s,x)=>s+x.total,0);
  const totalExpenses = state.expenses.reduce((s,x)=>s+x.amount,0);
  const stockPurchaseExpense = state.expenses.filter(x=>x.category==='Stock Purchase'||x.category==='Restock').reduce((s,x)=>s+x.amount,0);
  const operatingExpenses = totalExpenses - stockPurchaseExpense;
  const netProfit = totalRevenue - totalExpenses;
  const cashBalance = totalInvested + netProfit;
  const stockValue = state.inventory.reduce((s,x)=>s + (x.qty*x.costPrice), 0);
  const stockUnits = state.inventory.reduce((s,x)=>s+x.qty,0);
  const businessWorth = cashBalance + stockValue;
  return {totalInvested, totalRevenue, totalExpenses, stockPurchaseExpense, operatingExpenses, netProfit, cashBalance, stockValue, stockUnits, businessWorth};
}
function lowStockItems(){
  return state.inventory.filter(x => x.qty <= (x.minQty!=null?x.minQty:3));
}
function totalGstCollected(){
  return state.bills.reduce((s,b)=>s+(b.gstAmount||0),0);
}

function piNoStr(n){ return 'PI-' + String(n).padStart(4,'0'); }
function pendingProformas(){ return state.proformas.filter(p=>p.status!=='converted'); }
function dcNoStr(n){ return 'DC-' + String(n).padStart(4,'0'); }

/* GST math for a subtotal, given rate/type/priceMode. Returns taxable value,
   cgst/sgst/igst and grand total (what the customer actually pays). */
function computeGst(subtotal, gstEnabled, rate, type, priceMode){
  if(!gstEnabled || !rate){
    return {taxable:subtotal, gstAmount:0, cgst:0, sgst:0, igst:0, grandTotal:subtotal};
  }
  let taxable, gstAmount;
  if(priceMode==='inclusive'){
    taxable = subtotal / (1 + rate/100);
    gstAmount = subtotal - taxable;
  } else {
    taxable = subtotal;
    gstAmount = subtotal * rate/100;
  }
  const grandTotal = priceMode==='inclusive' ? subtotal : subtotal + gstAmount;
  const cgst = type==='inter' ? 0 : gstAmount/2;
  const sgst = type==='inter' ? 0 : gstAmount/2;
  const igst = type==='inter' ? gstAmount : 0;
  return {taxable, gstAmount, cgst, sgst, igst, grandTotal};
}

function renderNav(){
  const nav = document.getElementById('bottomNav');
  const allowed = PAGES.filter(p=>canAccessPage(p.id));
  nav.innerHTML = allowed.map(p => `
    <button class="nav-btn ${p.id===currentPage?'active':''}" data-page="${p.id}">
      ${p.icon}<span>${p.label}</span>
    </button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentPage = btn.dataset.page; renderAll(); });
  });
}

function goPage(id){ currentPage = id; renderAll(); window.scrollTo({top:0}); }

function renderAll(){
  if(!currentUser){ return; }
  const r = roleOf(currentUser);
  const specialOk = (currentPage==='users' && r.users) || (currentPage==='activityLog' && r.log);
  if(!specialOk && !canAccessPage(currentPage)){
    currentPage = firstAllowedPage();
  }
  renderNav();
  const main = document.getElementById('pages');
  if(currentPage==='dashboard') main.innerHTML = pageDashboard();
  else if(currentPage==='inventory') main.innerHTML = pageInventory();
  else if(currentPage==='sales') main.innerHTML = pageSales();
  else if(currentPage==='cash') main.innerHTML = pageCash();
  else if(currentPage==='reports') main.innerHTML = pageReports();
  else if(currentPage==='users') main.innerHTML = pageUsers();
  else if(currentPage==='activityLog') main.innerHTML = pageActivityLog();
  attachPageHandlers();
  if(currentPage==='users') attachUsersHandlers();
  if(currentPage==='activityLog') attachActivityLogHandlers();
}

function openUserModal(editId){
  const editing = editId ? state.users.find(u=>u.id===editId) : null;
  const isSelf = editing && currentUser && editing.id===currentUser.id;
  openModal(`
    <div class="modal-head"><span class="modal-title">${editing?'Edit user':'Add user'}</span>
      <button class="modal-close" id="modalCloseBtn">${ICON.close}</button></div>
    <div class="field"><label>Full name</label><input type="text" id="u_name" value="${editing?esc(editing.name||''):''}"></div>
    <div class="field"><label>Username</label><input type="text" id="u_username" value="${editing?esc(editing.username):''}" ${editing?'':''}></div>
    <div class="field"><label>Role</label>
      <select id="u_role" ${isSelf?'disabled':''}>
        ${Object.keys(ROLES).map(r=>`<option value="${r}" ${editing&&editing.role===r?'selected':''}>${ROLES[r].label}</option>`).join('')}
      </select>
      ${isSelf?'<div class="field-hint">You can\'t change your own role.</div>':''}
    </div>
    <div class="field"><label>${editing?'New password (leave blank to keep current)':'Password'}</label><input type="password" id="u_pass" autocomplete="new-password"></div>
    ${editing?`<div class="field-check"><input type="checkbox" id="u_active" ${editing.active?'checked':''} ${isSelf?'disabled':''}><span class="field-check-text">Account active (unchecking blocks sign-in)</span></div>`:''}
    <div class="modal-actions">
      ${editing && !isSelf ? `<button class="btn btn-danger" id="u_deleteBtn" style="flex:0.6;">${ICON.trash}</button>` : ''}
      <button class="btn btn-primary" id="u_saveBtn">Save</button>
    </div>
  `);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('u_saveBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('u_name').value.trim();
    const username = document.getElementById('u_username').value.trim();
    const role = document.getElementById('u_role').value;
    const pass = document.getElementById('u_pass').value;
    if(!username){ toast('Username is required','danger'); return; }
    const dup = findUser(username);
    if(dup && (!editing || dup.id!==editing.id)){ toast('That username is already taken','danger'); return; }
    if(!editing && !pass){ toast('Password is required for a new user','danger'); return; }
    if(editing){
      editing.name = name; editing.username = username; editing.role = isSelf?editing.role:role;
      if(!isSelf) editing.active = document.getElementById('u_active').checked;
      if(pass) editing.passHash = await sha256Hex(pass);
      logActivity('Edit user', username+' ('+role+')');
      toast('User updated','success');
    } else {
      state.users.push({id:uid(), username, name, role, passHash:await sha256Hex(pass), active:true, createdAt:todayISO()});
      logActivity('Add user', username+' ('+role+')');
      toast('User added','success');
    }
    save(); closeModal(); renderAll();
  });
  const delBtn = document.getElementById('u_deleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    confirmModal('Remove user "'+editing.username+'"? This cannot be undone.', ()=>{
      state.users = state.users.filter(u=>u.id!==editing.id);
      logActivity('Delete user', editing.username);
      save(); closeModal(); renderAll();
      toast('User removed','success');
    });
  });
}

function openItemModal(editId, snapshot){

  openModal(`
    <div class="modal-head"><div class="modal-title">${title}</div><button class="modal-close" data-close>${ICON.close}</button></div>
    <form id="itemForm">
      <div class="field">
        <label>Unique code</label>

          <input type="text" id="f_code" required placeholder="e.g. MOB-0001" value="${esc(val('code', item&&item.code))}">
          <button type="button" class="btn btn-icon" id="scanCodeBtn" title="Scan barcode">${ICON.scan}</button>
          <button type="button" class="btn btn-icon" id="genCodeBtn" title="Generate code">${ICON.dice}</button>
        </div>
        <div class="field-hint">Scan a barcode, or generate a unique internal code.</div>
      </div>
      <div class="field">
        <label>Product name</label>

      </div>
      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <select id="f_category">${state.categories.map(c=>`<option value="${c}" ${val('category', item&&item.category)===c?'selected':''}>${c}</option>`).join('')}</select>
          <button type="button" id="manageCategoriesBtn" style="background:none;border:none;color:var(--accent);font-size:11px;padding:4px 0 0;cursor:pointer;">Manage categories</button>
        </div>
        <div class="field">
          <label>Supplier (optional)</label>
          <input type="text" id="f_supplier" list="supplierNamesList" placeholder="Type or pick" value="${esc(val('supplier', item&&item.supplier))}">
          <datalist id="supplierNamesList">${state.suppliers.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>
          <button type="button" id="manageSuppliersBtn" style="background:none;border:none;color:var(--accent);font-size:11px;padding:4px 0 0;cursor:pointer;">Manage suppliers</button>

      </div>
      <div class="field">
        <label>HSN/SAC code (optional)</label>
        <input type="text" id="f_hsn" placeholder="For GST invoices" value="${esc(val('hsn', item&&item.hsn))}">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Quantity</label>
          <input type="number" id="f_qty" min="0" step="1" required value="${esc(val('qty', item&&item.qty))}">
        </div>
        <div class="field">
          <label>Low-stock alert below</label>
          <input type="number" id="f_minqty" min="0" step="1" value="${esc(val('minQty', item ? (item.minQty!=null?item.minQty:3) : 3))}">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Cost price / unit</label>
          <input type="number" id="f_cost" min="0" step="0.01" required value="${esc(val('costPrice', item&&item.costPrice))}">
        </div>
        <div class="field">
          <label>Selling price / unit</label>
          <input type="number" id="f_sell" min="0" step="0.01" required value="${esc(val('sellPrice', item&&item.sellPrice))}">
        </div>
      </div>
      ${!item ? `
      <label class="field-check">
        <input type="checkbox" id="f_logExpense" checked>
        <span class="field-check-text">Log the purchase cost (qty &times; cost price) as a Stock Purchase expense</span>
      </label>` : `
      <label class="field-check">
        <input type="checkbox" id="f_logRestock" checked>
        <span class="field-check-text" id="f_restockHint">If you increase the quantity, log the added stock's cost as a Restock expense</span>
      </label>`}
      <div class="modal-actions">
        ${item ? `<button type="button" class="btn btn-danger" id="deleteItemBtn">Delete</button>` : ''}
        <button type="submit" class="btn btn-primary">${item?'Save changes':'Add product'}</button>
      </div>
    </form>
  `);

  document.getElementById('genCodeBtn').addEventListener('click', ()=>{
    const cat = document.getElementById('f_category').value;
    document.getElementById('f_code').value = generateCode(cat);
  });
  document.getElementById('scanCodeBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ document.getElementById('f_code').value = code; });
  });
  document.getElementById('manageCategoriesBtn').addEventListener('click', ()=>{
    const snapshot = collectItemFormState();
    openCategoriesModal(()=>openItemModal(editId, snapshot));
  });
  document.getElementById('manageSuppliersBtn').addEventListener('click', ()=>{
    const snapshot = collectItemFormState();
    openSuppliersModal(()=>openItemModal(editId, snapshot));
  });
  if(item){
    document.getElementById('deleteItemBtn').addEventListener('click', ()=>{
      confirmModal(`Delete "${item.name}"? This can't be undone.`, ()=>{
        state.inventory = state.inventory.filter(x=>x.id!==item.id);
        logActivity('Delete product', item.name+' ('+item.code+')');
        save(); closeModal(); renderAll(); toast('Product deleted');
      });
    });
    const qtyEl = document.getElementById('f_qty');
    const costEl = document.getElementById('f_cost');
    const hintEl = document.getElementById('f_restockHint');
    function refreshRestockHint(){
      const newQty = parseFloat(qtyEl.value)||0;
      const cost = parseFloat(costEl.value)||0;
      const delta = newQty - item.qty;
      if(delta > 0 && cost > 0){
        hintEl.textContent = `Log the added ${delta} unit${delta===1?'':'s'} (${money(delta*cost)}) as a Restock expense`;
      } else {
        hintEl.textContent = `If you increase the quantity, log the added stock's cost as a Restock expense`;
      }
    }
    qtyEl.addEventListener('input', refreshRestockHint);
    costEl.addEventListener('input', refreshRestockHint);
  }
  document.getElementById('itemForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const code = document.getElementById('f_code').value.trim();
    const name = document.getElementById('f_name').value.trim();
    const category = document.getElementById('f_category').value;
    const supplier = document.getElementById('f_supplier').value.trim();
    const hsn = document.getElementById('f_hsn').value.trim();
    const qty = parseFloat(document.getElementById('f_qty').value)||0;
    const minQty = parseFloat(document.getElementById('f_minqty').value)||0;
    const costPrice = parseFloat(document.getElementById('f_cost').value)||0;
    const sellPrice = parseFloat(document.getElementById('f_sell').value)||0;
    if(!code || !name){ toast('Code and name are required','danger'); return; }
    const dupe = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase() && x.id!==editId);
    if(dupe){ toast('That code is already used by '+dupe.name, 'danger'); return; }

    if(item){
      const oldQty = item.qty;
      const logRestockEl = document.getElementById('f_logRestock');
      const delta = qty - oldQty;
      Object.assign(item, {code,name,category,supplier,hsn,qty,minQty,costPrice,sellPrice});
      if(logRestockEl && logRestockEl.checked && delta > 0 && costPrice > 0){
        state.expenses.push({id:uid(),category:'Restock',amount:delta*costPrice,note:`${name} (+${delta} units)`,date:todayISO()});
        toast('Product updated — restock logged as an expense','success');
      } else {
        toast('Product updated','success');
      }
      logActivity('Edit product', name+' ('+code+')');
    } else {
      state.inventory.push({id:uid(),code,name,category,supplier,hsn,qty,minQty,costPrice,sellPrice,dateAdded:todayISO()});
      const logExpense = document.getElementById('f_logExpense').checked;
      if(logExpense && qty>0 && costPrice>0){
        state.expenses.push({id:uid(),category:'Stock Purchase',amount:qty*costPrice,note:name,date:todayISO()});
      }
      logActivity('Add product', name+' ('+code+')');
      toast('Product added','success');
    }
    save(); closeModal(); renderAll();
  });
}
function generateCode(category){
  const prefix = CAT_PREFIX[category] || (category||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'GEN';
  const existing = state.inventory.filter(x=>x.code.startsWith(prefix+'-'));
  let max = 0;
  existing.forEach(x=>{ const n = parseInt(x.code.split('-')[1],10); if(!isNaN(n) && n>max) max=n; });
  return prefix + '-' + String(max+1).padStart(4,'0');
}

        <div class="field"><label>Phone</label><input type="text" id="sf_phone" value="${s?esc(s.phone||''):''}"></div>
        <div class="field"><label>GSTIN (optional)</label><input type="text" id="sf_gstin" style="text-transform:uppercase;" value="${s?esc(s.gstin||''):''}"></div>
      </div>
      <div class="field"><label>Address (optional)</label><textarea id="sf_address" rows="2" placeholder="Shop/street, city, PIN">${s?esc(s.address||''):''}</textarea></div>
      <div class="modal-actions">
        ${s ? `<button type="button" class="btn btn-danger" id="deleteSupBtn">Delete</button>` : ''}
        <button type="submit" class="btn btn-primary">${s?'Save changes':'Add supplier'}</button>
      </div>
    </form>
  `);
  if(s){
    document.getElementById('deleteSupBtn').addEventListener('click', ()=>{
      confirmModal(`Delete "${s.name}"?`, ()=>{
        state.suppliers = state.suppliers.filter(x=>x.id!==s.id);
        save(); closeModal(); toast('Supplier deleted'); if(onSaved) onSaved(null);
      });
    });
  }
  document.getElementById('supForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = document.getElementById('sf_name').value.trim();
    const phone = document.getElementById('sf_phone').value.trim();
    const gstin = document.getElementById('sf_gstin').value.trim().toUpperCase();
    const address = document.getElementById('sf_address').value.trim();
    if(!name){ toast('Enter a supplier name','danger'); return; }
    let saved;
    if(s){
      const oldName = s.name;
      s.name = name; s.phone = phone; s.gstin = gstin; s.address = address;
      saved = s;
      if(oldName !== name){
        state.inventory.forEach(x=>{ if(x.supplier===oldName) x.supplier = name; });
      }
    } else {
      saved = {id: uid(), name, phone, gstin, address};
      state.suppliers.push(saved);
    }
    save(); closeModal(); toast(s?'Supplier updated':'Supplier added','success');
    if(onSaved) onSaved(saved);
  });
}

/* ---- Record sale ---- */
function openSaleModal(){
  if(!state.inventory.length){ toast('Add a product to inventory first','danger'); return; }
  openModal(`
    <div class="modal-head"><div class="modal-title">Record sale</div><button class="modal-close" data-close>${ICON.close}</button></div>
    <form id="saleForm">
      <div class="field">
        <label>Product code</label>
        <div class="field-with-btn">
          <input type="text" id="s_code" required list="itemCodesList" placeholder="Type, pick or scan">
          <button type="button" class="btn btn-icon" id="scanSaleBtn" title="Scan barcode">${ICON.scan}</button>
        </div>
        <datalist id="itemCodesList">${state.inventory.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist>
        <div class="field-hint" id="s_itemInfo"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantity sold</label><input type="number" id="s_qty" min="1" step="1" value="1" required></div>
        <div class="field"><label>Selling price / unit</label><input type="number" id="s_price" min="0" step="0.01" required></div>
      </div>
      <div class="field"><label>Date</label><input type="date" id="s_date" value="${todayISO()}"></div>
      <div class="modal-actions"><button type="submit" class="btn btn-primary btn-block">Record sale</button></div>
    </form>
  `);
  const codeInput = document.getElementById('s_code');
  function refreshInfo(){
    const item = state.inventory.find(x=>x.code.toLowerCase()===codeInput.value.trim().toLowerCase());
    const info = document.getElementById('s_itemInfo');
    if(item){
      info.textContent = `${item.name} — ${item.qty} in stock`;
      info.style.color = item.qty<=0 ? 'var(--danger)' : '';
      if(!document.getElementById('s_price').value) document.getElementById('s_price').value = item.sellPrice;
    } else {
      info.textContent = codeInput.value ? 'No product with this code' : '';
      info.style.color = codeInput.value ? 'var(--danger)' : '';
    }
  }
  codeInput.addEventListener('input', refreshInfo);
  document.getElementById('scanSaleBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ codeInput.value = code; refreshInfo(); });
  });
  document.getElementById('saleForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const code = codeInput.value.trim();
    const item = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase());
    if(!item){ toast('No product matches that code','danger'); return; }
    const qty = parseFloat(document.getElementById('s_qty').value)||0;
    const price = parseFloat(document.getElementById('s_price').value)||0;
    const date = document.getElementById('s_date').value || todayISO();
    if(qty<=0){ toast('Enter a quantity greater than 0','danger'); return; }
    if(qty > item.qty){ toast(`Only ${item.qty} in stock`,'danger'); return; }
    item.qty -= qty;
    state.sales.push({id:uid(),code:item.code,name:item.name,qty,price,total:qty*price,costAtSale:item.costPrice,date});
    save(); closeModal(); renderAll();
    toast('Sale recorded','success');
  });
}

function renderBillGstFields(){
  const enabled = document.getElementById('bill_gstEnabled').checked;
  const box = document.getElementById('bill_gstFields');
  if(!enabled){
    box.innerHTML = '';
    renderBillItemsContainer();
    return;
  }
  box.innerHTML = `
    <div class="field-row">
      <div class="field"><label>GST rate</label>
        <select id="bill_gstRate">${GST_RATES.map(r=>`<option value="${r}" ${state.defaultGstRate===r?'selected':''}>${r}%</option>`).join('')}</select>
      </div>
      <div class="field"><label>Type</label>
        <select id="bill_gstType">
          <option value="intra" ${state.defaultGstType==='intra'?'selected':''}>Intra-state (CGST+SGST)</option>
          <option value="inter" ${state.defaultGstType==='inter'?'selected':''}>Inter-state (IGST)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Prices entered above are</label>
      <select id="bill_priceMode">
        <option value="exclusive">Exclusive of GST (added on top)</option>
        <option value="inclusive">Inclusive of GST (already included)</option>
      </select>
    </div>
  `;
  document.getElementById('bill_gstRate').addEventListener('change', renderBillItemsContainer);
  document.getElementById('bill_gstType').addEventListener('change', renderBillItemsContainer);
  document.getElementById('bill_priceMode').addEventListener('change', renderBillItemsContainer);
  renderBillItemsContainer();
}

function currentBillGstSettings(){
  const enabledEl = document.getElementById('bill_gstEnabled');
  const rateEl = document.getElementById('bill_gstRate');
  const typeEl = document.getElementById('bill_gstType');
  const modeEl = document.getElementById('bill_priceMode');
  return {
    enabled: enabledEl ? enabledEl.checked : false,
    rate: rateEl ? (parseFloat(rateEl.value)||0) : state.defaultGstRate,
    type: typeEl ? typeEl.value : state.defaultGstType,
    mode: modeEl ? modeEl.value : 'exclusive'
  };
}

function renderBillItemsContainer(){
  const container = document.getElementById('billItemsContainer');
  if(!container) return;
  const subtotal = billDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  const g = currentBillGstSettings();
  const calc = computeGst(subtotal, g.enabled, g.rate, g.type, g.mode);
  container.innerHTML = `
    ${billDraftItems.length ? `
    <div class="list" style="margin-bottom:12px;">
      ${billDraftItems.map((x,i)=>`
        <div class="ledger-row">
          <div class="ledger-main">
            <div class="ledger-title">${esc(x.name)} <span class="item-code" style="margin-left:4px;">${esc(x.code)}</span></div>
            <div class="ledger-sub">${x.qty} &times; ${money(x.price)}</div>
          </div>
          <div class="ledger-amt">${money(x.qty*x.price)}</div>
          <button type="button" class="ledger-del" data-action="remove-bill-item" data-index="${i}" aria-label="Remove item">${ICON.trash}</button>
        </div>`).join('')}
    </div>` : `<div class="empty-state" style="padding:22px;">${ICON.empty}<div class="empty-state-title">No items added yet</div></div>`}
    <div class="card" style="padding:10px 14px;">
      <table class="report-table">
        <tr><td>Subtotal</td><td>${money(subtotal)}</td></tr>
        ${g.enabled ? (g.type==='inter'
          ? `<tr><td>IGST (${g.rate}%)</td><td>${money(calc.igst)}</td></tr>`
          : `<tr><td>CGST (${g.rate/2}%)</td><td>${money(calc.cgst)}</td></tr><tr><td>SGST (${g.rate/2}%)</td><td>${money(calc.sgst)}</td></tr>`) : ''}
        <tr class="total-row"><td>Grand total</td><td>${money(calc.grandTotal)}</td></tr>
      </table>
    </div>
  `;
  container.querySelectorAll('[data-action="remove-bill-item"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      billDraftItems.splice(parseInt(btn.dataset.index,10), 1);
      renderBillItemsContainer();
    });
  });
}

function finalizeBill(kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  if(!billDraftItems.length){ toast('Add at least one item to the '+(isProforma?'proforma':'bill'),'danger'); return; }
  const grouped = {};
  billDraftItems.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
  for(const code in grouped){
    const item = state.inventory.find(x=>x.code===code);
    if(!item || grouped[code] > item.qty){
      toast(`Not enough stock for ${item?item.name:code}`,'danger');
      return;
    }
  }
  const customerName = document.getElementById('bill_custName').value.trim();
  const customerPhone = document.getElementById('bill_custPhone').value.trim();
  const customerGstin = document.getElementById('bill_custGstin').value.trim().toUpperCase();
  const customerAddress = document.getElementById('bill_custAddress').value.trim();
  const deliveryPartner = isProforma ? '' : document.getElementById('bill_deliveryPartner').value.trim();
  const trackingId = isProforma ? '' : document.getElementById('bill_trackingId').value.trim();
  const custSelectEl = document.getElementById('bill_custSelect');
  const saveCustEl = document.getElementById('bill_saveCust');
  let customerId = custSelectEl ? (custSelectEl.value || null) : null;
  if(!customerId && customerName && saveCustEl && saveCustEl.checked){
    const newCust = {id: uid(), name: customerName, phone: customerPhone, gstin: customerGstin, address: customerAddress};
    state.customers.push(newCust);
    customerId = newCust.id;
  }
  const notes = document.getElementById('bill_notes').value.trim();
  const validUntilEl = document.getElementById('bill_validUntil');
  const validUntil = isProforma && validUntilEl ? validUntilEl.value : '';
  const g = currentBillGstSettings();
  const subtotal = billDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  const calc = computeGst(subtotal, g.enabled, g.rate, g.type, g.mode);

  if(isProforma){
    const piNo = piNoStr(state.nextProformaNo);
    const pi = {
      id: uid(), piNo, date: todayISO(),
      customerId, customerName, customerPhone, customerGstin, customerAddress,
      items: billDraftItems.slice(),
      subtotal, gstEnabled: g.enabled, gstRate: g.rate, gstType: g.type, priceMode: g.mode,
      taxable: calc.taxable, gstAmount: calc.gstAmount, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst, grandTotal: calc.grandTotal,
      notes, validUntil, status: 'pending', convertedBillId: null, convertedBillNo: null
    };
    state.proformas.push(pi);
    state.nextProformaNo += 1;
    logActivity('Create proforma', piNo+' — '+money(calc.grandTotal));
    save(); closeModal();
    salesSubTab = 'proforma';
    renderAll();
    toast('Proforma invoice generated','success');
    openInvoicePreview(pi.id, 'proforma');
    if(dataDirHandle){
      writeFileToDataFolder('proforma-'+pi.piNo+'.html', new Blob([invoiceStandaloneHtml(pi,'proforma')], {type:'text/html'}));
    }
    return;
  }

  billDraftItems.forEach(x=>{
    const item = state.inventory.find(inv=>inv.code===x.code);
    if(item) item.qty -= x.qty;
  });

  const billNo = billNoStr(state.nextBillNo);
  const bill = {
    id: uid(), billNo, date: todayISO(),
    customerId, customerName, customerPhone, customerGstin, customerAddress,
    deliveryPartner, trackingId,
    items: billDraftItems.slice(),
    subtotal, gstEnabled: g.enabled, gstRate: g.rate, gstType: g.type, priceMode: g.mode,
    taxable: calc.taxable, gstAmount: calc.gstAmount, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst, grandTotal: calc.grandTotal,
    notes
  };
  state.bills.push(bill);
  state.nextBillNo += 1;

  const totalUnits = billDraftItems.reduce((s,x)=>s+x.qty,0);
  state.sales.push({
    id: uid(), code: billNo,
    name: `Bill ${billNo} (${billDraftItems.length} item${billDraftItems.length===1?'':'s'})`,
    qty: totalUnits, price: totalUnits ? (calc.taxable/totalUnits) : 0, total: calc.taxable,
    costAtSale: 0, date: bill.date, billId: bill.id, billNo
  });
  logActivity('Create bill', billNo+' — '+money(calc.grandTotal));
  save();
  closeModal();
  salesSubTab = 'bills';
  renderAll();
  toast('Bill generated','success');
  openInvoicePreview(bill.id, 'invoice');
  if(dataDirHandle){
    writeFileToDataFolder('invoice-'+bill.billNo+'.html', new Blob([invoiceStandaloneHtml(bill,'invoice')], {type:'text/html'}));
  }
}

    <div class="field-row">

      </div>
      <div class="field"><label>Vehicle number (optional)</label><input type="text" id="dc_vehicle" placeholder="e.g. UP32 AB 1234" value="${editing?esc(editing.vehicleNo||''):''}"></div>

    <div class="section-label"><span>Add items</span></div>
    <div class="field">
      <div class="field-with-btn">
        <input type="text" id="dc_itemCode" list="itemCodesList" placeholder="Product code — type, pick or scan">

      </div>
      <datalist id="itemCodesList">${state.inventory.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist>
      <div class="field-hint" id="dc_itemInfo"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Qty</label><input type="number" id="dc_itemQty" min="1" step="1" value="1"></div>
      <div class="field"><label>Declared value / unit (optional)</label><input type="number" id="dc_itemPrice" min="0" step="0.01" placeholder="For transport value only"></div>
    </div>
    <button type="button" class="btn btn-block" id="dc_addItemBtn">${ICON.plus}<span>Add to challan</span></button>

    <div id="dcItemsContainer" style="margin-top:16px;"></div>

    <label class="field-check" style="margin-top:6px;">
      <input type="checkbox" id="dc_reduceStock" ${(!editing || editing.reducesStock)?'checked':''}>
      <span class="field-check-text">Reduce stock for these items (goods are physically leaving)</span>
    </label>
    <div class="field" style="margin-top:6px;"><label>Notes (optional)</label><input type="text" id="dc_notes" placeholder="e.g. To be returned within 30 days" value="${editing?esc(editing.notes||''):''}"></div>

    <div class="modal-actions"><button type="button" class="btn btn-primary btn-block" id="dc_generateBtn">${editing?'Save changes':'Generate delivery challan'}</button></div>
  `);

  const custSelect = document.getElementById('dc_custSelect');
  const custNameInput = document.getElementById('dc_custName');
  const custPhoneInput = document.getElementById('dc_custPhone');
  const custAddressInput = document.getElementById('dc_custAddress');
  const saveCustWrap = document.getElementById('dc_saveCustWrap');
  function applyCustomerSelection(){
    const id = custSelect.value;
    if(id){
      const c = state.customers.find(x=>x.id===id);
      if(c){
        custNameInput.value = c.name;
        custPhoneInput.value = c.phone||'';
        custAddressInput.value = c.address||'';
      }
      saveCustWrap.style.display = 'none';
    } else {
      saveCustWrap.style.display = custNameInput.value.trim() ? '' : 'none';
    }
  }
  custSelect.addEventListener('change', applyCustomerSelection);
  custNameInput.addEventListener('input', ()=>{
    if(!custSelect.value) saveCustWrap.style.display = custNameInput.value.trim() ? '' : 'none';
  });
  document.getElementById('dc_addCustBtn').addEventListener('click', ()=>{
    openCustomerModal(null, (newCust)=>{
      if(!newCust) return;
      const keepItems = dcDraftItems.slice();
      openNewDcModal(editDcId);
      dcDraftItems = keepItems;
      renderDcItemsContainer();
      const sel = document.getElementById('dc_custSelect');
      if(sel){ sel.value = newCust.id; sel.dispatchEvent(new Event('change')); }
    });
  });

  const codeInput = document.getElementById('dc_itemCode');
  function refreshItemInfo(){
    const item = state.inventory.find(x=>x.code.toLowerCase()===codeInput.value.trim().toLowerCase());
    const info = document.getElementById('dc_itemInfo');
    if(item){
      info.textContent = `${item.name} — ${item.qty} in stock`;
      info.style.color = item.qty<=0 ? 'var(--danger)' : '';
    } else {
      info.textContent = codeInput.value ? 'No product with this code' : '';
      info.style.color = codeInput.value ? 'var(--danger)' : '';
    }
  }
  codeInput.addEventListener('input', refreshItemInfo);
  document.getElementById('dc_scanBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ codeInput.value = code; refreshItemInfo(); });
  });
  document.getElementById('dc_addItemBtn').addEventListener('click', ()=>{
    const code = codeInput.value.trim();
    const item = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase());
    if(!item){ toast('No product matches that code','danger'); return; }
    const qty = parseFloat(document.getElementById('dc_itemQty').value)||0;
    const price = parseFloat(document.getElementById('dc_itemPrice').value)||0;
    if(qty<=0){ toast('Enter a quantity greater than 0','danger'); return; }
    const reduceStock = document.getElementById('dc_reduceStock').checked;
    if(reduceStock){
      // Available stock = current stock, plus whatever this same DC already had reserved (when editing).
      const originalQty = editing ? (editing.items.filter(x=>x.code===item.code).reduce((s,x)=>s+x.qty,0)) : 0;
      const alreadyInDraft = dcDraftItems.filter(x=>x.code===item.code).reduce((s,x)=>s+x.qty,0);
      const available = item.qty + originalQty;
      if(alreadyInDraft + qty > available){ toast(`Only ${available} available for ${item.name}`,'danger'); return; }
    }
    dcDraftItems.push({code:item.code, name:item.name, hsn:item.hsn||'', qty, price});
    codeInput.value=''; document.getElementById('dc_itemQty').value='1'; document.getElementById('dc_itemPrice').value='';
    document.getElementById('dc_itemInfo').textContent='';
    renderDcItemsContainer();
    codeInput.focus();
  });
  renderDcItemsContainer();
  document.getElementById('dc_generateBtn').addEventListener('click', ()=>finalizeDc(editDcId));
}
function renderDcItemsContainer(){
  const container = document.getElementById('dcItemsContainer');
  if(!container) return;
  const totalQty = dcDraftItems.reduce((s,x)=>s+x.qty,0);
  const totalValue = dcDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  container.innerHTML = `
    ${dcDraftItems.length ? `
    <div class="list" style="margin-bottom:12px;">
      ${dcDraftItems.map((x,i)=>`
        <div class="ledger-row">
          <div class="ledger-main">
            <div class="ledger-title">${esc(x.name)} <span class="item-code" style="margin-left:4px;">${esc(x.code)}</span></div>
            <div class="ledger-sub">${x.qty} unit${x.qty===1?'':'s'}${x.price?' &middot; '+money(x.price)+'/unit':''}</div>
          </div>
          <button type="button" class="ledger-del" data-action="remove-dc-item" data-index="${i}" aria-label="Remove item">${ICON.trash}</button>
        </div>`).join('')}
    </div>` : `<div class="empty-state" style="padding:22px;">${ICON.empty}<div class="empty-state-title">No items added yet</div></div>`}
    ${dcDraftItems.length ? `<div class="card" style="padding:10px 14px;">
      <table class="report-table">
        <tr><td>Total quantity</td><td>${totalQty} unit${totalQty===1?'':'s'}</td></tr>
        ${totalValue?`<tr class="total-row"><td>Declared value</td><td>${money(totalValue)}</td></tr>`:''}
      </table>
    </div>` : ''}
  `;
  container.querySelectorAll('[data-action="remove-dc-item"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      dcDraftItems.splice(parseInt(btn.dataset.index,10), 1);
      renderDcItemsContainer();
    });
  });
}
function finalizeDc(editDcId){
  if(!dcDraftItems.length){ toast('Add at least one item to the challan','danger'); return; }
  const editing = editDcId ? state.deliveryChallans.find(x=>x.id===editDcId) : null;
  const reduceStock = document.getElementById('dc_reduceStock').checked;

  // Validate stock availability before touching anything.
  if(reduceStock){
    const grouped = {};
    dcDraftItems.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
    for(const code in grouped){
      const item = state.inventory.find(x=>x.code===code);
      const originalQty = editing ? editing.items.filter(x=>x.code===code).reduce((s,x)=>s+x.qty,0) : 0;
      const available = (item?item.qty:0) + (editing && editing.reducesStock ? originalQty : 0);
      if(!item || grouped[code] > available){
        toast(`Not enough stock for ${item?item.name:code}`,'danger');
        return;
      }
    }
  }

  const customerName = document.getElementById('dc_custName').value.trim();
  const customerPhone = document.getElementById('dc_custPhone').value.trim();
  const customerAddress = document.getElementById('dc_custAddress').value.trim();
  const custSelectEl = document.getElementById('dc_custSelect');
  const saveCustEl = document.getElementById('dc_saveCust');
  let customerId = custSelectEl ? (custSelectEl.value || null) : null;
  if(!customerId && customerName && saveCustEl && saveCustEl.checked){
    const newCust = {id: uid(), name: customerName, phone: customerPhone, gstin:'', address: customerAddress};
    state.customers.push(newCust);
    customerId = newCust.id;
  }
  const reason = document.getElementById('dc_reason').value;
  const vehicleNo = document.getElementById('dc_vehicle').value.trim();
  const notes = document.getElementById('dc_notes').value.trim();

  // Restore stock from the OLD version of this DC (if editing and it previously reduced stock),
  // then deduct stock for the NEW item list (if this version reduces stock).
  if(editing && editing.reducesStock){
    editing.items.forEach(x=>{
      const item = state.inventory.find(inv=>inv.code===x.code);
      if(item) item.qty += x.qty;
    });
  }
  if(reduceStock){
    dcDraftItems.forEach(x=>{
      const item = state.inventory.find(inv=>inv.code===x.code);
      if(item) item.qty -= x.qty;
    });
  }

  if(editing){
    Object.assign(editing, {
      customerId, customerName, customerPhone, customerAddress,
      reason, vehicleNo, notes, reducesStock: reduceStock,
      items: dcDraftItems.slice()
    });
    logActivity('Edit delivery challan', editing.dcNo);
    save(); closeModal(); renderAll(); toast('Delivery challan updated','success');
    openDcPreview(editing.id);
    if(dataDirHandle) writeFileToDataFolder('dc-'+editing.dcNo+'.html', new Blob([dcStandaloneHtml(editing)], {type:'text/html'}));
  } else {
    const dcNo = dcNoStr(state.nextDcNo);
    const dc = {
      id: uid(), dcNo, date: todayISO(),
      customerId, customerName, customerPhone, customerAddress,
      reason, vehicleNo, notes, reducesStock: reduceStock,
      items: dcDraftItems.slice()
    };
    state.deliveryChallans.push(dc);
    state.nextDcNo += 1;
    logActivity('Create delivery challan', dcNo);
    save(); closeModal();
    salesSubTab = 'dc';
    renderAll();
    toast('Delivery challan generated','success');
    openDcPreview(dc.id);
    if(dataDirHandle) writeFileToDataFolder('dc-'+dc.dcNo+'.html', new Blob([dcStandaloneHtml(dc)], {type:'text/html'}));
  }
}

/* ---- Invoice / proforma preview / print / delete ---- */
function openInvoicePreview(id, kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  const b = isProforma ? state.proformas.find(x=>x.id===id) : state.bills.find(x=>x.id===id);

  const docNo = isProforma ? b.piNo : b.billNo;

  openModal(`
    <div class="modal-head"><div class="modal-title">${esc(docNo)}</div><button class="modal-close" data-close>${ICON.close}</button></div>

      <div class="field"><label>Tracking ID</label><input type="text" id="pv_trackingId" value="${esc(b.trackingId||'')}"></div>
    </div>

      <option value="Delhivery"></option>
      <option value="Blue Dart"></option>
      <option value="DTDC"></option>

      <option value="Ekart"></option>

    </div>
  `);
  document.getElementById('printBillBtn').addEventListener('click', ()=> printHtmlDocument(invoiceStandaloneHtml(b, kind)));
  document.getElementById('saveBillBtn').addEventListener('click', ()=>{

  if(isConverted){

  }

    document.getElementById('saveTrackingBtn').addEventListener('click', ()=>{
      b.deliveryPartner = document.getElementById('pv_deliveryPartner').value.trim();
      b.trackingId = document.getElementById('pv_trackingId').value.trim();
      save();
      toast('Delivery info saved','success');
      openInvoicePreview(b.id, 'invoice');

    document.getElementById('convertBillBtn').addEventListener('click', ()=>{

    });
  }
  document.getElementById('deleteBillBtn').addEventListener('click', ()=>{
    if(isProforma){
      confirmModal('Delete this proforma invoice?', ()=>{
        state.proformas = state.proformas.filter(x=>x.id!==b.id);
        logActivity('Delete proforma', docNo);
        save(); closeModal(); renderAll(); toast('Proforma deleted');
      });

      confirmModal('Delete this bill? Stock will not be restored automatically, and its linked revenue entry will also be removed.', ()=>{
        state.bills = state.bills.filter(x=>x.id!==b.id);
        state.sales = state.sales.filter(x=>x.billId!==b.id);
        logActivity('Delete bill', docNo);
        save(); closeModal(); renderAll(); toast('Bill deleted');

}
function convertProformaToInvoice(proformaId){
  const pi = state.proformas.find(x=>x.id===proformaId);
  if(!pi || pi.status==='converted') return;
  const grouped = {};
  pi.items.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
  for(const code in grouped){
    const item = state.inventory.find(x=>x.code===code);
    if(!item || grouped[code] > item.qty){
      toast(`Not enough stock for ${item?item.name:code} — adjust stock or the proforma before converting`,'danger');
      return;
    }
  }
  pi.items.forEach(x=>{
    const item = state.inventory.find(inv=>inv.code===x.code);
    if(item) item.qty -= x.qty;
  });
  const billNo = billNoStr(state.nextBillNo);
  const bill = {
    id: uid(), billNo, date: todayISO(),
    customerId: pi.customerId||null, customerName: pi.customerName, customerPhone: pi.customerPhone,
    customerGstin: pi.customerGstin, customerAddress: pi.customerAddress,
    deliveryPartner: '', trackingId: '',
    items: pi.items.slice(),
    subtotal: pi.subtotal, gstEnabled: pi.gstEnabled, gstRate: pi.gstRate, gstType: pi.gstType, priceMode: pi.priceMode,
    taxable: pi.taxable, gstAmount: pi.gstAmount, cgst: pi.cgst, sgst: pi.sgst, igst: pi.igst, grandTotal: pi.grandTotal,
    notes: pi.notes, fromProformaId: pi.id, fromProformaNo: pi.piNo
  };
  state.bills.push(bill);
  state.nextBillNo += 1;
  const totalUnits = pi.items.reduce((s,x)=>s+x.qty,0);
  state.sales.push({
    id: uid(), code: billNo,

function printHtmlDocument(html){
  // Print via a hidden same-page iframe instead of window.open(), so this
  // works even when browsers or embedded viewers block pop-up windows.
  let frame = document.getElementById('invoicePrintFrame');
  if(!frame){
    frame = document.createElement('iframe');
    frame.id = 'invoicePrintFrame';
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    document.body.appendChild(frame);
  }
  try{
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(()=>{
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }catch(e){
        console.error('Print failed', e);
        toast('Could not open the print dialog — use the Save file option instead','danger');
      }
    }, 250);
  }catch(e){
    console.error('Print setup failed', e);
    toast('Could not prepare the document for printing — use the Save file option instead','danger');
  }
}
function saveHtmlFileGeneric(filename, html, label){
  const blob = new Blob([html], {type:'text/html'});
  if(dataDirHandle){
    writeFileToDataFolder(filename, blob).then(ok=>{
      if(ok) toast((label||'File')+' saved to your data folder','success');
      else { triggerDownload(filename, blob); toast((label||'File')+' downloaded','success'); }
    });
  } else {
    triggerDownload(filename, blob);
    toast((label||'File')+' downloaded — open it in a browser to view or print','success');
  }
}

/* ============================================================
   DATA FOLDER — auto-save JSON / Excel / SQLite next to the file
   ============================================================ */
let dataDirHandle = null;
const DIRDB_NAME = 'shopledger_dirdb';
const DIRDB_STORE = 'handles';

function idbGetDirHandle(){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(null); return; }
    let req;
    try{ req = indexedDB.open(DIRDB_NAME, 1); }catch(e){ resolve(null); return; }
    req.onupgradeneeded = ()=> req.result.createObjectStore(DIRDB_STORE);
    req.onsuccess = ()=>{
      const db = req.result;
      try{
        const tx = db.transaction(DIRDB_STORE, 'readonly');
        const getReq = tx.objectStore(DIRDB_STORE).get('dir');
        getReq.onsuccess = ()=> resolve(getReq.result || null);
        getReq.onerror = ()=> resolve(null);
      }catch(e){ resolve(null); }
    };
    req.onerror = ()=> resolve(null);
  });
}
function idbSetDirHandle(handle){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(); return; }
    let req;
    try{ req = indexedDB.open(DIRDB_NAME, 1); }catch(e){ resolve(); return; }
    req.onupgradeneeded = ()=> req.result.createObjectStore(DIRDB_STORE);
    req.onsuccess = ()=>{
      const db = req.result;
      const tx = db.transaction(DIRDB_STORE, 'readwrite');
      tx.objectStore(DIRDB_STORE).put(handle, 'dir');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> resolve();
    };
    req.onerror = ()=> resolve();
  });
}

async function initDataFolder(){
  try{
    const handle = await idbGetDirHandle();
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      dataDirHandle = handle;
      updateDataFolderStatus();
    } else {
      updateDataFolderStatus(true);
    }
  }catch(e){ /* handle from a previous browser/session may no longer be valid — ignore */ }
}

async function chooseDataFolder(){
  if(!window.showDirectoryPicker){
    toast("This browser can't save straight to a folder — use the download buttons instead", 'danger');
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    dataDirHandle = handle;
    await idbSetDirHandle(handle);
    updateDataFolderStatus();
    toast('Data folder set — backups will auto-save here','success');
    await syncToDataFolder();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('Could not access that folder','danger');
  }
}
async function reconnectDataFolder(){
  if(!dataDirHandle){
    const handle = await idbGetDirHandle();
    if(!handle) return chooseDataFolder();
    dataDirHandle = handle;
  }
  const ok = await ensureDataFolderPermission();
  if(ok){ updateDataFolderStatus(); toast('Data folder reconnected','success'); await syncToDataFolder(); }
  else toast('Folder access was not granted','danger');
}
async function ensureDataFolderPermission(){
  if(!dataDirHandle) return false;
  try{
    let perm = await dataDirHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') perm = await dataDirHandle.requestPermission({mode:'readwrite'});
    return perm === 'granted';
  }catch(e){ return false; }
}
async function writeFileToDataFolder(filename, blob){
  if(!dataDirHandle) return false;
  const ok = await ensureDataFolderPermission();
  if(!ok) return false;
  try{
    const fileHandle = await dataDirHandle.getFileHandle(filename, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return true;
  }catch(e){ console.error('Write failed', filename, e); return false; }
}
function updateDataFolderStatus(needsReconnect){
  const el = document.getElementById('dataFolderStatus');
  if(el){
    el.textContent = dataDirHandle
      ? ('Auto-saving JSON, Excel and SQLite to: '+(dataDirHandle.name||'selected folder'))
      : (needsReconnect ? 'Folder was set previously — reconnect to resume auto-save' : 'Not set — data only lives in this browser until you export it');
  }
  const btn = document.getElementById('chooseDataFolderBtn');
  if(btn) btn.textContent = dataDirHandle ? 'Change data folder' : (needsReconnect ? 'Set up data folder (auto-save)' : 'Set up data folder (auto-save)');
  const reconnectBtn = document.getElementById('reconnectDataFolderBtn');
  if(reconnectBtn) reconnectBtn.style.display = (needsReconnect && !dataDirHandle) ? '' : 'none';
}

let syncTimer = null;
function scheduleFolderSync(){
  if(!dataDirHandle) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToDataFolder, 800);
}
async function syncToDataFolder(){
  if(!dataDirHandle) return;
  const ok = await ensureDataFolderPermission();
  if(!ok) return;
  try{
    await writeFileToDataFolder('shop-ledger-backup.json', new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const xlsxBlob = await buildXlsxBlob();
    if(xlsxBlob) await writeFileToDataFolder('shop-ledger-data.xlsx', xlsxBlob);
    const dbBlob = await buildDbBlob();
    if(dbBlob) await writeFileToDataFolder('shop-ledger-data.db', dbBlob);
  }catch(e){ console.error('Folder sync failed', e); }
}

let sqlJsLoadPromise = null;
function loadSqlJsLib(){
