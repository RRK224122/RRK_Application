function vcardText(e){
  const L = ['BEGIN:VCARD','VERSION:3.0','FN:'+e.name,'ORG:'+state.shopName];
  if(e.designation) L.push('TITLE:'+e.designation);
  if(e.phone) L.push('TEL;TYPE=CELL:'+e.phone);
  if(e.email) L.push('EMAIL:'+e.email);
  L.push('END:VCARD');
  return L.join('\n');
}
/* Visiting card, 90 mm x 54 mm. The QR code is a contact card: scanning it offers "Save contact". */
function visitingCardHtml(e, n){
  const line = (k,v)=> v ? `<div style="display:flex;gap:1.6mm;margin-top:.9mm;"><span style="flex:0 0 3mm;font-weight:700;color:#B5651D;">${k}</span><span style="min-width:0;word-break:break-word;">${v}</span></div>` : '';
  return `<div style="position:relative;width:90mm;height:54mm;box-sizing:border-box;overflow:hidden;background:#fff;border:.25mm solid #cfd6df;font-family:Arial,Helvetica,sans-serif;color:#1F2A33;break-inside:avoid;">
    <div style="position:absolute;left:0;top:0;bottom:0;width:2.6mm;background:linear-gradient(180deg,#B5651D,#2D6E68);"></div>
    <div style="position:absolute;left:6.5mm;top:3.5mm;display:flex;align-items:center;gap:2.5mm;">
      <img src="${BRAND_LOGO}" alt="" style="width:13.5mm;height:13.5mm;display:block;">
      <div><div style="font-size:12pt;font-weight:800;letter-spacing:.3mm;line-height:1;color:#1F2A33;">${esc(state.shopName)}</div><div style="font-size:4.6pt;letter-spacing:.35mm;color:#4A5A6E;margin-top:.9mm;">${esc(VC_TAGLINE)}</div></div>
    </div>
    <div style="position:absolute;left:6.5mm;top:21mm;right:30mm;">
      <div style="font-size:11.5pt;font-weight:700;line-height:1.1;">${esc(e.name)}</div>
      <div style="font-size:7.5pt;color:#4A5A6E;margin-top:.6mm;">${esc(e.designation||'')}</div>
      <div style="font-size:7pt;margin-top:1.8mm;">
        ${line('M', e.phone?esc(e.phone):'')}
        ${line('E', e.email?esc(e.email):'')}
        ${line('A', state.shopAddress?esc(state.shopAddress).replace(/\n/g,', '):'')}
      </div>
    </div>
    <div style="position:absolute;right:4.5mm;top:17mm;width:23mm;line-height:0;text-align:center;">${qrSvg(vcardText(e), 87, 'L')}<div style="font-size:4.5pt;color:#4A5A6E;margin-top:.6mm;line-height:1;">SCAN TO SAVE CONTACT</div></div>
    <div style="position:absolute;left:2.6mm;right:0;bottom:0;height:1.8mm;background:linear-gradient(90deg,#B5651D,#2D6E68);"></div>
  </div>`;
}
function visitingCardStandaloneHtml(e, copies){
  let cards = ''; for(let i=0;i<copies;i++) cards += visitingCardHtml(e, i);
  const css = copies>1
    ? '*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}@page{size:A4;margin:9mm 10mm;}body{margin:0;}.sheet{display:grid;grid-template-columns:repeat(2,90mm);justify-content:center;}'
    : '*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}@page{size:A4;margin:14mm;}body{margin:20px;}';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Visiting card — '+esc(e.name)+'</title><style>'+css+'</style></head><body><div class="sheet">'+cards+'</div></body></html>';
}
function openEmployeeCardModal(empRecordId, mode){
  if(!canViewEmployees()){ toast('Admin access needed','danger'); return; }
  const e = state.employees.find(x=>x.id===empRecordId); if(!e) return;
  if(!e.empId){ toast('This employee has no ID yet','danger'); return; }
  mode = mode || 'id';
  const isVc = mode==='vc';
  openModal(`
    <div class="modal-head"><div class="modal-title">${isVc?'Visiting card':'ID card &amp; QR'}</div><button class="modal-close" id="cardCloseBtn">${ICON.close}</button></div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <button type="button" class="btn btn-sm ${isVc?'':'btn-primary'}" id="tabIdBtn" style="flex:1;">ID card</button>
      <button type="button" class="btn btn-sm ${isVc?'btn-primary':''}" id="tabVcBtn" style="flex:1;">Visiting card</button>
    </div>
    <div style="padding:4px 0 10px;overflow-x:auto;">${isVc ? `<div style="zoom:.85;width:90mm;margin:0 auto;">${visitingCardHtml(e,'p')}</div>` : employeeCardHtml(e)}</div>
    ${isVc
      ? `<p style="font-size:12px;color:var(--text-faint);text-align:center;margin:0 0 8px;line-height:1.5;">${(!e.email?'No email saved for this employee — add it in Edit to show it on the card. ':'')}The QR code saves the contact (name, title, phone, email). Size 90 × 54 mm.</p>`
      : `<p style="font-size:12px;color:var(--text-faint);text-align:center;margin:0 0 8px;">The QR code contains the employee ID: ${esc(e.empId)}</p>`}
    <div class="modal-actions">
      ${isVc
        ? `<button type="button" class="btn" id="cardSaveBtn"><span>Save file</span></button>
           <button type="button" class="btn" id="cardSheetBtn"><span>Print 10 cards</span></button>
           <button type="button" class="btn btn-primary" id="cardPrintBtn">${ICON.printer}<span>Print</span></button>`
        : `<button type="button" class="btn" id="cardQrBtn"><span>Save QR image</span></button>
           <button type="button" class="btn" id="cardSaveBtn"><span>Save card</span></button>
           <button type="button" class="btn btn-primary" id="cardPrintBtn">${ICON.printer}<span>Print</span></button>`}
    </div>`);
  document.getElementById('cardCloseBtn').addEventListener('click', closeModal);
  document.getElementById('tabIdBtn').addEventListener('click', ()=>openEmployeeCardModal(empRecordId,'id'));
  document.getElementById('tabVcBtn').addEventListener('click', ()=>openEmployeeCardModal(empRecordId,'vc'));
  if(isVc){
    document.getElementById('cardPrintBtn').addEventListener('click', ()=>{ logActivity('Print visiting card', e.name); printHtmlDocument(visitingCardStandaloneHtml(e,1)); });
    document.getElementById('cardSheetBtn').addEventListener('click', ()=>{ logActivity('Print visiting cards (10)', e.name); printHtmlDocument(visitingCardStandaloneHtml(e,10)); });
    document.getElementById('cardSaveBtn').addEventListener('click', ()=>saveHtmlFileGeneric('visiting-card-'+e.empId+'.html', visitingCardStandaloneHtml(e,10), 'Visiting card'));
    return;
  }
  document.getElementById('cardPrintBtn').addEventListener('click', ()=>printHtmlDocument(employeeCardStandaloneHtml(e)));
  document.getElementById('cardSaveBtn').addEventListener('click', ()=>saveHtmlFileGeneric('id-card-'+e.empId+'.html', employeeCardStandaloneHtml(e), 'ID card'));
  document.getElementById('cardQrBtn').addEventListener('click', ()=>{
    const svg = qrSvg(e.empId, 512);
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
      cv.getContext('2d').drawImage(img,0,0,512,512);
      cv.toBlob(b=>{ triggerDownload('qr-'+e.empId+'.png', b); toast('QR image downloaded','success'); }, 'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function maskAcc(n){ n = String(n||''); return n.length>4 ? '••••'+n.slice(-4) : n; }
function empBankLines(emp){
  if(!emp) return [];
  const L = [];
  if(emp.bankHolder) L.push('A/c holder: '+emp.bankHolder);
  if(emp.bankName) L.push('Bank: '+emp.bankName);
  if(emp.bankAccountNo) L.push('A/c No: '+emp.bankAccountNo);
  if(emp.bankIfsc) L.push('IFSC: '+emp.bankIfsc);
  if(emp.bankBranch) L.push('Branch: '+emp.bankBranch);
  if(emp.bankUpi) L.push('UPI: '+emp.bankUpi);
  if(emp.bankDetails) L.push(emp.bankDetails);
  return L;
}
/* Every salary payment must also be an expense, so it reduces net profit and cash balance. */
function salaryExpenseNote(p){ return p.employeeName+' — '+monthLabel(p.month)+' ('+p.payslipNo+')'; }
function syncSalaryExpenses(){
  if(!state.salaryPayments) return;
  let changed = false;
  state.salaryPayments.forEach(p=>{
    const linked = p.expenseId && state.expenses.some(x=>x.id===p.expenseId);
    if(linked || p.expenseRemoved) return;
    if(p.expenseId){ p.expenseRemoved = true; changed = true; return; }   // user deleted it on purpose
    const ex = {id:uid(), category:'Salary', amount:p.netPay, note:salaryExpenseNote(p), date:p.paidDate||todayISO(), salaryPaymentId:p.id};
    state.expenses.push(ex); p.expenseId = ex.id; changed = true;
  });
  if(changed) save();
}

function recordSalaryPayment(emp, o){
  const netPay = o.basic + o.allowances - o.deductions;
  const payslipNo = 'PS-' + String(state.nextPayslipNo).padStart(4,'0');
  const payment = {
    id:uid(), payslipNo, employeeId: emp.id, employeeName: emp.name, designation: emp.designation||'',
    month:o.month, basic:o.basic, allowances:o.allowances, deductions:o.deductions, netPay, paidDate:o.paidDate, notes:o.notes||''
  };
  const salaryExpense = {id:uid(), category:'Salary', amount:netPay, note:salaryExpenseNote(payment), date:o.paidDate, salaryPaymentId:payment.id};
  payment.expenseId = salaryExpense.id;
  state.expenses.push(salaryExpense);
  state.salaryPayments.push(payment);
  state.nextPayslipNo += 1;
  logActivity('Pay salary', emp.name+' — '+monthLabel(o.month)+' — '+money(netPay)+' (deducted from profit/cash as Salary expense)');
  return payment;
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode failed'));
      img.onload = ()=>{
        let {width:w, height:h} = img;
        if(w>maxDim || h>maxDim){
          const scale = maxDim / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const current = (state.uiSettings && state.uiSettings.background) || 'grid';
  const hasImage = !!(state.uiSettings && state.uiSettings.bgImage);
  openModal(`
    <div class="modal-head"><span class="modal-title">Appearance</span>
      <button class="modal-close" id="modalCloseBtn">${ICON.close}</button></div>
    <div class="field"><label>Background style</label>
      <select id="bgSelect">
        ${BG_OPTIONS.map(o=>`<option value="${o.id}" ${o.id===current?'selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>
    <div id="bgImageBlock" style="display:${current==='image'?'':'none'};">
      <div class="bg-preview" id="bgPreview" style="${hasImage?`background-image:url('${state.uiSettings.bgImage}')`:''}">${hasImage?'':'No image chosen yet'}</div>
      <div class="field">
        <label>Choose a photo</label>
        <input type="file" id="bgImageInput" accept="image/*">
        <div class="field-hint">Saved on this device only. Large photos are resized automatically.</div>
      </div>
      ${hasImage?`<button type="button" class="btn btn-danger btn-block" id="bgImageRemoveBtn" style="margin-bottom:10px;">Remove image</button>`:''}
    </div>
    <div class="modal-actions"><button class="btn btn-primary" id="bgSaveBtn" style="flex:1;">Save</button></div>
  `);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  let pendingImage = null;
  const bgSelect = document.getElementById('bgSelect');
  bgSelect.addEventListener('change', ()=>{
    document.getElementById('bgImageBlock').style.display = bgSelect.value==='image' ? '' : 'none';
  });
  const imgInput = document.getElementById('bgImageInput');
  if(imgInput) imgInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      pendingImage = await resizeImageFile(file, 1600);
      const prev = document.getElementById('bgPreview');
      prev.style.backgroundImage = `url('${pendingImage}')`;
      prev.textContent = '';
    }catch(err){
      toast('Could not read that image','danger');
    }
  });
  const removeBtn = document.getElementById('bgImageRemoveBtn');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{
    pendingImage = 'REMOVE';
    const prev = document.getElementById('bgPreview');
    prev.style.backgroundImage = '';
    prev.textContent = 'No image chosen yet';
  });
  document.getElementById('bgSaveBtn').addEventListener('click', ()=>{
    const val = bgSelect.value;
    if(!state.uiSettings) state.uiSettings = {};
    if(val==='image'){
      if(pendingImage === 'REMOVE'){ delete state.uiSettings.bgImage; }
      else if(pendingImage){ state.uiSettings.bgImage = pendingImage; }
      if(!state.uiSettings.bgImage){ toast('Choose a photo first','danger'); return; }
    }
    state.uiSettings.background = val;
    try{
      save();
    }catch(err){
      toast('That image is too large to save — try a smaller photo','danger');
      return;
    }
    applyBackground(val); closeModal();
    logActivity('Change appearance', 'background: '+val);
    toast('Appearance updated','success');
  });
}

function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-sheet">${html}</div></div>`;
  root.querySelector('#modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){
  closeScannerOverlay();
  document.getElementById('modalRoot').innerHTML = '';
}

function openItemModal(editId, snapshot){

        <div class="field">
          <label>Category</label>
          <select id="f_category">${state.categories.map(c=>`<option value="${c}" ${val('category', item&&item.category)===c?'selected':''}>${c}</option>`).join('')}</select>

      </div>
      <div class="field-row">
        <div class="field">
          <label>Quantity</label>
          <input type="number" id="f_qty" min="0" step="1" required value="${esc(val('qty', item&&item.qty))}">
        </div>
        <div class="field">
          <label>Low-stock alert below</label>
          <input type="number" id="f_minqty" min="0" step="1" value="${esc(val('minQty', item ? (item.minQty!=null?item.minQty:3) : 3))}">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Cost price / unit</label>
          <input type="number" id="f_cost" min="0" step="0.01" required value="${esc(val('costPrice', item&&item.costPrice))}">
        </div>

      </div>
      ${!item ? `
      <label class="field-check">
        <input type="checkbox" id="f_logExpense" checked>
        <span class="field-check-text">Log the purchase cost (qty &times; cost price) as a Stock Purchase expense</span>
      </label>` : `
      <label class="field-check">
        <input type="checkbox" id="f_logRestock" checked>
        <span class="field-check-text" id="f_restockHint">If you increase the quantity, log the added stock's cost as a Restock expense</span>

      });
    });
    const qtyEl = document.getElementById('f_qty');
    const costEl = document.getElementById('f_cost');

    function refreshRestockHint(){
      const newQty = parseFloat(qtyEl.value)||0;
      const cost = parseFloat(costEl.value)||0;
      const delta = newQty - item.qty;
      if(delta > 0 && cost > 0){
        hintEl.textContent = `Log the added ${delta} unit${delta===1?'':'s'} (${money(delta*cost)}) as a Restock expense`;
      } else {
        hintEl.textContent = `If you increase the quantity, log the added stock's cost as a Restock expense`;
      }

    qtyEl.addEventListener('input', refreshRestockHint);

    const code = document.getElementById('f_code').value.trim();
    const name = document.getElementById('f_name').value.trim();
    const category = document.getElementById('f_category').value;
    const supplier = document.getElementById('f_supplier').value.trim();
    const hsn = document.getElementById('f_hsn').value.trim();
    const qty = parseFloat(document.getElementById('f_qty').value)||0;
    const minQty = parseFloat(document.getElementById('f_minqty').value)||0;
    const costPrice = parseFloat(document.getElementById('f_cost').value)||0;
    const sellPrice = parseFloat(document.getElementById('f_sell').value)||0;
    if(!code || !name){ toast('Code and name are required','danger'); return; }
    const dupe = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase() && x.id!==editId);
    if(dupe){ toast('That code is already used by '+dupe.name, 'danger'); return; }

    if(item && needsApproval('Edit product: '+item.name+' ('+item.code+')', ()=>document.getElementById('itemForm').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true})))) return;
    if(item){
      const oldQty = item.qty;
      const itemBefore = Object.assign({}, item);
      const logRestockEl = document.getElementById('f_logRestock');
      const delta = qty - oldQty;
      Object.assign(item, {code,name,category,supplier,hsn,qty,minQty,costPrice,sellPrice});
      if(logRestockEl && logRestockEl.checked && delta > 0 && costPrice > 0){

        toast('Product updated — restock logged as an expense','success');
      } else {
        toast('Product updated','success');
      }
      logActivity('Edit product', diffText(itemBefore, {code,name,category,supplier,hsn,qty,minQty,costPrice,sellPrice}, ['code','name','category','supplier','hsn','qty','minQty','costPrice','sellPrice'], name+' ('+code+')'));
    } else {
      state.inventory.push({id:uid(),code,name,category,supplier,hsn,qty,minQty,costPrice,sellPrice,dateAdded:todayISO()});
      const logExpense = document.getElementById('f_logExpense').checked;
      if(logExpense && qty>0 && costPrice>0){
        state.expenses.push({id:uid(),category:'Stock Purchase',amount:qty*costPrice,note:name,date:todayISO()});
      }
      logActivity('Add product', name+' ('+code+')');
      toast('Product added','success');
    }
    save(); closeModal(); renderAll();
  });
}
function generateCode(category){
  const prefix = CAT_PREFIX[category] || (category||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'GEN';
  const existing = state.inventory.filter(x=>x.code.startsWith(prefix+'-'));
  let max = 0;
  existing.forEach(x=>{ const n = parseInt(x.code.split('-')[1],10); if(!isNaN(n) && n>max) max=n; });
  return prefix + '-' + String(max+1).padStart(4,'0');
}

/* ---- Record sale ---- */
function openSaleModal(){
  if(!state.inventory.length){ toast('Add a product to inventory first','danger'); return; }
  openModal(`
    <div class="modal-head"><div class="modal-title">Record sale</div><button class="modal-close" data-close>${ICON.close}</button></div>
    <form id="saleForm">
      <div class="field">
        <label>Product code</label>
        <div class="field-with-btn">
          <input type="text" id="s_code" required list="itemCodesList" placeholder="Type, pick or scan">
          <button type="button" class="btn btn-icon" id="scanSaleBtn" title="Scan barcode">${ICON.scan}</button>
        </div>
        <datalist id="itemCodesList">${state.inventory.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist>
        <div class="field-hint" id="s_itemInfo"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantity sold</label><input type="number" id="s_qty" min="1" step="1" value="1" required></div>
        <div class="field"><label>Selling price / unit</label><input type="number" id="s_price" min="0" step="0.01" required></div>
      </div>
      <div class="field"><label>Date</label><input type="date" id="s_date" value="${todayISO()}"></div>
      <div class="modal-actions"><button type="submit" class="btn btn-primary btn-block">Record sale</button></div>
    </form>
  `);
  const codeInput = document.getElementById('s_code');
  function refreshInfo(){
    const item = state.inventory.find(x=>x.code.toLowerCase()===codeInput.value.trim().toLowerCase());
    const info = document.getElementById('s_itemInfo');
    if(item){
      info.textContent = `${item.name} — ${item.qty} in stock`;
      info.style.color = item.qty<=0 ? 'var(--danger)' : '';
      if(!document.getElementById('s_price').value) document.getElementById('s_price').value = item.sellPrice;
    } else {
      info.textContent = codeInput.value ? 'No product with this code' : '';
      info.style.color = codeInput.value ? 'var(--danger)' : '';
    }
  }
  codeInput.addEventListener('input', refreshInfo);
  document.getElementById('scanSaleBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ codeInput.value = code; refreshInfo(); });
  });
  document.getElementById('saleForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const code = codeInput.value.trim();
    const item = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase());
    if(!item){ toast('No product matches that code','danger'); return; }
    const qty = parseFloat(document.getElementById('s_qty').value)||0;
    const price = parseFloat(document.getElementById('s_price').value)||0;
    const date = document.getElementById('s_date').value || todayISO();
    if(qty<=0){ toast('Enter a quantity greater than 0','danger'); return; }
    if(qty > item.qty){ toast(`Only ${item.qty} in stock`,'danger'); return; }
    item.qty -= qty;
    state.sales.push({id:uid(),code:item.code,name:item.name,qty,price,total:qty*price,costAtSale:item.costPrice,date});
    logActivity('Add sale', item.name+' ('+item.code+') × '+qty+' — '+money(qty*price));
    save(); closeModal(); renderAll();
    toast('Sale recorded','success');
  });
}

function openNewBillModal(kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  if(!state.inventory.length){ toast('Add a product to inventory first','danger'); return; }
  billDraftItems = [];
  openModal(`
    <div class="modal-head"><div class="modal-title">${isProforma?'New proforma invoice':'New bill'}</div><button class="modal-close" data-close>${ICON.close}</button></div>
    ${isProforma?`<p style="font-size:12px;color:var(--text-faint);margin-top:-6px;line-height:1.5;">A quote for the customer to confirm — stock and revenue are only affected once you convert it to an invoice.</p>`:''}

    <div class="section-label" style="margin-top:0;"><span>Customer</span></div>
    <div class="field">
      <label>Select customer</label>
      <div class="field-with-btn">
        <select id="bill_custSelect">
          <option value="">Walk-in / new customer</option>
          ${state.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-icon" id="bill_addCustBtn" title="Add new customer">${ICON.plus}</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Name</label><input type="text" id="bill_custName" placeholder="Walk-in customer"></div>
      <div class="field"><label>Phone</label><input type="text" id="bill_custPhone"></div>
    </div>
    <div class="field"><label>Customer GSTIN (if registered)</label><input type="text" id="bill_custGstin" placeholder="Leave blank for unregistered customers" style="text-transform:uppercase;"></div>
    <div class="field"><label>Billing address (Bill To)</label><textarea id="bill_custAddress" rows="2" placeholder="House/street, city, PIN"></textarea></div>
    <label class="field-check">
      <input type="checkbox" id="bill_shipDifferent">
      <span class="field-check-text">Ship to a different address</span>
    </label>
    <div id="bill_shipBlock" style="display:none;">
      <div class="field-row">
        <div class="field"><label>Ship to name</label><input type="text" id="bill_shipName" placeholder="Same as customer name"></div>
        <div class="field"><label>Ship to phone</label><input type="text" id="bill_shipPhone"></div>
      </div>
      <div class="field"><label>Shipping address (Ship To)</label><textarea id="bill_shipAddress" rows="2" placeholder="House/street, city, PIN"></textarea></div>
    </div>
    <label class="field-check" id="bill_saveCustWrap" style="display:none;">
      <input type="checkbox" id="bill_saveCust" checked>
      <span class="field-check-text">Save this as a new customer for next time</span>
    </label>

    ${isProforma ? '' : `
    <div class="section-label"><span>Delivery tracking (optional)</span></div>
    <div class="field-row">
      <div class="field"><label>Delivery partner</label><input type="text" id="bill_deliveryPartner" list="deliveryPartnerList" placeholder="e.g. Delhivery, Blue Dart"></div>
      <div class="field"><label>Tracking ID</label><input type="text" id="bill_trackingId" placeholder="e.g. AWB123456789"></div>
    </div>
    <datalist id="deliveryPartnerList">
      <option value="Delhivery"></option>
      <option value="Blue Dart"></option>
      <option value="DTDC"></option>
      <option value="India Post"></option>
      <option value="Ekart"></option>
      <option value="Xpressbees"></option>
      <option value="Self / own delivery"></option>
    </datalist>
    `}

    <div class="section-label"><span>Add items</span></div>
    <div class="field">
      <div class="field-with-btn">
        <input type="text" id="bill_itemCode" list="itemCodesList" placeholder="Product code — type, pick or scan">
        <button type="button" class="btn btn-icon" id="bill_scanBtn" title="Scan barcode">${ICON.scan}</button>
      </div>
      <datalist id="itemCodesList">${state.inventory.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist>
      <div class="field-hint" id="bill_itemInfo"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Qty</label><input type="number" id="bill_itemQty" min="1" step="1" value="1"></div>
      <div class="field"><label>Price / unit</label><input type="number" id="bill_itemPrice" min="0" step="0.01"></div>
    </div>
    <button type="button" class="btn btn-block" id="bill_addItemBtn">${ICON.plus}<span>Add to ${isProforma?'proforma':'bill'}</span></button>

    <div id="billItemsContainer" style="margin-top:16px;"></div>

    <div class="section-label"><span>GST</span></div>
    <label class="field-check">
      <input type="checkbox" id="bill_gstEnabled" ${state.defaultGstRate>0?'checked':''}>
      <span class="field-check-text">Apply GST to this ${isProforma?'proforma':'bill'}</span>
    </label>
    <div id="bill_gstFields" style="margin-top:12px;"></div>

    <div class="field" style="margin-top:6px;"><label>Notes (optional)</label><input type="text" id="bill_notes" placeholder="e.g. Warranty 6 months"></div>
    ${isProforma ? `<div class="field"><label>Valid until (optional)</label><input type="date" id="bill_validUntil"></div>` : ''}

    <div class="modal-actions"><button type="button" class="btn btn-primary btn-block" id="bill_generateBtn">${isProforma?'Generate proforma invoice':'Generate bill'}</button></div>
  `);
  renderBillGstFields();

  const custSelect = document.getElementById('bill_custSelect');
  const custNameInput = document.getElementById('bill_custName');
  const custPhoneInput = document.getElementById('bill_custPhone');
  const custGstinInput = document.getElementById('bill_custGstin');
  const custAddressInput = document.getElementById('bill_custAddress');
  const saveCustWrap = document.getElementById('bill_saveCustWrap');
  document.getElementById('bill_shipDifferent').addEventListener('change', (e)=>{
    document.getElementById('bill_shipBlock').style.display = e.target.checked ? '' : 'none';
  });
  function applyCustomerSelection(){
    const id = custSelect.value;
    if(id){
      const c = state.customers.find(x=>x.id===id);
      if(c){
        custNameInput.value = c.name;
        custPhoneInput.value = c.phone||'';
        custGstinInput.value = c.gstin||'';
        custAddressInput.value = c.address||'';
      }
      saveCustWrap.style.display = 'none';
    } else {
      saveCustWrap.style.display = custNameInput.value.trim() ? '' : 'none';
    }
  }
  custSelect.addEventListener('change', applyCustomerSelection);
  custNameInput.addEventListener('input', ()=>{
    if(!custSelect.value) saveCustWrap.style.display = custNameInput.value.trim() ? '' : 'none';
  });
  document.getElementById('bill_addCustBtn').addEventListener('click', ()=>{
    openCustomerModal(null, (newCust)=>{
      if(!newCust) return;
      // Re-open the bill modal fresh (customer modal replaced it) and pre-select the new customer.
      const keepItems = billDraftItems.slice();
      openNewBillModal(kind);
      billDraftItems = keepItems;
      renderBillItemsContainer();
      const sel = document.getElementById('bill_custSelect');
      if(sel){ sel.value = newCust.id; sel.dispatchEvent(new Event('change')); }
    });
  });

  const codeInput = document.getElementById('bill_itemCode');
  function refreshItemInfo(){
    const item = state.inventory.find(x=>x.code.toLowerCase()===codeInput.value.trim().toLowerCase());
    const info = document.getElementById('bill_itemInfo');
    if(item){
      info.textContent = `${item.name} — ${item.qty} in stock`;
      info.style.color = item.qty<=0 ? 'var(--danger)' : '';
      if(!document.getElementById('bill_itemPrice').value) document.getElementById('bill_itemPrice').value = item.sellPrice;
    } else {
      info.textContent = codeInput.value ? 'No product with this code' : '';
      info.style.color = codeInput.value ? 'var(--danger)' : '';
    }
  }
  codeInput.addEventListener('input', refreshItemInfo);
  document.getElementById('bill_scanBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ codeInput.value = code; refreshItemInfo(); });
  });
  document.getElementById('bill_addItemBtn').addEventListener('click', ()=>{
    const code = codeInput.value.trim();
    const item = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase());
    if(!item){ toast('No product matches that code','danger'); return; }
    const qty = parseFloat(document.getElementById('bill_itemQty').value)||0;
    const price = parseFloat(document.getElementById('bill_itemPrice').value)||0;
    if(qty<=0){ toast('Enter a quantity greater than 0','danger'); return; }
    const alreadyInBill = billDraftItems.filter(x=>x.code===item.code).reduce((s,x)=>s+x.qty,0);
    if(qty + alreadyInBill > item.qty){ toast(`Only ${item.qty} in stock for ${item.name}`,'danger'); return; }
    billDraftItems.push({code:item.code, name:item.name, hsn:item.hsn||'', qty, price});
    codeInput.value=''; document.getElementById('bill_itemQty').value='1'; document.getElementById('bill_itemPrice').value='';
    document.getElementById('bill_itemInfo').textContent='';
    renderBillItemsContainer();
    codeInput.focus();
  });
  document.getElementById('bill_gstEnabled').addEventListener('change', renderBillGstFields);
  document.getElementById('bill_generateBtn').addEventListener('click', ()=>finalizeBill(kind));
}

function renderBillGstFields(){
  const enabled = document.getElementById('bill_gstEnabled').checked;
  const box = document.getElementById('bill_gstFields');
  if(!enabled){
    box.innerHTML = '';
    renderBillItemsContainer();
    return;
  }
  box.innerHTML = `
    <div class="field-row">
      <div class="field"><label>GST rate</label>
        <select id="bill_gstRate">${GST_RATES.map(r=>`<option value="${r}" ${state.defaultGstRate===r?'selected':''}>${r}%</option>`).join('')}</select>
      </div>
      <div class="field"><label>Type</label>
        <select id="bill_gstType">
          <option value="intra" ${state.defaultGstType==='intra'?'selected':''}>Intra-state (CGST+SGST)</option>
          <option value="inter" ${state.defaultGstType==='inter'?'selected':''}>Inter-state (IGST)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Prices entered above are</label>
      <select id="bill_priceMode">
        <option value="exclusive">Exclusive of GST (added on top)</option>
        <option value="inclusive">Inclusive of GST (already included)</option>
      </select>
    </div>
  `;
  document.getElementById('bill_gstRate').addEventListener('change', renderBillItemsContainer);
  document.getElementById('bill_gstType').addEventListener('change', renderBillItemsContainer);
  document.getElementById('bill_priceMode').addEventListener('change', renderBillItemsContainer);
  renderBillItemsContainer();
}

function currentBillGstSettings(){
  const enabledEl = document.getElementById('bill_gstEnabled');
  const rateEl = document.getElementById('bill_gstRate');
  const typeEl = document.getElementById('bill_gstType');
  const modeEl = document.getElementById('bill_priceMode');
  return {
    enabled: enabledEl ? enabledEl.checked : false,
    rate: rateEl ? (parseFloat(rateEl.value)||0) : state.defaultGstRate,
    type: typeEl ? typeEl.value : state.defaultGstType,
    mode: modeEl ? modeEl.value : 'exclusive'
  };
}

function renderBillItemsContainer(){
  const container = document.getElementById('billItemsContainer');
  if(!container) return;
  const subtotal = billDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  const g = currentBillGstSettings();
  const calc = computeGst(subtotal, g.enabled, g.rate, g.type, g.mode);
  container.innerHTML = `
    ${billDraftItems.length ? `
    <div class="list" style="margin-bottom:12px;">
      ${billDraftItems.map((x,i)=>`
        <div class="ledger-row">
          <div class="ledger-main">
            <div class="ledger-title">${esc(x.name)} <span class="item-code" style="margin-left:4px;">${esc(x.code)}</span></div>
            <div class="ledger-sub">${x.qty} &times; ${money(x.price)}</div>
          </div>
          <div class="ledger-amt">${money(x.qty*x.price)}</div>
          <button type="button" class="ledger-del" data-action="remove-bill-item" data-index="${i}" aria-label="Remove item">${ICON.trash}</button>
        </div>`).join('')}
    </div>` : `<div class="empty-state" style="padding:22px;">${ICON.empty}<div class="empty-state-title">No items added yet</div></div>`}
    <div class="card" style="padding:10px 14px;">
      <table class="report-table">
        <tr><td>Subtotal</td><td>${money(subtotal)}</td></tr>
        ${g.enabled ? (g.type==='inter'
          ? `<tr><td>IGST (${g.rate}%)</td><td>${money(calc.igst)}</td></tr>`
          : `<tr><td>CGST (${g.rate/2}%)</td><td>${money(calc.cgst)}</td></tr><tr><td>SGST (${g.rate/2}%)</td><td>${money(calc.sgst)}</td></tr>`) : ''}
        <tr class="total-row"><td>Grand total</td><td>${money(calc.grandTotal)}</td></tr>
      </table>
    </div>
  `;
  container.querySelectorAll('[data-action="remove-bill-item"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      billDraftItems.splice(parseInt(btn.dataset.index,10), 1);
      renderBillItemsContainer();
    });
  });
}

function finalizeBill(kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  if(!billDraftItems.length){ toast('Add at least one item to the '+(isProforma?'proforma':'bill'),'danger'); return; }
  const grouped = {};
  billDraftItems.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
  for(const code in grouped){
    const item = state.inventory.find(x=>x.code===code);
    if(!item || grouped[code] > item.qty){
      toast(`Not enough stock for ${item?item.name:code}`,'danger');
      return;
    }
  }
  const customerName = document.getElementById('bill_custName').value.trim();
  const customerPhone = document.getElementById('bill_custPhone').value.trim();
  const customerGstin = document.getElementById('bill_custGstin').value.trim().toUpperCase();
  const customerAddress = document.getElementById('bill_custAddress').value.trim();
  const shipDifferent = document.getElementById('bill_shipDifferent').checked;
  const shipToName = shipDifferent ? document.getElementById('bill_shipName').value.trim() : '';
  const shipToPhone = shipDifferent ? document.getElementById('bill_shipPhone').value.trim() : '';
  const shipToAddress = shipDifferent ? document.getElementById('bill_shipAddress').value.trim() : '';
  const shipSameAsBilling = !shipDifferent;
  const deliveryPartner = isProforma ? '' : document.getElementById('bill_deliveryPartner').value.trim();
  const trackingId = isProforma ? '' : document.getElementById('bill_trackingId').value.trim();
  const custSelectEl = document.getElementById('bill_custSelect');
  const saveCustEl = document.getElementById('bill_saveCust');
  let customerId = custSelectEl ? (custSelectEl.value || null) : null;
  if(!customerId && customerName && saveCustEl && saveCustEl.checked){
    const newCust = {id: uid(), name: customerName, phone: customerPhone, gstin: customerGstin, address: customerAddress};
    state.customers.push(newCust);
    customerId = newCust.id;
  }
  const notes = document.getElementById('bill_notes').value.trim();
  const validUntilEl = document.getElementById('bill_validUntil');
  const validUntil = isProforma && validUntilEl ? validUntilEl.value : '';
  const g = currentBillGstSettings();
  const subtotal = billDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  const calc = computeGst(subtotal, g.enabled, g.rate, g.type, g.mode);

  if(isProforma){
    const piNo = piNoStr(state.nextProformaNo);
    const pi = {
      id: uid(), piNo, date: todayISO(),
      customerId, customerName, customerPhone, customerGstin, customerAddress,
      shipSameAsBilling, shipToName, shipToPhone, shipToAddress,
      items: billDraftItems.slice(),
      subtotal, gstEnabled: g.enabled, gstRate: g.rate, gstType: g.type, priceMode: g.mode,
      taxable: calc.taxable, gstAmount: calc.gstAmount, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst, grandTotal: calc.grandTotal,
      notes, validUntil, status: 'pending', convertedBillId: null, convertedBillNo: null
    };
    state.proformas.push(pi);
    state.nextProformaNo += 1;
    logActivity('Create proforma', piNo+' — '+money(calc.grandTotal));
    save(); closeModal();
    salesSubTab = 'proforma';
    renderAll();
    toast('Proforma invoice generated','success');
    openInvoicePreview(pi.id, 'proforma');
    if(dataDirHandle){
      writeFileToDataFolder('proforma-'+pi.piNo+'.html', new Blob([invoiceStandaloneHtml(pi,'proforma')], {type:'text/html'}));
    }
    return;
  }

  billDraftItems.forEach(x=>{
    const item = state.inventory.find(inv=>inv.code===x.code);
    if(item) item.qty -= x.qty;
  });

  const billNo = billNoStr(state.nextBillNo);
  const bill = {
    id: uid(), billNo, date: todayISO(),
    customerId, customerName, customerPhone, customerGstin, customerAddress,
    shipSameAsBilling, shipToName, shipToPhone, shipToAddress,
    deliveryPartner, trackingId,
    items: billDraftItems.slice(),
    subtotal, gstEnabled: g.enabled, gstRate: g.rate, gstType: g.type, priceMode: g.mode,
    taxable: calc.taxable, gstAmount: calc.gstAmount, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst, grandTotal: calc.grandTotal,
    notes
  };
  state.bills.push(bill);
  state.nextBillNo += 1;

  const totalUnits = billDraftItems.reduce((s,x)=>s+x.qty,0);
  state.sales.push({
    id: uid(), code: billNo,
    name: `Bill ${billNo} (${billDraftItems.length} item${billDraftItems.length===1?'':'s'})`,
    qty: totalUnits, price: totalUnits ? (calc.taxable/totalUnits) : 0, total: calc.taxable,
    costAtSale: 0, date: bill.date, billId: bill.id, billNo
  });
  logActivity('Create bill', billNo+' — '+money(calc.grandTotal));
  save();
  closeModal();
  salesSubTab = 'bills';
  renderAll();
  toast('Bill generated','success');
  openInvoicePreview(bill.id, 'invoice');
  if(dataDirHandle){
    writeFileToDataFolder('invoice-'+bill.billNo+'.html', new Blob([invoiceStandaloneHtml(bill,'invoice')], {type:'text/html'}));
  }
}

/* ============================================================
   DELIVERY CHALLAN (DC)
   ============================================================ */
let dcDraftItems = [];
function openNewDcModal(editDcId){
  if(!state.inventory.length){ toast('Add a product to inventory first','danger'); return; }
  const editing = editDcId ? state.deliveryChallans.find(x=>x.id===editDcId) : null;
  dcDraftItems = editing ? editing.items.slice() : [];
  openModal(`
    <div class="modal-head"><div class="modal-title">${editing?'Edit '+esc(editing.dcNo):'New delivery challan'}</div><button class="modal-close" data-close>${ICON.close}</button></div>

    <div class="section-label" style="margin-top:0;"><span>Consignee</span></div>
    <div class="field">
      <label>Select customer</label>
      <div class="field-with-btn">
        <select id="dc_custSelect">
          <option value="">Walk-in / new customer</option>
          ${state.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${editing&&editing.customerId===c.id?'selected':''}>${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-icon" id="dc_addCustBtn" title="Add new customer">${ICON.plus}</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Name</label><input type="text" id="dc_custName" placeholder="Walk-in" value="${editing?esc(editing.customerName||''):''}"></div>
      <div class="field"><label>Phone</label><input type="text" id="dc_custPhone" value="${editing?esc(editing.customerPhone||''):''}"></div>
    </div>
    <div class="field"><label>Delivery address (optional)</label><textarea id="dc_custAddress" rows="2" placeholder="House/street, city, PIN">${editing?esc(editing.customerAddress||''):''}</textarea></div>
    <label class="field-check" id="dc_saveCustWrap" style="display:none;">
      <input type="checkbox" id="dc_saveCust" checked>
      <span class="field-check-text">Save this as a new customer for next time</span>
    </label>

    <div class="section-label"><span>Transport details</span></div>
    <div class="field-row">
      <div class="field"><label>Reason for transport</label>
        <select id="dc_reason">${DC_REASONS.map(r=>`<option value="${r}" ${editing&&editing.reason===r?'selected':''}>${r}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Vehicle number (optional)</label><input type="text" id="dc_vehicle" placeholder="e.g. UP32 AB 1234" value="${editing?esc(editing.vehicleNo||''):''}"></div>
    </div>

    <div class="section-label"><span>Add items</span></div>
    <div class="field">
      <div class="field-with-btn">
        <input type="text" id="dc_itemCode" list="itemCodesList" placeholder="Product code — type, pick or scan">
        <button type="button" class="btn btn-icon" id="dc_scanBtn" title="Scan barcode">${ICON.scan}</button>
      </div>
      <datalist id="itemCodesList">${state.inventory.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}</datalist>
      <div class="field-hint" id="dc_itemInfo"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Qty</label><input type="number" id="dc_itemQty" min="1" step="1" value="1"></div>
      <div class="field"><label>Declared value / unit (optional)</label><input type="number" id="dc_itemPrice" min="0" step="0.01" placeholder="For transport value only"></div>
    </div>
    <button type="button" class="btn btn-block" id="dc_addItemBtn">${ICON.plus}<span>Add to challan</span></button>

    <div id="dcItemsContainer" style="margin-top:16px;"></div>

    <label class="field-check" style="margin-top:6px;">
      <input type="checkbox" id="dc_reduceStock" ${(!editing || editing.reducesStock)?'checked':''}>
      <span class="field-check-text">Reduce stock for these items (goods are physically leaving)</span>
    </label>
    <div class="field" style="margin-top:6px;"><label>Notes (optional)</label><input type="text" id="dc_notes" placeholder="e.g. To be returned within 30 days" value="${editing?esc(editing.notes||''):''}"></div>

    <div class="modal-actions"><button type="button" class="btn btn-primary btn-block" id="dc_generateBtn">${editing?'Save changes':'Generate delivery challan'}</button></div>
  `);

  const custSelect = document.getElementById('dc_custSelect');
  const custNameInput = document.getElementById('dc_custName');
  const custPhoneInput = document.getElementById('dc_custPhone');
  const custAddressInput = document.getElementById('dc_custAddress');
  const saveCustWrap = document.getElementById('dc_saveCustWrap');
  function applyCustomerSelection(){
    const id = custSelect.value;
    if(id){
      const c = state.customers.find(x=>x.id===id);
      if(c){
        custNameInput.value = c.name;
        custPhoneInput.value = c.phone||'';
        custAddressInput.value = c.address||'';
      }
      saveCustWrap.style.display = 'none';
    } else {
      saveCustWrap.style.display = custNameInput.value.trim() ? '' : 'none';
    }
  }
  custSelect.addEventListener('change', applyCustomerSelection);
  custNameInput.addEventListener('input', ()=>{
    if(!custSelect.value) saveCustWrap.style.display = custNameInput.value.trim() ? '' : 'none';
  });
  document.getElementById('dc_addCustBtn').addEventListener('click', ()=>{
    openCustomerModal(null, (newCust)=>{
      if(!newCust) return;
      const keepItems = dcDraftItems.slice();
      openNewDcModal(editDcId);
      dcDraftItems = keepItems;
      renderDcItemsContainer();
      const sel = document.getElementById('dc_custSelect');
      if(sel){ sel.value = newCust.id; sel.dispatchEvent(new Event('change')); }
    });
  });

  const codeInput = document.getElementById('dc_itemCode');
  function refreshItemInfo(){
    const item = state.inventory.find(x=>x.code.toLowerCase()===codeInput.value.trim().toLowerCase());
    const info = document.getElementById('dc_itemInfo');
    if(item){
      info.textContent = `${item.name} — ${item.qty} in stock`;
      info.style.color = item.qty<=0 ? 'var(--danger)' : '';
    } else {
      info.textContent = codeInput.value ? 'No product with this code' : '';
      info.style.color = codeInput.value ? 'var(--danger)' : '';
    }
  }
  codeInput.addEventListener('input', refreshItemInfo);
  document.getElementById('dc_scanBtn').addEventListener('click', ()=>{
    openScannerModal((code)=>{ codeInput.value = code; refreshItemInfo(); });
  });
  document.getElementById('dc_addItemBtn').addEventListener('click', ()=>{
    const code = codeInput.value.trim();
    const item = state.inventory.find(x=>x.code.toLowerCase()===code.toLowerCase());
    if(!item){ toast('No product matches that code','danger'); return; }
    const qty = parseFloat(document.getElementById('dc_itemQty').value)||0;
    const price = parseFloat(document.getElementById('dc_itemPrice').value)||0;
    if(qty<=0){ toast('Enter a quantity greater than 0','danger'); return; }
    const reduceStock = document.getElementById('dc_reduceStock').checked;
    if(reduceStock){
      // Available stock = current stock, plus whatever this same DC already had reserved (when editing).
      const originalQty = editing ? (editing.items.filter(x=>x.code===item.code).reduce((s,x)=>s+x.qty,0)) : 0;
      const alreadyInDraft = dcDraftItems.filter(x=>x.code===item.code).reduce((s,x)=>s+x.qty,0);
      const available = item.qty + originalQty;
      if(alreadyInDraft + qty > available){ toast(`Only ${available} available for ${item.name}`,'danger'); return; }
    }
    dcDraftItems.push({code:item.code, name:item.name, hsn:item.hsn||'', qty, price});
    codeInput.value=''; document.getElementById('dc_itemQty').value='1'; document.getElementById('dc_itemPrice').value='';
    document.getElementById('dc_itemInfo').textContent='';
    renderDcItemsContainer();
    codeInput.focus();
  });
  renderDcItemsContainer();
  document.getElementById('dc_generateBtn').addEventListener('click', ()=>finalizeDc(editDcId));
}
function renderDcItemsContainer(){
  const container = document.getElementById('dcItemsContainer');
  if(!container) return;
  const totalQty = dcDraftItems.reduce((s,x)=>s+x.qty,0);
  const totalValue = dcDraftItems.reduce((s,x)=>s+x.qty*x.price,0);
  container.innerHTML = `
    ${dcDraftItems.length ? `

    ${dcDraftItems.length ? `<div class="card" style="padding:10px 14px;">

  container.querySelectorAll('[data-action="remove-dc-item"]').forEach(btn=>{

}
function finalizeDc(editDcId){
  if(!dcDraftItems.length){ toast('Add at least one item to the challan','danger'); return; }
  const editing = editDcId ? state.deliveryChallans.find(x=>x.id===editDcId) : null;
  if(editing && needsApproval('Edit delivery challan: '+editing.dcNo, ()=>finalizeDc(editDcId))) return;
  const reduceStock = document.getElementById('dc_reduceStock').checked;

  // Validate stock availability before touching anything.
  if(reduceStock){
    const grouped = {};
    dcDraftItems.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
    for(const code in grouped){
      const item = state.inventory.find(x=>x.code===code);
      const originalQty = editing ? editing.items.filter(x=>x.code===code).reduce((s,x)=>s+x.qty,0) : 0;
      const available = (item?item.qty:0) + (editing && editing.reducesStock ? originalQty : 0);
      if(!item || grouped[code] > available){
        toast(`Not enough stock for ${item?item.name:code}`,'danger');
        return;
      }
    }
  }

  const customerName = document.getElementById('dc_custName').value.trim();
  const customerPhone = document.getElementById('dc_custPhone').value.trim();
  const customerAddress = document.getElementById('dc_custAddress').value.trim();
  const custSelectEl = document.getElementById('dc_custSelect');
  const saveCustEl = document.getElementById('dc_saveCust');
  let customerId = custSelectEl ? (custSelectEl.value || null) : null;
  if(!customerId && customerName && saveCustEl && saveCustEl.checked){
    const newCust = {id: uid(), name: customerName, phone: customerPhone, gstin:'', address: customerAddress};
    state.customers.push(newCust);
    customerId = newCust.id;
  }
  const reason = document.getElementById('dc_reason').value;
  const vehicleNo = document.getElementById('dc_vehicle').value.trim();
  const notes = document.getElementById('dc_notes').value.trim();

  // Restore stock from the OLD version of this DC (if editing and it previously reduced stock),
  // then deduct stock for the NEW item list (if this version reduces stock).
  if(editing && editing.reducesStock){
    editing.items.forEach(x=>{
      const item = state.inventory.find(inv=>inv.code===x.code);
      if(item) item.qty += x.qty;
    });
  }
  if(reduceStock){
    dcDraftItems.forEach(x=>{
      const item = state.inventory.find(inv=>inv.code===x.code);
      if(item) item.qty -= x.qty;
    });
  }

  if(editing){
    const dcFields = ['customerName','customerPhone','customerAddress','reason','vehicleNo','notes','items'];
    const dcBefore = {customerName:editing.customerName, customerPhone:editing.customerPhone, customerAddress:editing.customerAddress, reason:editing.reason, vehicleNo:editing.vehicleNo, notes:editing.notes, items:editing.items.map(x=>x.code+' x'+x.qty).join(', ')};
    const dcAfter = {customerName, customerPhone, customerAddress, reason, vehicleNo, notes, items:dcDraftItems.map(x=>x.code+' x'+x.qty).join(', ')};
    logActivity('Edit delivery challan', diffText(dcBefore, dcAfter, dcFields, editing.dcNo));
    Object.assign(editing, {
      customerId, customerName, customerPhone, customerAddress,
      reason, vehicleNo, notes, reducesStock: reduceStock,
      items: dcDraftItems.slice()
    });
    save(); closeModal(); renderAll(); toast('Delivery challan updated','success');
    openDcPreview(editing.id);
    if(dataDirHandle) writeFileToDataFolder('dc-'+editing.dcNo+'.html', new Blob([dcStandaloneHtml(editing)], {type:'text/html'}));
  } else {
    const dcNo = dcNoStr(state.nextDcNo);
    const dc = {
      id: uid(), dcNo, date: todayISO(),
      customerId, customerName, customerPhone, customerAddress,
      reason, vehicleNo, notes, reducesStock: reduceStock,
      items: dcDraftItems.slice()
    };
    state.deliveryChallans.push(dc);
    state.nextDcNo += 1;
    logActivity('Create delivery challan', dcNo);
    save(); closeModal();
    salesSubTab = 'dc';
    renderAll();
    toast('Delivery challan generated','success');
    openDcPreview(dc.id);
    if(dataDirHandle) writeFileToDataFolder('dc-'+dc.dcNo+'.html', new Blob([dcStandaloneHtml(dc)], {type:'text/html'}));
  }
}

/* ---- Invoice / proforma preview / print / delete ---- */
function openInvoicePreview(id, kind){
  const isProforma = (kind = kind || 'invoice') === 'proforma';
  const b = isProforma ? state.proformas.find(x=>x.id===id) : state.bills.find(x=>x.id===id);
  if(!b) return;
  const docNo = isProforma ? b.piNo : b.billNo;
  const isConverted = isProforma && b.status==='converted';
  openModal(`
    <div class="modal-head"><div class="modal-title">${esc(docNo)}</div><button class="modal-close" data-close>${ICON.close}</button></div>
    <div style="background:#fff;color:#1a1a1a;border-radius:var(--radius-m);padding:16px;font-size:13px;border:1px solid var(--border);">

    </div>
    ${isConverted?`
    <div class="card" style="margin-top:14px;background:var(--success-soft);border-color:transparent;">
      <div style="font-size:13px;color:var(--success);font-weight:600;">Converted to invoice ${esc(b.convertedBillNo)}</div>
      <button type="button" class="btn btn-block" style="margin-top:10px;" id="viewConvertedBtn">View invoice</button>
    </div>

    <div class="field-row">
      <div class="field"><label>Delivery partner</label><input type="text" id="pv_deliveryPartner" list="deliveryPartnerList" value="${esc(b.deliveryPartner||'')}"></div>
      <div class="field"><label>Tracking ID</label><input type="text" id="pv_trackingId" value="${esc(b.trackingId||'')}"></div>
    </div>
    <datalist id="deliveryPartnerList">
      <option value="Delhivery"></option>
      <option value="Blue Dart"></option>
      <option value="DTDC"></option>
      <option value="India Post"></option>
      <option value="Ekart"></option>
      <option value="Xpressbees"></option>
      <option value="Self / own delivery"></option>
    </datalist>
    <button type="button" class="btn btn-block" id="saveTrackingBtn">Save delivery info</button>
    `}
    ${(isProforma && !isConverted) ? `<button type="button" class="btn btn-primary btn-block" style="margin-top:14px;" id="convertBillBtn">Convert to Invoice</button>` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="deleteBillBtn">Delete</button>
      <button type="button" class="btn" id="saveBillBtn"><span>${isProforma?'Save proforma file':'Save invoice file'}</span></button>
      <button type="button" class="btn btn-primary" id="printBillBtn">${ICON.printer}<span>Print / Save as PDF</span></button>
    </div>
  `);
  document.getElementById('printBillBtn').addEventListener('click', ()=> printHtmlDocument(invoiceStandaloneHtml(b, kind)));
  document.getElementById('saveBillBtn').addEventListener('click', ()=>{
    const filename = (isProforma?'proforma-':'invoice-') + docNo + '.html';
    saveHtmlFileGeneric(filename, invoiceStandaloneHtml(b, kind), isProforma?'Proforma':'Invoice');
  });
  if(isConverted){
    document.getElementById('viewConvertedBtn').addEventListener('click', ()=> openInvoicePreview(b.convertedBillId, 'invoice'));
  }
  if(!isProforma){
    document.getElementById('saveTrackingBtn').addEventListener('click', ()=>{
      b.deliveryPartner = document.getElementById('pv_deliveryPartner').value.trim();
      b.trackingId = document.getElementById('pv_trackingId').value.trim();
      save();
      toast('Delivery info saved','success');
      openInvoicePreview(b.id, 'invoice');
    });
  }
  if(isProforma && !isConverted){
    document.getElementById('convertBillBtn').addEventListener('click', ()=>{
      confirmModal(`Convert ${esc(docNo)} to a real invoice? This will deduct stock and record revenue.`, ()=> convertProformaToInvoice(b.id), 'Convert');
    });
  }
  document.getElementById('deleteBillBtn').addEventListener('click', ()=>{
    if(isProforma){
      confirmModal('Delete this proforma invoice?', ()=>{
        state.proformas = state.proformas.filter(x=>x.id!==b.id);
        logActivity('Delete proforma', docNo);
        save(); closeModal(); renderAll(); toast('Proforma deleted');
      });
    } else {
      confirmModal('Delete this bill? Stock will not be restored automatically, and its linked revenue entry will also be removed.', ()=>{
        state.bills = state.bills.filter(x=>x.id!==b.id);
        state.sales = state.sales.filter(x=>x.billId!==b.id);
        logActivity('Delete bill', docNo);
        save(); closeModal(); renderAll(); toast('Bill deleted');
      });
    }
  });
}
function convertProformaToInvoice(proformaId){
  const pi = state.proformas.find(x=>x.id===proformaId);
  if(!pi || pi.status==='converted') return;
  const grouped = {};
  pi.items.forEach(x=>{ grouped[x.code] = (grouped[x.code]||0) + x.qty; });
  for(const code in grouped){
    const item = state.inventory.find(x=>x.code===code);
    if(!item || grouped[code] > item.qty){
      toast(`Not enough stock for ${item?item.name:code} — adjust stock or the proforma before converting`,'danger');
      return;
    }
  }
  pi.items.forEach(x=>{
    const item = state.inventory.find(inv=>inv.code===x.code);
    if(item) item.qty -= x.qty;
  });
  const billNo = billNoStr(state.nextBillNo);
  const bill = {
    id: uid(), billNo, date: todayISO(),
    customerId: pi.customerId||null, customerName: pi.customerName, customerPhone: pi.customerPhone,
    customerGstin: pi.customerGstin, customerAddress: pi.customerAddress,
    shipSameAsBilling: pi.shipSameAsBilling, shipToName: pi.shipToName, shipToPhone: pi.shipToPhone, shipToAddress: pi.shipToAddress,
    deliveryPartner: '', trackingId: '',
    items: pi.items.slice(),
    subtotal: pi.subtotal, gstEnabled: pi.gstEnabled, gstRate: pi.gstRate, gstType: pi.gstType, priceMode: pi.priceMode,
    taxable: pi.taxable, gstAmount: pi.gstAmount, cgst: pi.cgst, sgst: pi.sgst, igst: pi.igst, grandTotal: pi.grandTotal,
    notes: pi.notes, fromProformaId: pi.id, fromProformaNo: pi.piNo
  };
  state.bills.push(bill);
  state.nextBillNo += 1;
  const totalUnits = pi.items.reduce((s,x)=>s+x.qty,0);
  state.sales.push({
    id: uid(), code: billNo,
    name: `Bill ${billNo} (${pi.items.length} item${pi.items.length===1?'':'s'})`,
    qty: totalUnits, price: totalUnits ? (pi.taxable/totalUnits) : 0, total: pi.taxable,
    costAtSale: 0, date: bill.date, billId: bill.id, billNo
  });
  pi.status = 'converted';
  pi.convertedBillId = bill.id;
  pi.convertedBillNo = billNo;
  save(); closeModal();
  salesSubTab = 'bills';
  renderAll();
  toast('Converted to invoice '+billNo,'success');
  openInvoicePreview(bill.id, 'invoice');
  if(dataDirHandle){
    writeFileToDataFolder('invoice-'+bill.billNo+'.html', new Blob([invoiceStandaloneHtml(bill,'invoice')], {type:'text/html'}));
  }
}

function printHtmlDocument(html){
  // Print via a hidden same-page iframe instead of window.open(), so this
  // works even when browsers or embedded viewers block pop-up windows.
  let frame = document.getElementById('invoicePrintFrame');
  if(!frame){
    frame = document.createElement('iframe');
    frame.id = 'invoicePrintFrame';
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    document.body.appendChild(frame);
  }
  try{
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(()=>{
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }catch(e){
        console.error('Print failed', e);
        toast('Could not open the print dialog — use the Save file option instead','danger');
      }
    }, 250);
  }catch(e){
    console.error('Print setup failed', e);
    toast('Could not prepare the document for printing — use the Save file option instead','danger');
  }
}
function saveHtmlFileGeneric(filename, html, label){
  const blob = new Blob([html], {type:'text/html'});
  if(dataDirHandle){
    writeFileToDataFolder(filename, blob).then(ok=>{
      if(ok) toast((label||'File')+' saved to your data folder','success');
      else { triggerDownload(filename, blob); toast((label||'File')+' downloaded','success'); }
    });
  } else {
    triggerDownload(filename, blob);
    toast((label||'File')+' downloaded — open it in a browser to view or print','success');
  }
}

  openModal(`

    const box = document.getElementById('c_salaryBox');
    const empSel = document.getElementById('c_employee');
    const hint = document.getElementById('c_salaryHint');
    const amtEl = document.getElementById('c_amount');
    let prevCat = catSel.value;
    const fillEmployees = ()=>{
      const emps = (state.employees||[]).filter(x=>x.active).sort((a,b)=>a.name.localeCompare(b.name));
      empSel.innerHTML = emps.length
        ? '<option value="">Select employee…</option>' + emps.map(x=>`<option value="${x.id}">${esc(x.name)}${x.empId?' ('+esc(x.empId)+')':''}</option>`).join('')
        : '<option value="">No employees yet</option>';
      if(!emps.length) hint.textContent = 'Add employees first (Employees page).';
    };
    const refreshSalaryHint = ()=>{
      const emp = (state.employees||[]).find(x=>x.id===empSel.value);
      if(!emp){ hint.textContent = ''; return; }
      amtEl.value = emp.monthlySalary || '';
      const month = document.getElementById('c_month').value || currentMonthStr();
      const paid = employeeNetForMonth(emp, month);
      hint.innerHTML = 'Set monthly salary: <strong>'+money(emp.monthlySalary||0)+'</strong>'+(paid?' &middot; <span style="color:var(--danger);">already paid for '+monthLabel(month)+' (slip '+esc(paid.payslipNo)+')</span>':'');
    };
    const showSalary = ()=>{ box.style.display = 'block'; fillEmployees(); };
    catSel.addEventListener('change', ()=>{
      if(catSel.value==='Salary'){
        if(canViewEmployees()){ prevCat = 'Salary'; showSalary(); return; }
        requestAdminApproval('Salary entry needs employee information', ()=>{
          employeeViewUntil = Date.now() + 10*60*1000;
          logActivity('Employee information opened', 'Admin approved access for '+(currentUser?currentUser.username:'')+' (salary entry)');
          prevCat = 'Salary'; showSalary();
        }, ()=>{ catSel.value = prevCat; });
      } else {
        prevCat = catSel.value; box.style.display = 'none';
      }
    });
    empSel.addEventListener('change', refreshSalaryHint);
    document.getElementById('c_month').addEventListener('change', refreshSalaryHint);
  }
  document.getElementById('cashForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const amount = parseFloat(document.getElementById('c_amount').value)||0;
    const note = document.getElementById('c_note').value.trim();
    const date = document.getElementById('c_date').value || todayISO();
    if(amount<=0){ toast('Enter an amount greater than 0','danger'); return; }
    if(isExp){
      const category = document.getElementById('c_category').value;
      if(category==='Salary'){
        const emp = (state.employees||[]).find(x=>x.id===document.getElementById('c_employee').value);
        if(!emp){ toast('Select the employee being paid','danger'); return; }
        const month = document.getElementById('c_month').value || currentMonthStr();
        const payment = recordSalaryPayment(emp, {month, basic:amount, allowances:0, deductions:0, paidDate:date, notes:note});
        save(); closeModal(); renderAll();
        toast('Salary paid to '+emp.name+' — '+money(amount),'success');
        openPayslipPreview(payment.id);
        return;
      }
      state.expenses.push({id:uid(),category,amount,note,date});
      logActivity('Add expense', category+' — '+money(amount));
    } else {
      state.investments.push({id:uid(),amount,note,date});
      logActivity('Add investment', money(amount));
    }
    save(); closeModal(); renderAll();
    toast(isExp?'Expense added':'Investment added','success');
  });
}

  `);
  document.getElementById('eidCloseBtn').addEventListener('click', closeModal);
  document.getElementById('eidBackBtn').addEventListener('click', openBusinessModal);
  const saveBtn = document.getElementById('eidSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const inputs = Array.from(document.querySelectorAll('.eid-input'));
    const wanted = inputs.map(i=>({emp: state.employees.find(x=>x.id===i.dataset.id), id: i.value.trim().toUpperCase()}));
    const seen = new Set();
    for(const w of wanted){
      if(!w.id){ toast('Employee ID cannot be empty ('+w.emp.name+')','danger'); return; }
      if(seen.has(w.id)){ toast('Duplicate ID: '+w.id,'danger'); return; }
      seen.add(w.id);
    }
    const changes = wanted.filter(w=>w.emp && w.emp.empId!==w.id);
    if(!changes.length){ toast('No changes to save'); return; }
    if(needsApproval('Change employee ID for '+changes.map(c=>c.emp.name).join(', '), ()=>saveBtn.click())) return;
    changes.forEach(c=>{ logActivity('Edit employee ID', c.emp.name+': '+c.emp.empId+' → '+c.id); c.emp.empId = c.id; });
    save(); closeModal(); renderAll();
    toast('Employee ID updated','success');
  });
}

    </div>
    <div class="field" style="border-top:1px solid var(--border);padding-top:14px;margin-top:6px;">
      <button class="btn btn-danger btn-block" id="wipeAllBtn">Erase all data on this device</button>

  document.getElementById('restoreFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data || typeof data!=='object' || !Array.isArray(data.inventory)) throw new Error('bad shape');
        const doRestore = async ()=>{
          if(needsApproval('Restore backup: '+file.name, ()=>doRestore())) return;
          mergeAudit(data.activityLog);
          state = Object.assign(defaultState(), data); state.activityLog = [];
          await ensureDefaultAdmin();
          const stillHere = currentUser ? state.users.find(u=>u.id===currentUser.id) : null;
          currentUser = stillHere || state.users.find(u=>u.role==='admin') || null;
          logActivity('Restore backup', file.name);
          save(); closeModal(); document.getElementById('shopNameInput').value = state.shopName;
          refreshBrandLogo(); applyBackground((state.uiSettings&&state.uiSettings.background)||'grid');
          applyRoleVisibility(); renderUserChip();
          if(!currentUser){ doLogout(false); } else { renderAll(); }
          ensureEmployeeIds(); syncSalaryExpenses(); renderAll();
          toast('Backup restored','success');
        };
        confirmModal('Restoring will replace all current data on this device with the backup file. Continue? (The activity log is kept.)', doRestore);
      }catch(err){
        toast('That file could not be read as a valid backup','danger');
      }
    };
    reader.readAsText(file);
  });
  document.getElementById('wipeAllBtn').addEventListener('click', ()=>{
    const doWipe = async ()=>{
      if(needsApproval('Erase ALL data on this device', ()=>doWipe())) return;
      logActivity('Erase all data', 'Products, sales, bills, expenses, investments, customers, employees and users were erased. This activity log was kept.');
      state = defaultState();
      await ensureDefaultAdmin();
      save(); closeModal(); document.getElementById('shopNameInput').value = state.shopName;
      refreshBrandLogo(); applyBackground('grid');
      toast('All data erased — please sign in again');
      doLogout(false);
    };
    confirmModal('Erase every product, sale, expense and investment on this device? This cannot be undone. (The activity log is kept.)', doWipe);
  });
}

/* ============================================================
   DATA FOLDER — auto-save JSON / Excel / SQLite next to the file
   ============================================================ */
let dataDirHandle = null;
const DIRDB_NAME = 'shopledger_dirdb';
const DIRDB_STORE = 'handles';

function idbGetDirHandle(){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(null); return; }
    let req;
    try{ req = indexedDB.open(DIRDB_NAME, 1); }catch(e){ resolve(null); return; }
    req.onupgradeneeded = ()=> req.result.createObjectStore(DIRDB_STORE);
    req.onsuccess = ()=>{
      const db = req.result;
      try{
        const tx = db.transaction(DIRDB_STORE, 'readonly');
        const getReq = tx.objectStore(DIRDB_STORE).get('dir');
        getReq.onsuccess = ()=> resolve(getReq.result || null);
        getReq.onerror = ()=> resolve(null);
      }catch(e){ resolve(null); }
    };
    req.onerror = ()=> resolve(null);
  });
}
function idbSetDirHandle(handle){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(); return; }
    let req;
    try{ req = indexedDB.open(DIRDB_NAME, 1); }catch(e){ resolve(); return; }
    req.onupgradeneeded = ()=> req.result.createObjectStore(DIRDB_STORE);
    req.onsuccess = ()=>{
      const db = req.result;
      const tx = db.transaction(DIRDB_STORE, 'readwrite');
      tx.objectStore(DIRDB_STORE).put(handle, 'dir');
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> resolve();
    };
    req.onerror = ()=> resolve();
  });
}

async function initDataFolder(){
  try{
    const handle = await idbGetDirHandle();
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      dataDirHandle = handle;
      updateDataFolderStatus();
    } else {
      updateDataFolderStatus(true);
    }
  }catch(e){ /* handle from a previous browser/session may no longer be valid — ignore */ }
}

async function chooseDataFolder(){
  if(!window.showDirectoryPicker){
    toast("This browser can't save straight to a folder — use the download buttons instead", 'danger');
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    dataDirHandle = handle;
    await idbSetDirHandle(handle);
    updateDataFolderStatus();
    toast('Data folder set — backups will auto-save here','success');
    await syncToDataFolder();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('Could not access that folder','danger');
  }
}
async function reconnectDataFolder(){
  if(!dataDirHandle){
    const handle = await idbGetDirHandle();
    if(!handle) return chooseDataFolder();
    dataDirHandle = handle;
  }
  const ok = await ensureDataFolderPermission();
  if(ok){ updateDataFolderStatus(); toast('Data folder reconnected','success'); await syncToDataFolder(); }
  else toast('Folder access was not granted','danger');
}
async function ensureDataFolderPermission(){
  if(!dataDirHandle) return false;
  try{
    let perm = await dataDirHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') perm = await dataDirHandle.requestPermission({mode:'readwrite'});
    return perm === 'granted';
  }catch(e){ return false; }
}
async function writeFileToDataFolder(filename, blob){
  if(!dataDirHandle) return false;
  const ok = await ensureDataFolderPermission();
  if(!ok) return false;
  try{
    const fileHandle = await dataDirHandle.getFileHandle(filename, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return true;
  }catch(e){ console.error('Write failed', filename, e); return false; }
}
function updateDataFolderStatus(needsReconnect){
  const el = document.getElementById('dataFolderStatus');
  if(el){
    el.textContent = dataDirHandle
      ? ('Auto-saving JSON, Excel and SQLite to: '+(dataDirHandle.name||'selected folder'))
      : (needsReconnect ? 'Folder was set previously — reconnect to resume auto-save' : 'Not set — data only lives in this browser until you export it');
  }
  const btn = document.getElementById('chooseDataFolderBtn');
  if(btn) btn.textContent = dataDirHandle ? 'Change data folder' : (needsReconnect ? 'Set up data folder (auto-save)' : 'Set up data folder (auto-save)');
  const reconnectBtn = document.getElementById('reconnectDataFolderBtn');
  if(reconnectBtn) reconnectBtn.style.display = (needsReconnect && !dataDirHandle) ? '' : 'none';
}

let syncTimer = null;
function scheduleFolderSync(){
  if(!dataDirHandle) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToDataFolder, 800);
}
async function syncToDataFolder(){
  if(!dataDirHandle) return;
  const ok = await ensureDataFolderPermission();
  if(!ok) return;
  try{
    await writeFileToDataFolder('shop-ledger-backup.json', new Blob([JSON.stringify(Object.assign({}, state, {activityLog: auditLog}),null,2)],{type:'application/json'}));
    await writeFileToDataFolder('shop-ledger-activity-log.json', new Blob([JSON.stringify(auditLog,null,2)],{type:'application/json'}));
    const xlsxBlob = await buildXlsxBlob();
    if(xlsxBlob) await writeFileToDataFolder('shop-ledger-data.xlsx', xlsxBlob);
    const dbBlob = await buildDbBlob();
    if(dbBlob) await writeFileToDataFolder('shop-ledger-data.db', dbBlob);
  }catch(e){ console.error('Folder sync failed', e); }
}

/* ---- Excel (.xlsx) export via SheetJS ---- */
let xlsxLoadPromise = null;
function loadXlsxLib(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  const urls = [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  ];
  xlsxLoadPromise = urls.reduce((p,url)=>p.catch(()=>loadScriptOnce(url)), Promise.reject())
    .then(()=>{ if(typeof XLSX==='undefined') throw new Error('XLSX library loaded but undefined'); })
    .catch(err=>{ xlsxLoadPromise = null; throw err; });
  return xlsxLoadPromise;
}
async function buildXlsxBlob(){
  try{
    await loadXlsxLib();
    const wb = XLSX.utils.book_new();

    const invRows = [['Code','Name','Category','Supplier','Qty','Min Qty','Cost Price','Sell Price']]
      .concat(state.inventory.map(x=>[x.code,x.name,x.category,x.supplier||'',x.qty,x.minQty,x.costPrice,x.sellPrice]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(invRows), 'Inventory');

    const saleRows = [['Date','Code','Name','Qty','Price','Total','Cost At Sale','Bill No']]
      .concat(state.sales.map(x=>[x.date,x.code,x.name,x.qty,x.price,x.total,x.costAtSale,x.billNo||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(saleRows), 'Sales');

    const billRows = [['Bill No','Date','Customer','Phone','GSTIN','Address','Delivery Partner','Tracking ID','Subtotal','GST Amount','Grand Total','Notes']]
      .concat(state.bills.map(b=>[b.billNo,b.date,b.customerName,b.customerPhone,b.customerGstin,b.customerAddress||'',b.deliveryPartner||'',b.trackingId||'',b.subtotal,b.gstAmount,b.grandTotal,b.notes||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(billRows), 'Bills');

    const billItemRows = [['Bill No','Item Code','Item Name','Qty','Price','Amount']];
    state.bills.forEach(b=> b.items.forEach(it=> billItemRows.push([b.billNo,it.code,it.name,it.qty,it.price,it.qty*it.price])));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(billItemRows), 'Bill Items');

    const expRows = [['Date','Category','Amount','Note']].concat((state.expenses||[]).map(x=>[x.date,x.category,x.amount,x.note||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), 'Expenses');

    const investRows = [['Date','Amount','Note']].concat((state.investments||[]).map(x=>[x.date,x.amount,x.note||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(investRows), 'Investments');

    const custRows = [['Name','Phone','GSTIN','Address']].concat((state.customers||[]).map(c=>[c.name,c.phone||'',c.gstin||'',c.address||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(custRows), 'Customers');

    const dcRows = [['DC No','Date','Customer','Phone','Address','Reason','Vehicle No','Reduces Stock','Notes']]
      .concat((state.deliveryChallans||[]).map(d=>[d.dcNo,d.date,d.customerName||'',d.customerPhone||'',d.customerAddress||'',d.reason||'',d.vehicleNo||'',d.reducesStock?'Yes':'No',d.notes||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dcRows), 'Delivery Challans');

    const dcItemRows = [['DC No','Item Code','Item Name','Qty','Declared Value/Unit']];
    (state.deliveryChallans||[]).forEach(d=> d.items.forEach(it=> dcItemRows.push([d.dcNo,it.code,it.name,it.qty,it.price||''])));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dcItemRows), 'DC Items');

    const supRows = [['Name','Phone','GSTIN','Address']].concat((state.suppliers||[]).map(s=>[s.name,s.phone||'',s.gstin||'',s.address||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(supRows), 'Suppliers');

    const catRows = [['Category']].concat((state.categories||[]).map(c=>[c]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(catRows), 'Categories');

    const piRows = [['Proforma No','Date','Customer','Phone','GSTIN','Address','Subtotal','GST Amount','Grand Total','Status','Valid Until','Converted Bill No','Notes']]
      .concat((state.proformas||[]).map(p=>[p.piNo,p.date,p.customerName||'',p.customerPhone||'',p.customerGstin||'',p.customerAddress||'',p.subtotal,p.gstAmount,p.grandTotal,p.status,p.validUntil||'',p.convertedBillNo||'',p.notes||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(piRows), 'Proforma Invoices');

    const piItemRows = [['Proforma No','Item Code','Item Name','Qty','Price','Amount']];
    (state.proformas||[]).forEach(p=> p.items.forEach(it=> piItemRows.push([p.piNo,it.code,it.name,it.qty,it.price,it.qty*it.price])));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(piItemRows), 'Proforma Items');

    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    return new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }catch(e){ console.error('xlsx build failed', e); return null; }
}
async function downloadXlsxNow(){
