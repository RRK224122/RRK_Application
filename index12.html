<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>Pack Photo Log</title>
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#17201b; --muted:#59675f; --line:#d6ddd8;
  --accent:#1f6f4a; --accent-ink:#ffffff; --accent-soft:#e1f0e8;
  --warn:#8a5200; --warn-soft:#fdf0d5; --danger:#b42318;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1512; --surface:#17201b; --ink:#e6ece7; --muted:#9aaaa0; --line:#2c3a32;
    --accent:#4cb383; --accent-ink:#07140d; --accent-soft:#1c3328;
    --warn:#f0b44c; --warn-soft:#3a2d12; --danger:#ff8a7a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.15rem;margin:0}
h2{font-size:1rem;margin:0 0 8px}
p{margin:0 0 8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;max-width:560px;margin:0 auto 12px}
.top small{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.step{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:.9rem}
input[type=text],input[type=search],input[type=number],select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;padding:13px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.big{width:100%;min-height:60px;font-size:1.1rem}
.btn.small{min-height:40px;padding:8px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;font:inherit;padding:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.list{display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button{font:inherit;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:52px}
.list button:last-child{border-bottom:0}
.list b{display:block}
.list span{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:.88rem;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:36px}
.chip.done{background:var(--accent-soft);border-color:var(--accent)}
.chip.part{background:var(--warn-soft);border-color:var(--warn)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--muted);font:inherit;font-weight:700;font-size:1.1rem;padding:0;overflow:hidden;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--accent)}
.slot.target{border-color:var(--ink);border-style:solid}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot em{position:absolute;left:4px;top:4px;font-style:normal;font-size:.75rem;background:var(--surface);color:var(--ink);padding:1px 6px;border-radius:99px;border:1px solid var(--line)}
.preview{width:100%;max-height:46vh;object-fit:contain;background:#000;border-radius:8px;display:block}
.lbl{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;min-height:32px;overflow-wrap:anywhere}
details details{margin-left:10px;padding-left:10px;border-left:2px solid var(--line)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.92rem}
.big-num{font-variant-numeric:tabular-nums}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav button{flex:1;font:inherit;font-size:.9rem;padding:14px 6px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:56px}
#nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;z-index:5;font-size:.95rem}
#toast[hidden]{display:none}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.9rem}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="top"><h1>Pack Photo Log</h1><small id="who"></small></div>
<main id="app"></main>
<nav id="nav">
  <button data-act="tab" data-tab="pack">Pack</button>
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="export">Shipments</button>
  <button data-act="tab" data-tab="data">Setup</button>
</nav>
<div id="toast" hidden role="status"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>

<script>
// ============================== CORE (pure logic, tested in Node) ==============================
function sanitize(s){
  const t = String(s == null ? '' : s).replace(/[\\\/:*?"<>|\u0000-\u001f]+/g, '-').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '');
  return t || 'NA';
}
function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? m[3] + '-' + m[2] + '-' + m[1] : 'NA';
}
function orderFolder(customer, ref, iso){ return sanitize(fmtDate(iso) + '_' + customer + '_' + ref); }
// Customer / Year / DD-MM-YYYY_Customer_Order / Box_n_Layer_n.jpg  (optionally one subfolder per layer)
function photoPath(o){  // o.ref here is the folder reference (invoice number)
  const base = sanitize(o.customer) + '/' + sanitize(o.year) + '/' + orderFolder(o.customer, o.ref, o.date) + '/';
  const f = 'Box_' + o.box + '_Layer_' + o.layer;
  return base + (o.subfolder ? f + '/' : '') + f + '.jpg';
}

const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// Stores files without compression (JPEG does not compress further).
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dt = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dd = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const f of files){
    const name = enc.encode(f.path), data = f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch, name);
    offset += 30 + name.length + data.length;
  }
  let csize = 0;
  for (const p of central) csize += p.byteLength;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
}

async function inflateRaw(u8){
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function readZipDirectory(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){ if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; } }
  if (e < 0) throw new Error('Not a valid .xlsx file');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  const entries = {};
  for (let i = 0; i < count; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Damaged .xlsx file');
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    entries[name] = { method, csize, lho };
    p += 46 + nl + xl + cl;
  }
  return { dv, entries };
}
async function zipEntryText(u8, dir, name){
  const en = dir.entries[name];
  if (!en) return null;
  const nl = dir.dv.getUint16(en.lho + 26, true), xl = dir.dv.getUint16(en.lho + 28, true);
  const start = en.lho + 30 + nl + xl;
  let data = u8.subarray(start, start + en.csize);
  if (en.method === 8) data = await inflateRaw(data);
  else if (en.method !== 0) throw new Error('Unsupported compression in .xlsx');
  return new TextDecoder().decode(data);
}
function xmlDecode(s){
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#(\d+);/g, (m, n) => String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCodePoint(parseInt(n, 16)))
    .replace(/&amp;/g, '&');
}
function colIndex(ref){
  const m = /^([A-Z]+)/i.exec(ref); let n = 0;
  for (const ch of m[1].toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function textsOf(xml){
  let out = '';
  const re = /<t\b[^>]*>([\s\S]*?)<\/t>/g; let m;
  while ((m = re.exec(xml))) out += xmlDecode(m[1]);
  return out;
}
async function parseXlsx(u8){
  const dir = readZipDirectory(u8);
  const shared = [];
  const sst = await zipEntryText(u8, dir, 'xl/sharedStrings.xml');
  if (sst){ const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g; let m; while ((m = re.exec(sst))) shared.push(textsOf(m[1])); }
  const sheets = Object.keys(dir.entries).filter(n => /^xl\/worksheets\/[^\/]+\.xml$/.test(n)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (!sheets.length) throw new Error('No sheet found in the .xlsx file');
  const xml = await zipEntryText(u8, dir, sheets[0]);
  const rows = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while ((rm = rowRe.exec(xml))){
    const row = [];
    const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
    while ((cm = cellRe.exec(rm[1]))){
      const attrs = cm[1], inner = cm[2] || '';
      const ref = /\br="([A-Z]+\d+)"/i.exec(attrs); if (!ref) continue;
      const type = (/\bt="([^"]+)"/.exec(attrs) || [])[1];
      const v = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
      let val = '';
      if (type === 's') val = v ? (shared[+v[1]] || '') : '';
      else if (type === 'inlineStr') val = textsOf(inner);
      else if (v) val = xmlDecode(v[1]);
      row[colIndex(ref[1])] = val;
    }
    rows.push(Array.from(row, c => c == null ? '' : c));
  }
  return rows;
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === ';' || c === '\t'){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function mapRows(rows){
  rows = rows.filter(r => r.some(c => String(c == null ? '' : c).trim() !== ''));
  if (rows.length < 2) throw new Error('The file has no data rows');
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const h = rows[0].map(norm);
  const iSo = h.findIndex(x => x === 'so' || x === 'sono' || x === 'sonumber' || x === 'sonum' || x.startsWith('salesorder'));
  const iInv = h.findIndex(x => x.includes('invoice') || x === 'invno' || x === 'inv');
  const iCus = h.findIndex(x => x.includes('customer') || x.includes('party') || x.includes('client'));
  const iLay = h.findIndex(x => x.includes('layer'));
  const iBox = h.findIndex(x => (x.includes('box') || x.includes('carton')) && !x.includes('layer'));
  if (iCus < 0) throw new Error('No "Customer Name" column found in the first row');
  if (iSo < 0 && iInv < 0) throw new Error('No "S/O No" or "Invoice No" column found in the first row');
  const t = v => String(v == null ? '' : v).trim();
  const map = new Map();
  for (const r of rows.slice(1)){
    const o = { so: iSo >= 0 ? t(r[iSo]) : '', invoice: iInv >= 0 ? t(r[iInv]) : '', customer: t(r[iCus]), boxes: iBox >= 0 ? (parseInt(t(r[iBox]), 10) || 0) : 0, layers: iLay >= 0 ? (parseInt(t(r[iLay]), 10) || 0) : 0 };
    if (!o.customer || (!o.so && !o.invoice)) continue;
    const k = [o.so, o.invoice, o.customer].join('|');
    const old = map.get(k);
    if (!old) map.set(k, o);
    else { old.boxes = Math.max(old.boxes, o.boxes); old.layers = Math.max(old.layers, o.layers); }
  }
  const orders = Array.from(map.values());
  if (!orders.length) throw new Error('No usable rows found');
  return { orders, hasBoxes: iBox >= 0 };
}
function csvCell(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
// ============================== /CORE ==============================

// ------------------------------ storage (IndexedDB) ------------------------------
let dbPromise;
function openDb(){
  return dbPromise || (dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('packphoto', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('photos'); d.createObjectStore('boxes'); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn){
  const d = await openDb();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbPut = (s, k, v) => tx(s, 'readwrite', o => o.put(v, k));
const dbGet = (s, k) => tx(s, 'readonly', o => o.get(k));
const dbDel = (s, k) => tx(s, 'readwrite', o => o.delete(k));
const dbAll = s => tx(s, 'readonly', o => o.getAll());

// ------------------------------ state ------------------------------
const bkey = (ref, cust, box) => [ref, cust, box].join('|');
const pkey = (ref, cust, box, layer) => [ref, cust, box, layer].join('|');
const state = {
  tab: 'pack', written: {}, saved: {}, done: {}, showDone: false, orders: [], settings: { worker: '', stamp: true, subfolder: false },
  mode: 'so', selSo: '', selInv: '', selCust: '', ref: '', customer: '', boxIn: '', layersIn: '', dateIn: '', yearIn: '',
  viewDate: '', viewUrls: {}, viewStale: true, viewLoading: false,
  boxes: {}, counts: {}, active: null, target: null, busy: false,
  confirm: '', zips: {}, msg: '', fatal: ''
};
let toastTimer;
function showToast(){ const t = $id('toast'); if (t){ t.textContent = state.msg; t.hidden = !state.msg; } }
function toast(m){ state.msg = m; showToast(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.msg = ''; showToast(); }, 3500); }
const $id = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function refreshStore(){
  const boxes = await dbAll('boxes'), photos = await dbAll('photos');
  state.boxes = {}; state.counts = {};
  for (const b of boxes) state.boxes[bkey(b.ref, b.customer, b.box)] = b;
  for (const p of photos){ const k = bkey(p.ref, p.customer, p.box); state.counts[k] = (state.counts[k] || 0) + 1; }
}
function refMap(){
  const m = new Map();
  for (const o of state.orders){
    const ref = o[state.mode]; if (!ref) continue;
    if (!m.has(ref)) m.set(ref, new Map());
    const c = m.get(ref), old = c.get(o.customer) || { boxes: 0, layers: 0 };
    c.set(o.customer, { boxes: Math.max(old.boxes, o.boxes || 0), layers: Math.max(old.layers, o.layers || 0) });
  }
  return m;
}
function todayIso(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
// Boxes made by an earlier version have no date: fall back to the day they were started.
function folderRef(ref, customer){
  const r = state.orders.find(o => (o.so === ref || o.invoice === ref) && o.customer === customer);
  return (r && r.invoice) || ref;
}
function boxMeta(b){
  let date = b.date;
  if (!date){ const d = new Date(b.started || Date.now()), p = n => String(n).padStart(2, '0'); date = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  return { date, year: b.year || date.slice(0, 4) };
}
function custInfo(){ return ((refMap().get(state.ref) || new Map()).get(state.customer)) || { boxes: 0, layers: 0 }; }
// Date and year default to the ones already used for this order, otherwise today.
function seedDate(){
  const ex = Object.values(state.boxes).filter(b => b.ref === state.ref && b.customer === state.customer).sort((a, b) => (b.started || 0) - (a.started || 0))[0];
  const m = ex ? boxMeta(ex) : { date: todayIso(), year: todayIso().slice(0, 4) };
  state.dateIn = m.date; state.yearIn = m.year;
}

// ---- order selection (drop-downs filled from Excel) ----
function natCmp(a, b){ return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }
// A shipment is "saved" once all its boxes are complete and its photos are verified in the folder.
// It stays hidden from the lists until the Excel changes (new boxes added) or you tick "Show saved orders".
const rowKey = o => (o.invoice || o.so) + '|' + o.customer;
const isDone = o => { const d = state.done[rowKey(o)]; return !!d && d.boxes === (o.boxes || 0); };
function savedCount(){ return state.orders.filter(isDone).length; }
async function markDone(ref, r){
  if (r.bad.length) return [];
  const marked = [];
  for (const c of new Set(Object.values(state.boxes).filter(b => b.ref === ref).map(b => b.customer))){

async function processPhoto(file, lines){
  const px = state.settings.px || 1600;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image', resizeWidth: px, resizeQuality: 'medium' }); }
  catch (e){ bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  const sc = Math.min(1, px / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  if (lines){
    const fs = Math.max(14, Math.round(Math.min(w, h) / 32)), pad = Math.round(fs * 0.5), lh = Math.round(fs * 1.3);
    x.font = '600 ' + fs + 'px system-ui,Arial,sans-serif'; x.textBaseline = 'top';
    const bw = Math.min(w, Math.max.apply(null, lines.map(l => x.measureText(l).width)) + pad * 2), bh = lines.length * lh + pad * 2 - (lh - fs);
    x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, h - bh, bw, bh);
    x.fillStyle = '#fff'; lines.forEach((l, i) => x.fillText(l, pad, h - bh + pad + i * lh));

}

// Speed: folder handles are cached, each folder is listed once, files are written 4 at a time,

const dirCache = new Map(), WRITE_PAR = 4;
async function getDir(parts, create){
  let d = state.dir, key = '';
  for (const q of parts){
    key += '/' + q; let c = dirCache.get(key);
    if (!c){ c = await d.getDirectoryHandle(q, { create }); dirCache.set(key, c); }

  }

}

  const k = parts.join('/'); if (lc.has(k)) return lc.get(k);

  lc.set(k, m); return m;
}

  const parts = path.split('/'), name = parts.pop(), h = (await listDir(parts, lc)).get(name);
  if (!h) return false;

  try { if ((await h.getFile()).size !== size) return false; state.written[path] = size; return true; } catch (e){ return false; }
}
async function writeToDir(path, blob){
  const parts = path.split('/'), name = parts.pop();
  for (let t = 0; t < 2; t++){
    try {
      const d = await getDir(parts, true);
      const w = await (await d.getFileHandle(name, { create: true })).createWritable();
      await w.write(blob); await w.close();

}

    case 'setdate': {
      const m = myBoxes().find(b => boxMeta(b).date === d.date);
      state.dateIn = d.date; state.yearIn = m ? boxMeta(m).year : d.date.slice(0, 4); render(); break;
    }
    case 'vtoday': state.viewDate = todayIso(); state.viewStale = true; render(); break;
    case 'pickbox': {
      state.boxIn = d.box; const ex = state.boxes[bkey(state.ref, state.customer, +d.box)];
      state.layersIn = ex ? String(ex.layers) : '';
      if (ex){ const m = boxMeta(ex); state.dateIn = m.date; state.yearIn = m.year; }
      render(); break;
    }
    case 'start': await startBox(); break;
    case 'close': closeBox(); render(); break;
    case 'shoot': {
      if (state.dir && !await dirReady(false)){
        if (await dirReady(true)) toast('Folder access allowed. Tap the photo button again.');
        else toast('Folder access not allowed. Photos stay on the phone.');
        break;
      }
      $id('cam').click(); break;
    }
    case 'target': state.target = +d.layer; render(); break;
    case 'complete': await completeBox(); break;
    case 'resetbox': if (state.confirm === 'resetbox') await resetBox(); else askConfirm('resetbox'); break;
    case 'sample': await loadSample(); break;
    case 'pickxl': $id('xl').click(); break;
    case 'zip': await buildZip(d.ref); break;
    case 'pickdir': await pickDir(); break;
    case 'cleardir': await clearDir(); break;
    case 'openfolder': if (!await dirReady(true)) { toast('Folder access was not allowed.'); break; } await loadBrowse(d.ref ? pathFor(d.ref) : []); break;
    case 'bin': await loadBrowse(state.browse.parts.concat(state.browse.items[+d.i].name)); break;
    case 'bup': await loadBrowse(state.browse.parts.slice(0, -1)); break;
    case 'bview': state.viewImg = state.browse.items[+d.i].url || ''; render(); break;
    case 'bimgclose': state.viewImg = ''; render(); break;
    case 'bclose': revokeBrowse(); state.browse = null; render(); break;
    case 'applaunch': location.href = 'intent://#Intent;package=' + d.pkg + ';end'; break;
    case 'checkdir': state.saved = {}; await checkAll(true); break;
    case 'saveall': await saveAllToDir(); break;
    case 'savedir': await saveToDir(d.ref); break;
    case 'download': {
      const z = state.zips[d.ref]; if (!z) break;
      const a = document.createElement('a'); a.href = URL.createObjectURL(z.blob); a.download = z.name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); break;
    }
    case 'share': {
      const z = state.zips[d.ref]; if (!z) break;
      const f = new File([z.blob], z.name, { type: 'application/zip' });
      try {
        if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: d.ref });
        else toast('This phone cannot share ZIP files. Use Download instead.');
      } catch (err){ if (err.name !== 'AbortError') toast('Share failed. Use Download instead.'); }
      break;
    }
    case 'delref': if (state.confirm === 'del:' + d.ref) await deleteRef(d.ref); else askConfirm('del:' + d.ref); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'boxin'){ state.boxIn = t.value; }
  else if (t.id === 'layersin'){ state.layersIn = t.value; }
  else if (t.id === 'yearin'){ state.yearIn = t.value; }
  else if (t.id === 'worker'){ state.settings.worker = t.value.trim(); saveSettings(); $id('who').textContent = state.settings.worker; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selSo' || t.id === 'selInv' || t.id === 'selCust'){ changeSel(t.id, t.value); render(); }
  else if (t.id === 'vdate'){ if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)){ state.viewDate = t.value; state.viewStale = true; render(); } }
  else if (t.id === 'boxin'){
    state.boxIn = t.value; const ex = state.boxes[bkey(state.ref, state.customer, parseInt(t.value, 10))];
    if (ex){ state.layersIn = String(ex.layers); const m = boxMeta(ex); state.dateIn = m.date; state.yearIn = m.year; }
    render();
  }
  else if (t.id === 'datein'){ state.dateIn = t.value; if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) state.yearIn = t.value.slice(0, 4); render(); }
  else if (t.id === 'yearin'){ state.yearIn = t.value; }
  else if (t.id === 'showdone'){ state.showDone = t.checked; resetSel(); render(); }
  else if (t.id === 'autosv'){ state.settings.autosave = t.checked; saveSettings(); }
  else if (t.id === 'psize'){ state.settings.px = +t.value; saveSettings(); }
  else if (t.id === 'stamp'){ state.settings.stamp = t.checked; saveSettings(); }
  else if (t.id === 'subf'){ state.settings.subfolder = t.checked; saveSettings(); render(); }
  else if (t.id === 'cam'){ const f = t.files && t.files[0]; t.value = ''; onShot(f); }
  else if (t.id === 'xl'){ const f = t.files && t.files[0]; t.value = ''; if (f) importFile(f); }
});

(async function init(){
  try {
    state.orders = (await dbGet('meta', 'orders')) || [];
    state.settings = Object.assign({ worker: '', stamp: true, subfolder: false, autosave: true }, await dbGet('meta', 'settings'), { subfolder: false });
    state.dir = (await dbGet('meta', 'dir').catch(() => null)) || null;
    state.done = (await dbGet('meta', 'done').catch(() => null)) || {};
    state.written = (await dbGet('meta', 'written').catch(() => null)) || {};
    await refreshStore();
  } catch (e){ state.fatal = 'This browser is blocking local storage. Open the app in normal (not private) Chrome.'; }
  render();
})();
</script>
</body>
</html>
