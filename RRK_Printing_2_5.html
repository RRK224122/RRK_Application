/* ---- SQLite (.db) export via sql.js ---- */
let sqlJsLoadPromise = null;
function loadSqlJsLib(){
  if(window.__SQL) return Promise.resolve(window.__SQL);
  if(sqlJsLoadPromise) return sqlJsLoadPromise;
  sqlJsLoadPromise = loadScriptOnce('https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js')
    .then(()=> window.initSqlJs({locateFile: f => 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'+f}))
    .then(SQL => { window.__SQL = SQL; return SQL; })
    .catch(err=>{ sqlJsLoadPromise = null; throw err; });
  return sqlJsLoadPromise;
}
async function buildDbBlob(){
  try{
    const SQL = await loadSqlJsLib();
    const db = new SQL.Database();
    db.run(`
      CREATE TABLE inventory (code TEXT, name TEXT, category TEXT, supplier TEXT, qty REAL, min_qty REAL, cost_price REAL, sell_price REAL);
      CREATE TABLE sales (date TEXT, code TEXT, name TEXT, qty REAL, price REAL, total REAL, cost_at_sale REAL, bill_no TEXT);
      CREATE TABLE bills (bill_no TEXT, date TEXT, customer_name TEXT, customer_phone TEXT, customer_gstin TEXT, customer_address TEXT, delivery_partner TEXT, tracking_id TEXT, subtotal REAL, gst_amount REAL, grand_total REAL, notes TEXT);
      CREATE TABLE bill_items (bill_no TEXT, item_code TEXT, item_name TEXT, qty REAL, price REAL, amount REAL);
      CREATE TABLE expenses (date TEXT, category TEXT, amount REAL, note TEXT);
      CREATE TABLE investments (date TEXT, amount REAL, note TEXT);
      CREATE TABLE customers (name TEXT, phone TEXT, gstin TEXT, address TEXT);
      CREATE TABLE delivery_challans (dc_no TEXT, date TEXT, customer_name TEXT, customer_phone TEXT, customer_address TEXT, reason TEXT, vehicle_no TEXT, reduces_stock TEXT, notes TEXT);
      CREATE TABLE dc_items (dc_no TEXT, item_code TEXT, item_name TEXT, qty REAL, declared_value_per_unit REAL);
      CREATE TABLE suppliers (name TEXT, phone TEXT, gstin TEXT, address TEXT);
      CREATE TABLE categories (category TEXT);
      CREATE TABLE proforma_invoices (pi_no TEXT, date TEXT, customer_name TEXT, customer_phone TEXT, customer_gstin TEXT, customer_address TEXT, subtotal REAL, gst_amount REAL, grand_total REAL, status TEXT, valid_until TEXT, converted_bill_no TEXT, notes TEXT);
      CREATE TABLE proforma_items (pi_no TEXT, item_code TEXT, item_name TEXT, qty REAL, price REAL, amount REAL);
    `);
    const insert = (sql, rows) => {
      const stmt = db.prepare(sql);
      rows.forEach(r => { stmt.run(r); });
      stmt.free();
    };
    insert('INSERT INTO inventory VALUES (?,?,?,?,?,?,?,?)',
      state.inventory.map(x=>[x.code,x.name,x.category,x.supplier||'',x.qty,x.minQty,x.costPrice,x.sellPrice]));
    insert('INSERT INTO sales VALUES (?,?,?,?,?,?,?,?)',
      state.sales.map(x=>[x.date,x.code,x.name,x.qty,x.price,x.total,x.costAtSale,x.billNo||'']));
    insert('INSERT INTO bills VALUES (?,?,?,?,?,?,?,?,?,?,?,?)',
      state.bills.map(b=>[b.billNo,b.date,b.customerName,b.customerPhone,b.customerGstin,b.customerAddress||'',b.deliveryPartner||'',b.trackingId||'',b.subtotal,b.gstAmount,b.grandTotal,b.notes||'']));
    const billItemRows = [];
    state.bills.forEach(b=> b.items.forEach(it=> billItemRows.push([b.billNo,it.code,it.name,it.qty,it.price,it.qty*it.price])));
    insert('INSERT INTO bill_items VALUES (?,?,?,?,?,?)', billItemRows);
    insert('INSERT INTO expenses VALUES (?,?,?,?)', (state.expenses||[]).map(x=>[x.date,x.category,x.amount,x.note||'']));
    insert('INSERT INTO investments VALUES (?,?,?)', (state.investments||[]).map(x=>[x.date,x.amount,x.note||'']));
    insert('INSERT INTO customers VALUES (?,?,?,?)', (state.customers||[]).map(c=>[c.name,c.phone||'',c.gstin||'',c.address||'']));
    insert('INSERT INTO delivery_challans VALUES (?,?,?,?,?,?,?,?,?)',
      (state.deliveryChallans||[]).map(d=>[d.dcNo,d.date,d.customerName||'',d.customerPhone||'',d.customerAddress||'',d.reason||'',d.vehicleNo||'',d.reducesStock?'Yes':'No',d.notes||'']));
    const dcItemRows2 = [];
    (state.deliveryChallans||[]).forEach(d=> d.items.forEach(it=> dcItemRows2.push([d.dcNo,it.code,it.name,it.qty,it.price||0])));
    insert('INSERT INTO dc_items VALUES (?,?,?,?,?)', dcItemRows2);
    insert('INSERT INTO suppliers VALUES (?,?,?,?)', (state.suppliers||[]).map(s=>[s.name,s.phone||'',s.gstin||'',s.address||'']));
    insert('INSERT INTO categories VALUES (?)', (state.categories||[]).map(c=>[c]));
    insert('INSERT INTO proforma_invoices VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)',
      (state.proformas||[]).map(p=>[p.piNo,p.date,p.customerName||'',p.customerPhone||'',p.customerGstin||'',p.customerAddress||'',p.subtotal,p.gstAmount,p.grandTotal,p.status,p.validUntil||'',p.convertedBillNo||'',p.notes||'']));
    const piItemRows2 = [];
    (state.proformas||[]).forEach(p=> p.items.forEach(it=> piItemRows2.push([p.piNo,it.code,it.name,it.qty,it.price,it.qty*it.price])));
    insert('INSERT INTO proforma_items VALUES (?,?,?,?,?,?)', piItemRows2);
    const data = db.export();
    db.close();
    return new Blob([data], {type:'application/x-sqlite3'});
  }catch(e){ console.error('db build failed', e); return null; }
}
async function downloadDbNow(){
  toast('Building database file…');
  const blob = await buildDbBlob();
  if(!blob){ toast('Could not build the database file — check your internet connection','danger'); return; }
  triggerDownload('shop-ledger-data-'+todayISO()+'.db', blob);
  logActivity('Download SQLite data', '');

/* ============================================================
   SCANNER
   Tries the browser's own native BarcodeDetector first (no
   internet needed once the page is loaded). Falls back to the
   html5-qrcode library, loaded on demand from a couple of CDNs,
   only for browsers that lack native support (mainly iOS Safari).
   ============================================================ */
let scannerInstance = null;   // html5-qrcode instance, if used
let nativeStream = null;      // raw camera stream, if native path used
let nativeRAF = null;         // requestAnimationFrame handle
let html5QrcodeLoadPromise = null;

function closeScannerOverlay(){
  stopScanner();
  const r = document.getElementById('scannerRoot');
  if(r) r.innerHTML = '';
}
function openScannerModal(onResult){
  // Shown as a separate layer ON TOP of the current form, so the form
  // (and the input the scanned code goes into) stays alive underneath.
  const root = document.getElementById('scannerRoot');
  root.innerHTML = `<div class="modal-backdrop" id="scannerBackdrop" style="z-index:150;background:rgba(10,12,15,.75)"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-title">Scan code</div><button class="modal-close" id="scannerCloseBtn">${ICON.close}</button></div>
    <div id="scannerView"></div>
    <div class="scanner-status" id="scannerStatus">Starting camera&hellip;</div>
  </div></div>`;
  root.querySelector('#scannerCloseBtn').addEventListener('click', closeScannerOverlay);
  root.querySelector('#scannerBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='scannerBackdrop') closeScannerOverlay(); });
  startScanner(onResult);
}
function handleScanResult(onResult, rawText){
  const code = String(rawText||'').trim();
  closeScannerOverlay();
  try{ onResult(code); }catch(e){ console.error('Scan result handler failed', e); }
  toast('Code scanned','success');
}

function cameraErrorMessage(err){
  const name = err && err.name;
  if(name==='NotAllowedError' || name==='PermissionDeniedError'){
    return 'Camera permission was denied. Allow camera access for this site in your browser settings, then try again.';
  }
  if(name==='NotFoundError' || name==='DevicesNotFoundError'){
    return 'No camera was found on this device.';
  }
  if(name==='NotReadableError' || name==='TrackStartError'){
    return 'The camera is already in use by another app. Close other camera apps and try again.';
  }
  if(name==='OverconstrainedError'){
    return 'This device has no rear camera matching what was requested. Type the code manually.';
  }
  return 'Could not access the camera. Check camera permission for this page, or type the code manually.';
}
async function startScanner(onResult){
  const statusEl = document.getElementById('scannerStatus');
  const view = document.getElementById('scannerView');

  // --- Upfront checks with clear, specific messages ---
  if(!window.isSecureContext){
    if(statusEl) statusEl.textContent = 'Camera access needs a secure page. Open this app from its https:// link (not a file opened directly) and try again.';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(statusEl) statusEl.textContent = 'This browser does not support camera access here. Try Chrome or Safari, or type the code manually.';
    return;
  }

  // --- Preferred path: native BarcodeDetector, works fully offline ---
  if('BarcodeDetector' in window){
    try{
      let formats;
      try{ formats = await BarcodeDetector.getSupportedFormats(); }catch(e){ formats = null; }
      const wanted = ['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf'];
      const useFormats = formats ? wanted.filter(f=>formats.includes(f)) : wanted;
      const detector = new BarcodeDetector(useFormats.length ? {formats:useFormats} : undefined);
      nativeStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const video = document.createElement('video');
      video.setAttribute('playsinline',''); video.muted = true;
      video.style.cssText = 'width:100%;display:block;border-radius:inherit;';
      view.innerHTML = ''; view.appendChild(video);
      video.srcObject = nativeStream;
      await video.play();
      if(statusEl) statusEl.textContent = 'Point the camera at a barcode or QR code';
      const scanLoop = async ()=>{
        if(!nativeStream) return; // stopped
        try{
          const codes = video.readyState >= 2 ? await detector.detect(video) : [];
          if(codes && codes.length){
            handleScanResult(onResult, codes[0].rawValue);
            return;
          }
        }catch(e){ /* transient decode error, keep scanning */ }
        nativeRAF = requestAnimationFrame(scanLoop);
      };
      scanLoop();
      return;
    }catch(err){
      console.error('Native scanner failed', err);
      stopScanner();
      const n = err && err.name;
      if(['NotAllowedError','PermissionDeniedError','NotFoundError','DevicesNotFoundError','NotReadableError','TrackStartError'].includes(n)){
        if(statusEl) statusEl.textContent = cameraErrorMessage(err);
        return; // a camera/permission failure won't be fixed by the fallback library
      }
      view.innerHTML = ''; // otherwise fall through to the library scanner
    }
  }

  // --- Fallback: html5-qrcode library, loaded on demand ---
  if(statusEl) statusEl.textContent = 'Loading scanner\u2026';
  try{
    await loadHtml5Qrcode();
    startHtml5QrcodeScanner(onResult);
  }catch(err){
    console.error('Scanner library failed to load', err);
    if(statusEl) statusEl.textContent = 'Scanner could not load — check your internet connection, or type the code manually.';
  }
}

function loadScriptOnce(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('Failed to load '+url));
    document.head.appendChild(s);
  });
}
function loadHtml5Qrcode(){
  if(typeof Html5Qrcode !== 'undefined') return Promise.resolve();
  if(html5QrcodeLoadPromise) return html5QrcodeLoadPromise;
  const urls = [
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.0.7/html5-qrcode.min.js'
  ];
  html5QrcodeLoadPromise = urls.reduce(
    (p, url) => p.catch(()=> loadScriptOnce(url)),
    Promise.reject()
  ).then(()=>{
    if(typeof Html5Qrcode === 'undefined') throw new Error('Library loaded but Html5Qrcode is undefined');
  }).catch((err)=>{ html5QrcodeLoadPromise = null; throw err; });
  return html5QrcodeLoadPromise;
}
function startHtml5QrcodeScanner(onResult){
  const statusEl = document.getElementById('scannerStatus');
  let formatsToSupport;
  try{
    formatsToSupport = [
      Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.ITF
    ];
  }catch(e){ formatsToSupport = undefined; }
  scannerInstance = new Html5Qrcode('scannerView', formatsToSupport ? {formatsToSupport, verbose:false} : {verbose:false});
  scannerInstance.start(
    {facingMode:'environment'},
    {fps:10, qrbox:{width:230,height:150}},
    (decodedText)=>{
      handleScanResult(onResult, decodedText);
    },
    ()=>{ /* per-frame scan failure, ignore */ }
  ).then(()=>{ if(statusEl) statusEl.textContent = 'Point the camera at a barcode or QR code'; })
   .catch((err)=>{
      if(statusEl) statusEl.textContent = cameraErrorMessage(err);
      console.error(err);
   });
}
function stopScanner(){
  if(nativeRAF){ cancelAnimationFrame(nativeRAF); nativeRAF = null; }
  if(nativeStream){ nativeStream.getTracks().forEach(t=>t.stop()); nativeStream = null; }
  if(scannerInstance){
    try{
      scannerInstance.stop().then(()=>{ try{scannerInstance.clear();}catch(e){} scannerInstance=null; })
        .catch(()=>{ scannerInstance=null; });
    }catch(e){ scannerInstance=null; }
  }
}

  const expBackupBtn = document.getElementById('exportBackupJson');
  if(expBackupBtn) expBackupBtn.addEventListener('click', downloadBackup);

// Lightweight partial re-render for the search box so focus isn't lost while typing.
function renderPageInPlace(pageId){
  if(currentPage!==pageId) return;
  const main = document.getElementById('pages');
  const activeEl = document.activeElement;
  const isSearch = activeEl && activeEl.id==='invSearch';
  const selStart = isSearch ? activeEl.selectionStart : null;
  if(pageId==='inventory') main.innerHTML = pageInventory();
  attachPageHandlers();
  if(isSearch){
    const el = document.getElementById('invSearch');
    if(el){ el.focus(); if(selStart!=null) el.setSelectionRange(selStart, selStart); }
  }
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(mode){
  if(mode){ document.documentElement.setAttribute('data-theme', mode); localStorage.setItem(THEME_KEY, mode); }
  const current = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  document.getElementById('themeToggleBtn').innerHTML = (current==='dark' ? ICON.sun : ICON.moon) + '<span class="topbar-btn-label">Theme</span>';
}
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  applyTheme(null);
  document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
    applyTheme(cur==='dark' ? 'light' : 'dark');
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  load();
  await ensureDefaultAdmin();
  initTheme();
  applyBackground((state.uiSettings && state.uiSettings.background) || 'grid');
  const nameInput = document.getElementById('shopNameInput');
  nameInput.value = state.shopName;
  nameInput.addEventListener('change', ()=>{
    const oldName = state.shopName;
    const newName = nameInput.value.trim() || 'My Shop';
    if(newName === oldName) return;
    if(needsApproval('Change business name', ()=>nameInput.dispatchEvent(new Event('change')), ()=>{ nameInput.value = oldName; })) return;
    state.shopName = newName;
    save(); refreshBrandLogo();
    logActivity('Edit business name', oldName+' → '+newName);
  });
  document.getElementById('backupBtn').insertAdjacentHTML('afterbegin', ICON.backup);
  document.getElementById('backupBtn').addEventListener('click', openBackupModal);
  document.getElementById('businessBtn').insertAdjacentHTML('afterbegin', ICON.settings);
  document.getElementById('businessBtn').addEventListener('click', openBusinessModal);
  document.getElementById('customersBtn').insertAdjacentHTML('afterbegin', ICON.users);
  document.getElementById('customersBtn').addEventListener('click', openCustomersModal);
  document.getElementById('suppliersBtn').insertAdjacentHTML('afterbegin', ICON.truck);

  document.getElementById('employeesBtn').insertAdjacentHTML('afterbegin', ICON.badge);

  document.getElementById('usersBtn').insertAdjacentHTML('afterbegin', ICON.users);
  document.getElementById('usersBtn').addEventListener('click', ()=>{ currentPage='users'; renderAll(); window.scrollTo({top:0}); });
  document.getElementById('activityLogBtn').insertAdjacentHTML('afterbegin', ICON.history);

  document.getElementById('appearanceBtn').insertAdjacentHTML('afterbegin', ICON.palette);
  document.getElementById('appearanceBtn').addEventListener('click', openAppearanceModal);
  initAuthUI();
  refreshBrandLogo();
  initDataFolder();

  if(tryRestoreSession()){
    showAuthOverlay(false);

    applyRoleVisibility();
    const lu = document.getElementById('loginUsername');
    if(lu) lu.focus();
  }
}
document.addEventListener('DOMContentLoaded', init);
