<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RRK Printing Solutions &amp; Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --bg2:#EAE5DA;
  --surface:#FFFFFF; --surface2:#F7F4EC;
  --border:#D9D2C2; --border-strong:#C4BBA4;
  --text:#221E17; --text-dim:#6B6252; --text-faint:#948C78;
  --accent:#B5651D; --accent-ink:#FFFFFF; --accent-soft:#EFD9BC;
  --accent2:#2D6E68; --accent2-soft:#D6E6E3;
  --danger:#B33D2E; --danger-soft:#F2DCD6;
  --success:#2E7D4F; --success-soft:#DCEBDF;
  --radius-s:3px; --radius-m:8px; --radius-l:14px;
  --shadow: 0 1px 2px rgba(34,30,23,.06), 0 6px 18px rgba(34,30,23,.06);
}
:root[data-theme="dark"]{
  --bg:#10151B; --bg2:#0C1015;
  --surface:#1A212B; --surface2:#212A36;
  --border:#2B3542; --border-strong:#3A4657;
  --text:#E9EDF2; --text-dim:#9AA7B6; --text-faint:#69768A;
  --accent:#E2963C; --accent-ink:#1A140A; --accent-soft:#3A2C16;
  --accent2:#4FBDB2; --accent2-soft:#16302D;
  --danger:#E2694F; --danger-soft:#3A1F19;
  --success:#5BC98A; --success-soft:#173425;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --bg2:#0C1015;
    --surface:#1A212B; --surface2:#212A36;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E9EDF2; --text-dim:#9AA7B6; --text-faint:#69768A;
    --accent:#E2963C; --accent-ink:#1A140A; --accent-soft:#3A2C16;
    --accent2:#4FBDB2; --accent2-soft:#16302D;
    --danger:#E2694F; --danger-soft:#3A1F19;
    --success:#5BC98A; --success-soft:#173425;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:28px 28px;
  background-attachment:fixed;
  background-position:-1px -1px;
}
:root[data-theme="dark"] body, @media (prefers-color-scheme:dark){ body{ } }
body{ }
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}

#app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;flex-direction:column;
  padding:16px 18px 12px;
  gap:12px;
}
.topbar-row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;width:100%;}
.brand{display:flex;align-items:center;min-width:0;flex:0 0 auto;}
.topbar-account{
  display:block;flex:0 1 auto;min-width:0;max-width:100%;
  background:var(--accent-soft);color:var(--accent);border-radius:20px;
  padding:6px 12px;font-size:clamp(11px,1.3vw,12.5px);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;
}
.brand-mark{
  height:42px;width:auto;background:none;border-radius:0;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;min-width:0;width:100%;}
#shopNameInput{
  background:transparent;border:none;color:var(--text);
  font-size:clamp(14px,4vw,18px);font-weight:700;padding:2px 0;width:100%;
  border-bottom:1px solid transparent;text-overflow:ellipsis;
}
#shopNameInput:focus{outline:none;border-bottom:1px solid var(--accent);}
.brand-sub{font-size:11px;color:var(--text-faint);letter-spacing:.02em;}
.topbar-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));align-items:stretch;gap:8px;width:100%;padding-top:10px;border-top:1px solid var(--border);}
.icon-btn{
  width:clamp(34px,3.6vw,42px);height:clamp(34px,3.6vw,42px);border-radius:var(--radius-m);
  border:1px solid var(--border);background:var(--surface);flex-shrink:0;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .15s, color .15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn svg{width:clamp(15px,1.6vw,19px);height:clamp(15px,1.6vw,19px);}
.topbar-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-width:0;border-radius:var(--radius-m);
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);padding:9px 6px 8px;
  cursor:pointer;transition:border-color .15s, color .15s;
}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent);}
.topbar-btn svg{width:20px;height:20px;}
.topbar-btn-label{font-size:11.5px;font-weight:600;letter-spacing:.01em;line-height:1.1;white-space:nowrap;}

/* ---------- Layout ---------- */
main{flex:1;padding:4px 16px 96px;}
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ .page{animation:none;} }

h1,h2,h3{font-weight:600;margin:0;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 14px;gap:10px;flex-wrap:wrap;}
.page-title{font-size:20px;}
.page-sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-l);padding:16px;box-shadow:var(--shadow);
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:clamp(8px,1.3vw,11px) clamp(12px,2vw,18px);border-radius:var(--radius-m);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:clamp(12.5px,1.4vw,14.5px);font-weight:500;
  cursor:pointer;transition:transform .1s, border-color .15s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;}
.btn-ghost:hover{border-color:var(--accent);}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-icon{padding:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  max-width:1100px;margin:0 auto;z-index:40;
}
.nav-btn{
  flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-faint);padding:6px 2px;
  cursor:pointer;border-radius:var(--radius-m);font-size:clamp(9.5px,2.6vw,11px);font-weight:500;
}
.nav-btn svg{width:clamp(18px,5vw,22px);height:clamp(18px,5vw,22px);}
.nav-btn.active{color:var(--accent);}
.nav-btn:active{background:var(--surface2);}

@media (min-width:760px){
  .bottomnav{
    position:fixed;left:50%;bottom:18px;right:auto;transform:translateX(-50%);
    width:auto;max-width:none;margin:0;
    background:var(--surface);border:1px solid var(--border);border-top:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow);
    justify-content:center;gap:4px;padding:7px;
  }
  .nav-btn{flex:none;max-width:none;flex-direction:row;gap:clamp(6px,1vw,9px);padding:clamp(8px,1.1vw,11px) clamp(14px,2.2vw,22px);border:1px solid transparent;font-size:clamp(12px,1.4vw,14.5px);border-radius:10px;}
  .nav-btn svg{width:clamp(17px,1.8vw,21px);height:clamp(17px,1.8vw,21px);}
  .nav-btn.active{background:var(--accent-soft);border-color:transparent;}
  main{padding-bottom:96px;}
}
@media (min-width:860px){
  #app{max-width:1180px;}
}

/* ---------- Dashboard ---------- */
.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero-trace{position:absolute;top:0;right:0;height:100%;width:150px;opacity:.5;pointer-events:none;}
.hero-label{font-size:12px;color:var(--text-faint);}
.hero-value{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.hero-value.neg{color:var(--danger);}
.hero-value.pos{color:var(--success);}
.hero-row{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;}
.hero-stat{min-width:100px;}
.hero-stat-label{font-size:11px;color:var(--text-faint);}
.hero-stat-value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin-top:3px;}

.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:13px 14px;}
.stat-card-label{font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
.stat-card-label svg{width:13px;height:13px;flex-shrink:0;}
.stat-card-value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:6px;}

.section-label{font-size:12.5px;font-weight:600;color:var(--text-dim);margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;}

.low-stock-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.low-stock-row:last-child{border-bottom:none;}
.pill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;font-family:'IBM Plex Mono',monospace;}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-warn{background:var(--accent-soft);color:var(--accent);}
.pill-ok{background:var(--success-soft);color:var(--success);}
.pill-muted{background:var(--surface2);color:var(--text-faint);}

/* ---------- Toolbar / search ---------- */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1;min-width:160px;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
.search-wrap input{width:100%;padding:10px 12px 10px 34px;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;}
.search-wrap input:focus{outline:none;border-color:var(--accent);}
select.filter-select{padding:10px 10px;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;}

/* ---------- List rows / table ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.item-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:12px 13px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:border-color .15s;
}
.item-row:hover{border-color:var(--border-strong);}
.item-code{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent);
  background:var(--accent-soft);padding:3px 7px;border-radius:var(--radius-s);flex-shrink:0;
  white-space:nowrap;
}
.item-main{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.item-right{text-align:right;flex-shrink:0;}
.item-price{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
.item-qty{font-size:11px;color:var(--text-faint);margin-top:2px;}

.ledger-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:12px 13px;display:flex;align-items:center;gap:12px;
}
.ledger-icon{
  width:34px;height:34px;border-radius:var(--radius-m);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ledger-icon svg{width:16px;height:16px;}
.ledger-main{flex:1;min-width:0;}
.ledger-title{font-size:13.5px;font-weight:500;overflow-wrap:anywhere;}
.ledger-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.ledger-amt{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;flex-shrink:0;}
.ledger-del{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:6px;flex-shrink:0;}
.ledger-del:hover{color:var(--danger);}
.ledger-del svg{width:15px;height:15px;display:block;}

.empty-state{
  text-align:center;padding:44px 20px;color:var(--text-faint);
  border:1px dashed var(--border-strong);border-radius:var(--radius-l);
}
.empty-state svg{width:30px;height:30px;margin-bottom:10px;opacity:.6;}
.empty-state-title{font-size:14px;color:var(--text-dim);font-weight:500;}
.empty-state-sub{font-size:12.5px;margin-top:4px;}

/* ---------- Tabs (Cash page) ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);padding:4px;border-radius:var(--radius-m);width:fit-content;}
.subtab{padding:7px 15px;border-radius:var(--radius-s);border:none;background:none;color:var(--text-faint);font-size:13px;font-weight:500;cursor:pointer;}
.subtab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:84px;z-index:41;
  width:clamp(48px,6vw,58px);height:clamp(48px,6vw,58px);border-radius:50%;
  background:var(--accent);color:var(--accent-ink);border:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);
  cursor:pointer;
}
.fab svg{width:clamp(20px,2.4vw,25px);height:clamp(20px,2.4vw,25px);}
@media (min-width:760px){ .fab{bottom:92px;} }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s ease;
}
@media (min-width:640px){ .modal-backdrop{align-items:center;} }
.modal-sheet{
  background:var(--bg2);border:1px solid var(--border);border-top:1px solid var(--border);
  border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
@media (min-width:640px){ .modal-sheet{border-radius:var(--radius-l);max-height:85vh;} }
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:16.5px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;}
.modal-close svg{width:19px;height:19px;display:block;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-m);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-with-btn{display:flex;gap:8px;}
.field-with-btn input{flex:1;}
.field-hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.field-check{display:flex;align-items:flex-start;gap:9px;background:var(--surface2);padding:11px 12px;border-radius:var(--radius-m);}
.field-check input{width:16px;height:16px;margin-top:1px;flex-shrink:0;}
.field-check-text{font-size:12.5px;color:var(--text-dim);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

/* ---------- Scanner ---------- */
#scannerView{width:100%;border-radius:var(--radius-m);overflow:hidden;background:#000;min-height:240px;}
.scanner-status{text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:10px;}

/* ---------- Reports ---------- */
.report-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.report-table tr{border-bottom:1px solid var(--border);}
.report-table tr:last-child{border-bottom:none;}
.report-table td{padding:10px 4px;}
.report-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.report-table tr.total-row td{border-top:2px solid var(--border-strong);font-weight:700;padding-top:13px;}
.report-table tr.sub td:first-child{padding-left:18px;color:var(--text-dim);font-weight:400;}
.report-table tr.sub td:last-child{font-weight:500;}

/* ---------- Toast ---------- */
.toast{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:var(--radius-m);font-size:13px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast svg{width:15px;height:15px;flex-shrink:0;}
.toast.success{border-color:var(--success);color:var(--success);}
.toast.danger{border-color:var(--danger);color:var(--danger);}

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible, .item-row:focus-visible, .nav-btn:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}

/* ---------- Background variants ---------- */
body[data-bg="plain"]{ background-image:none; }
body[data-bg="dots"]{
  background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
  background-size:20px 20px; background-position:-1px -1px;
}
body[data-bg="soft"]{
  background-image: radial-gradient(circle at 15% 0%, var(--accent-soft) 0%, transparent 45%),
                     radial-gradient(circle at 100% 20%, var(--accent2-soft) 0%, transparent 40%);
  background-size:auto; background-attachment:fixed;
}
body[data-bg="image"]{
  background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed;
}
.bg-preview{
  width:100%;height:84px;border-radius:var(--radius-m);border:1px solid var(--border);
  background-size:cover;background-position:center;background-color:var(--surface2);
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:11px;margin-bottom:10px;
}

/* ---------- Brand logo mark ---------- */
.brand-mark{height:clamp(44px,6vw,56px);width:auto;flex-shrink:0;}
:root[data-theme="dark"] .brand-mark img,:root[data-theme="dark"] .auth-logo img{background:#fff;border-radius:8px;padding:3px 6px;box-sizing:content-box;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-mark img,:root:not([data-theme="light"]) .auth-logo img{background:#fff;border-radius:8px;padding:3px 6px;box-sizing:content-box;}}
.brand-mark svg,.brand-mark img{height:100%;width:auto;display:block;}

/* ---------- Auth overlay ---------- */
.auth-overlay{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:20px;
}
.auth-overlay.hidden{display:none;}
.auth-card{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-l);padding:28px 24px;box-shadow:var(--shadow);text-align:center;
}
.auth-logo{height:clamp(70px,16vw,96px);width:auto;margin:0 auto 14px;display:flex;justify-content:center;}
.auth-logo svg,.auth-logo img{height:100%;width:auto;display:block;}
.auth-shopname{font-weight:700;font-size:16.5px;margin-bottom:2px;}
.auth-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:18px;}
.auth-card form{text-align:left;}
.auth-error{color:var(--danger);font-size:12.5px;margin:-4px 0 12px;min-height:1px;}
.auth-hint{font-size:11px;color:var(--text-faint);margin-top:14px;line-height:1.5;}

/* ---------- Users & Activity log ---------- */
.role-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);}
.role-pill.role-admin{background:var(--accent-soft);color:var(--accent);}
.role-pill.role-manager{background:var(--accent2-soft);color:var(--accent2);}
.role-pill.role-cashier{background:var(--success-soft);color:var(--success);}
.role-pill.role-viewer{background:var(--surface2);color:var(--text-dim);}
.user-row, .log-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
.user-row:last-child, .log-row:last-child{border-bottom:none;}
.user-row-main{flex:1;min-width:0;}
.user-row-name{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;}
.user-row-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.log-row-main{flex:1;min-width:0;}
.log-row-action{font-size:13px;overflow-wrap:anywhere;}
.log-row-meta{font-size:11px;color:var(--text-faint);margin-top:1px;}
.hidden-role{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-row1">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
      </div>
      <div class="topbar-account" id="userChip"></div>
    </div>
    <div class="brand-text">
      <input id="shopNameInput" type="text" maxlength="40" spellcheck="false">
      <span class="brand-sub">Printing Solutions &amp; Automation</span>
    </div>
    <div class="topbar-actions" id="topbarActions">
      <button class="topbar-btn" id="customersBtn" title="Customers"><span class="topbar-btn-label">Customers</span></button>
      <button class="topbar-btn" id="suppliersBtn" title="Suppliers"><span class="topbar-btn-label">Suppliers</span></button>
      <button class="topbar-btn" id="employeesBtn" title="Employees"><span class="topbar-btn-label">Employees</span></button>
      <button class="topbar-btn" id="activityLogBtn" title="View logs"><span class="topbar-btn-label">View logs</span></button>
      <button class="topbar-btn" id="businessBtn" title="Settings"><span class="topbar-btn-label">Settings</span></button>
      <button class="topbar-btn" id="backupBtn" title="Backup &amp; restore"><span class="topbar-btn-label">Backup</span></button>
      <button class="topbar-btn" id="logoutBtn" title="Sign out"><span class="topbar-btn-label">Sign out</span></button>
    </div>
  </header>

  <nav class="bottomnav" id="bottomNav"></nav>

  <main id="pages"></main>

</div>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo" id="authLogoMark"></div>
    <div class="auth-shopname" id="authShopName"></div>
    <div class="auth-sub">Sign in to continue</div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
      <button type="button" id="forgotPwBtn" style="width:100%;margin-top:10px;background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:6px;">Forgot password?</button>
    </form>
    <div class="auth-hint" id="authHint"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="scannerRoot"></div>
<div id="approvalRoot"></div>
<div id="forgotRoot"></div>
<div id="toastRoot" style="position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;"></div>

function shopInitials(){

  if(!words.length) return 'SL';
  if(words.length===1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0]+words[1][0]).toUpperCase();
}
function gearPoints(cx, cy, rInner, rOuter, teeth){
  const pts = [];
  for(let i=0;i<teeth*2;i++){
    const r = i%2===0 ? rOuter : rInner;
    const a = (Math.PI*2*i)/(teeth*2) - Math.PI/2;
    pts.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}

let currentUser = null;

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function ensureDefaultAdmin(){
  if(state.users && state.users.length) return;
  const hash = await sha256Hex('admin123');
  state.users.push({id:uid(), username:'admin', name:'Administrator', role:'admin', passHash:hash, active:true, mustChangePw:true, createdAt:todayISO()});
  save();
}
function findUser(username){
  return state.users.find(u=>u.username.toLowerCase()===String(username||'').trim().toLowerCase());
}
function roleOf(user){ return ROLES[user && user.role] || ROLES.viewer; }
function canAccessPage(pageId){
  if(!currentUser) return false;
  const r = roleOf(currentUser);
  return r.pages==='*' || r.pages.includes(pageId);
}
function firstAllowedPage(){
  const r = roleOf(currentUser);
  if(r.pages==='*') return 'dashboard';
  return r.pages[0] || 'dashboard';
}
/* ---- Permanent audit log: stored under its OWN key, separate from the shop data,
   so "Erase all data", restoring a backup, or any other data change never removes it. ---- */
const AUDIT_KEY = 'shopledger_audit_v1';
let auditLog = [];   // newest first
function loadAudit(){
  try{ const a = JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]'); auditLog = Array.isArray(a) ? a : []; }
  catch(e){ console.error('Audit load failed', e); auditLog = []; }
}
function saveAudit(){
  try{ localStorage.setItem(AUDIT_KEY, JSON.stringify(auditLog)); }
  catch(e){ console.error('Audit save failed', e); toast('Could not save the activity log — device storage may be full','danger'); }
}
function mergeAudit(list){
  if(!Array.isArray(list) || !list.length) return;
  const ids = new Set(auditLog.map(e=>e.id));
  let added = false;
  list.forEach(e=>{ if(e && e.id && !ids.has(e.id)){ auditLog.push(e); ids.add(e.id); added = true; } });
  if(added){ auditLog.sort((a,b)=> String(b.ts||'').localeCompare(String(a.ts||''))); saveAudit(); }
}
function logActivity(action, details){
  auditLog.unshift({
    id:uid(), ts:new Date().toISOString(),
    userId: currentUser ? currentUser.id : null,
    username: currentUser ? currentUser.username : 'system',
    role: currentUser ? currentUser.role : '',
    action, details: String(details||'').slice(0,800)
  });
  saveAudit();
  scheduleFolderSync();
}
function diffText(before, after, fields, label){
  const cut = v => { v = (v==null?'':String(v)); return v.length>80 ? v.slice(0,80)+'…' : (v||'(empty)'); };
  const ch = [];
  fields.forEach(f=>{
    const a = before[f]==null?'':String(before[f]), b = after[f]==null?'':String(after[f]);
    if(a!==b) ch.push(f+': '+cut(a)+' → '+cut(b));
  });
  const body = ch.length ? ch.join('; ') : 'no field changes';
  return label ? label+' — '+body : body;
}

/* ---- Admin approval: every modification needs an administrator's password ---- */
let approvalGrantUntil = 0;
function needsApproval(label, retry, onCancel){
  if(Date.now() < approvalGrantUntil){ approvalGrantUntil = 0; return false; }
  requestAdminApproval(label, ()=>{ approvalGrantUntil = Date.now()+20000; retry(); }, onCancel);
  return true;
}
function requestAdminApproval(label, onApproved, onCancel){
  const root = document.getElementById('approvalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="approvalBackdrop" style="z-index:160;background:rgba(10,12,15,.75)"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-title">Admin approval needed</div><button class="modal-close" type="button" id="apCloseBtn">${ICON.close}</button></div>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:0;">${esc(label)}<br>An administrator must enter their password to approve this change.</p>
    <form id="apForm">
      <div class="field"><label>Admin password</label><input type="password" id="apPass" autocomplete="off" required></div>
      <div id="apError" style="color:var(--danger,#d64545);font-size:12.5px;min-height:16px;margin-bottom:8px;"></div>
      <div class="modal-actions"><button type="button" class="btn" id="apCancelBtn">Cancel</button><button type="submit" class="btn btn-primary">Approve</button></div>
    </form>
  </div></div>`;
  const close = ()=>{ root.innerHTML = ''; };
  const cancel = ()=>{ close(); logActivity('Change cancelled (no admin approval)', label); if(onCancel) onCancel(); };
  root.querySelector('#apCloseBtn').addEventListener('click', cancel);
  root.querySelector('#apCancelBtn').addEventListener('click', cancel);
  root.querySelector('#apForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pw = root.querySelector('#apPass').value;
    const hash = await sha256Hex(pw);
    const admin = (state.users||[]).find(u=>u.role==='admin' && u.active && u.passHash===hash);
    if(!admin){
      root.querySelector('#apError').textContent = 'Incorrect admin password.';
      root.querySelector('#apPass').value = '';
      logActivity('Admin approval failed', label);
      return;
    }
    close();
    logActivity('Admin approval granted', label+' — approved by '+admin.username);
    onApproved();
  });
  setTimeout(()=>{ const i = root.querySelector('#apPass'); if(i) i.focus(); }, 50);
}

   FORGOT PASSWORD / ADMIN RECOVERY KEY
   Staff: an admin resets their password (Users -> Edit user).
   Admin: uses the one-time-shown recovery key. The key is stored only as a hash.
   ============================================================ */
const RK_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const RK_LOCK_KEY = 'shopledger_rk_lock';
function newRecoveryKey(){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  let k = ''; a.forEach((b,i)=>{ k += RK_ALPHABET[b%32]; if(i%4===3 && i<15) k += '-'; });
  return k;
}
function normRk(k){ return String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function rkHash(k){ return sha256Hex('rrk-recovery:'+normRk(k)); }
function rkLockInfo(){ try{ return JSON.parse(localStorage.getItem(RK_LOCK_KEY)||'{}'); }catch(e){ return {}; } }
function rkLockedMs(){ const i = rkLockInfo(); return i.until && i.until>Date.now() ? i.until-Date.now() : 0; }
function rkFail(){
  const i = rkLockInfo(); i.count = (i.count||0)+1;
  if(i.count>=5){ i.until = Date.now()+10*60*1000; i.count = 0; }
  try{ localStorage.setItem(RK_LOCK_KEY, JSON.stringify(i)); }catch(e){}
}
function rkClear(){ try{ localStorage.removeItem(RK_LOCK_KEY); }catch(e){} }

function recoveryKeyPanelHtml(key){
  return `<div style="font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:1px;text-align:center;padding:16px 8px;border:2px dashed var(--border-strong);border-radius:10px;background:var(--surface2);word-break:break-all;margin:6px 0 10px;">${esc(key)}</div>
    <p style="font-size:12.5px;color:var(--danger);line-height:1.5;margin:0 0 10px;"><strong>Shown only once.</strong> Write it down or save it somewhere safe (not on this device only). Anyone who has this key can reset an admin password. The old key no longer works.</p>
    <div class="modal-actions">
      <button type="button" class="btn" id="rkCopyBtn">Copy</button>
      <button type="button" class="btn" id="rkSaveBtn">Save as file</button>
      <button type="button" class="btn btn-primary" id="rkDoneBtn">I have saved it</button>
    </div>`;
}
function wireRecoveryKeyPanel(key, onDone){
  document.getElementById('rkCopyBtn').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(key); toast('Recovery key copied','success'); }
    catch(e){ toast('Could not copy — please write it down','danger'); }
  });
  document.getElementById('rkSaveBtn').addEventListener('click', ()=>{
    const txt = (state.shopName||'Shop')+' — admin recovery key\nCreated: '+todayISO()+'\n\n'+key+'\n\nKeep this private. Use it on the sign-in screen: Forgot password? → Admin.\n';
    triggerDownload('admin-recovery-key.txt', new Blob([txt],{type:'text/plain'}));
  });
  document.getElementById('rkDoneBtn').addEventListener('click', onDone);
}
async function issueRecoveryKey(){
  const key = newRecoveryKey();
  state.recoveryHash = await rkHash(key);
  state.recoveryCreatedAt = todayISO();
  save();
  return key;
}

/* ---- Security questions: an easier-to-remember way for an admin to recover their own password ---- */
const SQ_SUGGESTIONS = [
  "What was the name of your first school?",
  "In which town or village were you born?",
  "What is your mother's native place?",
  "What was your childhood nickname?",
  "What was the name of your first pet?",
  "Who was your favourite teacher?",
  "What was the name of your first employer?",
  "What is your favourite childhood game?"
];
function normAns(a){ return String(a||'').toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]/gu,''); }
function sqHash(userId, i, answer){ return sha256Hex('rrk-sq:'+userId+':'+i+':'+normAns(answer)); }

/* ---- Email reset code (sent through EmailJS; needs internet + a free EmailJS account) ---- */
const EMAIL_CODE_MIN = 10;
const EMAIL_SEND_LOG = 'shopledger_reset_mail_log';
let pendingEmailReset = null;   // {userId, codeHash, expires, tries}
function emailCfg(){ return state.emailReset || {}; }
function emailResetReady(){ const c = emailCfg(); return !!(c.enabled && c.serviceId && c.templateId && c.publicKey); }
function maskEmail(e){ const [n,d] = String(e||'').split('@'); return n ? n.slice(0,1)+'•••@'+(d||'') : ''; }
function newEmailCode(){
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return Array.from(a).map(b=>RK_ALPHABET[b%32]).join('');
}
function emailCodeHash(userId, code){ return sha256Hex('rrk-email:'+userId+':'+normRk(code)); }
function resetMailRecipients(target){
  const admins = (state.users||[]).filter(u=>u.role==='admin' && u.active && u.email);
  if(target.role==='admin' && target.email) return [target];
  return admins;
}
function resetMailRateOk(){
  let log = []; try{ log = JSON.parse(localStorage.getItem(EMAIL_SEND_LOG)||'[]'); }catch(e){}
  const now = Date.now(); log = log.filter(t=>now-t < 15*60*1000);
  if(log.length>=3) return false;
  log.push(now); try{ localStorage.setItem(EMAIL_SEND_LOG, JSON.stringify(log)); }catch(e){}
  return true;
}
async function sendEmailJs(params){
  const c = emailCfg();
  const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({service_id:c.serviceId, template_id:c.templateId, user_id:c.publicKey, template_params:params})
  });
  if(!res.ok){ throw new Error((await res.text()) || ('HTTP '+res.status)); }
}
/* Creates a code for `target`, emails it, returns the recipients it was sent to. */
async function requestResetEmail(target){
  const to = resetMailRecipients(target);
  if(!to.length) throw new Error('NO_EMAIL');
  if(!resetMailRateOk()) throw new Error('RATE');
  const code = newEmailCode();
  for(const r of to){
    await sendEmailJs({
      to_email:r.email, to_name:r.name||r.username, code, shop_name:state.shopName||'Shop',
      requested_for:(target.name||target.username)+' (@'+target.username+')', minutes:String(EMAIL_CODE_MIN)
    });
  }
  pendingEmailReset = {userId:target.id, codeHash: await emailCodeHash(target.id, code), expires: Date.now()+EMAIL_CODE_MIN*60000, tries:0};
  return to;
}

    if(needsApproval('Change email password-reset settings', ()=>document.getElementById('emSaveBtn').click())) return;
    state.emailReset = v; save();

    const v = read();
    if(!v.serviceId||!v.templateId||!v.publicKey){ toast('Fill in all three IDs first','danger'); return; }
    if(!currentUser.email){ toast('Add your email in Users & access first','danger'); return; }
    const btn = document.getElementById('emTestBtn'); btn.disabled = true; btn.textContent = 'Sending…';
    const old = state.emailReset; state.emailReset = Object.assign({}, v, {enabled:true});

      toast('Test email sent to '+maskEmail(currentUser.email),'success');

function openSecurityQuestionsModal(){
  if(!isAdmin()) return;
  const cur = currentUser.securityQa || [];
  const rows = [0,1,2].map(i=>`
    <div class="field"><label>Question ${i+1}</label><input type="text" class="sq-q" list="sqList" autocomplete="off" placeholder="Pick one or type your own" value="${esc(cur[i]?cur[i].q:'')}"></div>
    <div class="field"><label>Your answer</label><input type="text" class="sq-a" autocomplete="off"></div>`).join('');
  openModal(`
    <div class="modal-head"><div class="modal-title">Security questions</div><button class="modal-close" id="sqCloseBtn">${ICON.close}</button></div>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-top:-2px;">Choose 3 questions only you can answer. To reset a password, <strong>all 3</strong> answers must be right. Capitals, spaces and punctuation don't matter. Avoid answers others could guess or find on social media.</p>
    <datalist id="sqList">${SQ_SUGGESTIONS.map(q=>`<option value="${esc(q)}">`).join('')}</datalist>
    ${rows}
    <div class="modal-actions"><button type="button" class="btn" id="sqBackBtn">Back</button><button type="button" class="btn btn-primary" id="sqSaveBtn">Save</button></div>`);
  document.getElementById('sqCloseBtn').addEventListener('click', closeModal);
  document.getElementById('sqBackBtn').addEventListener('click', openRecoveryKeyModal);
  document.getElementById('sqSaveBtn').addEventListener('click', async ()=>{
    const qs = Array.from(document.querySelectorAll('.sq-q')).map(i=>i.value.trim());
    const as = Array.from(document.querySelectorAll('.sq-a')).map(i=>i.value);
    if(qs.some(q=>q.length<5)){ toast('Enter all 3 questions','danger'); return; }
    if(new Set(qs.map(q=>q.toLowerCase())).size<3){ toast('Use 3 different questions','danger'); return; }
    if(as.some(a=>normAns(a).length<2)){ toast('Enter an answer for every question (at least 2 letters)','danger'); return; }
    if(cur.length && needsApproval('Change security questions', ()=>document.getElementById('sqSaveBtn').click())) return;
    const qa = [];
    for(let i=0;i<3;i++) qa.push({q:qs[i], h: await sqHash(currentUser.id, i, as[i])});
    currentUser.securityQa = qa;
    logActivity(cur.length?'Security questions changed':'Security questions set', currentUser.username);
    save(); toast('Security questions saved','success'); openRecoveryKeyModal();
  });
}

function openForgotPasswordModal(){
  const root = document.getElementById('forgotRoot');
  const close = ()=>{ root.innerHTML = ''; };
  const typed = document.getElementById('loginUsername').value.trim();
  let mode = emailResetReady() ? 'email' : 'sq';
  const finish = (u)=>{
    close();
    document.getElementById('loginUsername').value = u.username;
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').focus();
    toast('Sign in with your new password','success');
  };
  const pwFields = `
      <div class="field"><label>New password</label><input type="password" id="fpPass" autocomplete="new-password"></div>
      <div class="field"><label>Confirm new password</label><input type="password" id="fpPass2" autocomplete="new-password"></div>`;
  const checkPw = (err)=>{
    const pw = root.querySelector('#fpPass').value, pw2 = root.querySelector('#fpPass2').value;
    if(pw.length<minPwLen()){ err('New password must be at least '+minPwLen()+' characters.'); return null; }
    if(pw!==pw2){ err('The two passwords do not match.'); return null; }
    return pw;
  };
  const draw = ()=>{
    root.innerHTML = `<div class="modal-backdrop" style="z-index:600;"><div class="modal-sheet">
      <div class="modal-head"><div class="modal-title">Forgot password?</div><button class="modal-close" id="fpCloseBtn" type="button">${ICON.close}</button></div>
      <div id="fpBody">
        <div class="card" style="padding:12px 14px;margin-bottom:12px;">
          <div style="font-weight:600;font-size:13.5px;margin-bottom:4px;">Staff (Manager, Cashier, Viewer)</div>
          <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;">Use <em>Email code</em> below (the code goes to your admin's email, so ask the admin for it), or ask your admin to set a new password: <em>Users &amp; access → your name → New password</em>.</div>
        </div>
        <div style="font-weight:600;font-size:13.5px;margin-bottom:8px;">Reset with</div>
        <div class="subtabs" style="margin-bottom:12px;">
          <button type="button" class="subtab ${mode==='email'?'active':''}" id="fpTabEmail">Email code</button>
          <button type="button" class="subtab ${mode==='sq'?'active':''}" id="fpTabSq">Questions</button>
          <button type="button" class="subtab ${mode==='key'?'active':''}" id="fpTabKey">Recovery key</button>
        </div>
        <div id="fpAdmin"></div>
      </div></div></div>`;
    root.querySelector('#fpCloseBtn').addEventListener('click', close);
    root.querySelector('#fpTabEmail').addEventListener('click', ()=>{ mode='email'; draw(); });
    root.querySelector('#fpTabSq').addEventListener('click', ()=>{ mode='sq'; draw(); });
    root.querySelector('#fpTabKey').addEventListener('click', ()=>{ mode='key'; draw(); });
    (mode==='email' ? drawEmail : mode==='sq' ? drawSq : drawKey)();
  };

  /* ---- security questions ---- */
  const drawSq = (u)=>{
    const box = root.querySelector('#fpAdmin');
    if(!u){
      box.innerHTML = `
        <div class="field"><label>Admin username</label><input type="text" id="fpUser" autocomplete="off" value="${esc(typed)}"></div>
        <div id="fpError" style="color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px;"></div>
        <div class="modal-actions"><button type="button" class="btn" id="fpCancelBtn">Cancel</button><button type="button" class="btn btn-primary" id="fpNextBtn">Continue</button></div>`;
      box.querySelector('#fpCancelBtn').addEventListener('click', close);
      box.querySelector('#fpNextBtn').addEventListener('click', ()=>{
        const name = box.querySelector('#fpUser').value.trim();
        const cand = findUser(name);
        if(!cand || !cand.active || cand.role!=='admin' || !(cand.securityQa && cand.securityQa.length)){
          box.querySelector('#fpError').textContent = 'No security questions are set for this admin account. Try the Recovery key tab, or ask another admin to reset your password.';
          return;
        }
        drawSq(cand);
      });
      return;
    }
    box.innerHTML = `
      <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:8px;">Answer all questions for <strong>${esc(u.username)}</strong>.</div>
      ${u.securityQa.map((x,i)=>`<div class="field"><label>${esc(x.q)}</label><input type="text" class="fp-ans" autocomplete="off"></div>`).join('')}
      ${pwFields}
      <div id="fpError" style="color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px;"></div>
      <div class="modal-actions"><button type="button" class="btn" id="fpCancelBtn">Cancel</button><button type="button" class="btn btn-primary" id="fpResetBtn">Reset password</button></div>`;
    box.querySelector('#fpCancelBtn').addEventListener('click', close);
    box.querySelector('#fpResetBtn').addEventListener('click', async ()=>{
      const err = m=>{ box.querySelector('#fpError').textContent = m; };
      const wait = rkLockedMs();
      if(wait){ err('Too many wrong attempts. Try again in '+Math.ceil(wait/60000)+' minute(s).'); return; }
      const answers = Array.from(box.querySelectorAll('.fp-ans')).map(i=>i.value);
      if(answers.some(a=>!normAns(a))){ err('Answer every question.'); return; }
      const pw = checkPw(err); if(!pw) return;
      let ok = true;
      for(let i=0;i<u.securityQa.length;i++){ if((await sqHash(u.id, i, answers[i]))!==u.securityQa[i].h) ok = false; }
      if(!ok){
        rkFail();
        logActivity('Password recovery failed', 'Security questions — username: '+u.username);
        err('One or more answers are incorrect.');
        return;
      }
      u.passHash = await sha256Hex(pw); delete u.mustChangePw;
      rkClear(); save();
      logActivity('Admin password reset (security questions)', u.username);
      finish(u);
    });
  };

  /* ---- recovery key ---- */
  const drawKey = ()=>{
    const box = root.querySelector('#fpAdmin');
    box.innerHTML = `
      ${state.recoveryHash ? '' : '<div class="field-hint" style="color:var(--danger);margin-bottom:8px;">No recovery key was set up on this device. Use the Security questions tab, or ask another admin to reset your password.</div>'}

      <div class="field"><label>Recovery key</label><input type="text" id="fpKey" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX" style="text-transform:uppercase;"></div>

    box.querySelector('#fpCancelBtn').addEventListener('click', close);
    box.querySelector('#fpResetBtn').addEventListener('click', async ()=>{
      const err = m=>{ box.querySelector('#fpError').textContent = m; };
      const username = box.querySelector('#fpUser').value.trim();
      const key = box.querySelector('#fpKey').value;
      const wait = rkLockedMs();
      if(wait){ err('Too many wrong attempts. Try again in '+Math.ceil(wait/60000)+' minute(s).'); return; }
      if(!username || !normRk(key)){ err('Enter the admin username and the recovery key.'); return; }
      const pw = checkPw(err); if(!pw) return;
      const u = findUser(username);
      const ok = u && u.active && u.role==='admin' && state.recoveryHash && (await rkHash(key))===state.recoveryHash;
      if(!ok){
        rkFail();
        logActivity('Password recovery failed', 'Recovery key — username: '+username.slice(0,40));
        err('Incorrect username or recovery key.');
        return;
      }
      u.passHash = await sha256Hex(pw); delete u.mustChangePw;
      rkClear();
      const newKey = await issueRecoveryKey();   // the used key is now void
      logActivity('Admin password reset (recovery key)', u.username+' — a new recovery key was issued');
      root.querySelector('#fpBody').innerHTML = '<p style="font-size:13px;margin-top:0;">Password updated for <strong>'+esc(u.username)+'</strong>. Here is your <strong>new</strong> recovery key:</p>'+recoveryKeyPanelHtml(newKey);
      wireRecoveryKeyPanel(newKey, ()=>finish(u));
    });
  };
  /* ---- email code (any user) ---- */
  const drawEmail = (stage, info)=>{
    const box = root.querySelector('#fpAdmin');
    if(!emailResetReady()){
      box.innerHTML = '<div class="field-hint" style="line-height:1.5;">Email reset is not turned on. An admin can set it up in Settings → Email password reset. Meanwhile use the Questions or Recovery key tab, or ask an admin to reset your password.</div>';
      return;
    }
    if(stage!=='verify'){
      box.innerHTML = `
        <div class="field"><label>Your username</label><input type="text" id="fpUser" autocomplete="off" value="${esc(typed)}"></div>
        <div id="fpError" style="color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px;"></div>
        <div class="modal-actions"><button type="button" class="btn" id="fpCancelBtn">Cancel</button><button type="button" class="btn btn-primary" id="fpSendBtn">Send code</button></div>`;
      box.querySelector('#fpCancelBtn').addEventListener('click', close);
      box.querySelector('#fpSendBtn').addEventListener('click', async ()=>{
        const err = m=>{ box.querySelector('#fpError').textContent = m; };
        const name = box.querySelector('#fpUser').value.trim();
        if(!name){ err('Enter your username.'); return; }
        const btn = box.querySelector('#fpSendBtn');
        const u = findUser(name);
        btn.disabled = true; btn.textContent = 'Sending…';
        try{
          if(u && u.active){
            const to = await requestResetEmail(u);
            logActivity('Password reset code requested', u.username+' — emailed to '+to.map(r=>r.username).join(', '));
            drawEmail('verify', {userId:u.id, username:u.username, sentTo:to.map(r=>maskEmail(r.email)).join(', '), self:u.role==='admin' && to[0].id===u.id});
            return;
          }
          // unknown / inactive user: look identical to a real request
          drawEmail('verify', {userId:null, username:name, sentTo:'the admin', self:false});
        }catch(e){
          btn.disabled = false; btn.textContent = 'Send code';
          if(e.message==='NO_EMAIL') err('No admin email is saved on this device. Ask an admin to add one in Users & access.');
          else if(e.message==='RATE') err('Too many requests. Please wait 15 minutes and try again.');
          else err('Could not send the email. Check the internet connection and the EmailJS settings.');
        }
      });
      return;
    }
    box.innerHTML = `
      <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:10px;">A code was emailed to <strong>${esc(info.sentTo)}</strong>. ${info.self?'Check your inbox.':'Ask the admin for the code.'} It is valid for ${EMAIL_CODE_MIN} minutes.</div>
      <div class="field"><label>Reset code</label><input type="text" id="fpCode" autocomplete="off" autocapitalize="characters" placeholder="8-character code" style="text-transform:uppercase;"></div>
      ${pwFields}
      <div id="fpError" style="color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px;"></div>
      <div class="modal-actions"><button type="button" class="btn" id="fpCancelBtn">Cancel</button><button type="button" class="btn btn-primary" id="fpResetBtn">Reset password</button></div>`;
    box.querySelector('#fpCancelBtn').addEventListener('click', ()=>{ pendingEmailReset = null; close(); });
    box.querySelector('#fpResetBtn').addEventListener('click', async ()=>{
      const err = m=>{ box.querySelector('#fpError').textContent = m; };
      const wait = rkLockedMs();
      if(wait){ err('Too many wrong attempts. Try again in '+Math.ceil(wait/60000)+' minute(s).'); return; }
      const code = box.querySelector('#fpCode').value;
      if(!normRk(code)){ err('Enter the reset code.'); return; }
      const pw = checkPw(err); if(!pw) return;
      const pr = pendingEmailReset;
      if(!pr || !info.userId || pr.userId!==info.userId || Date.now()>pr.expires){ err('This code has expired or was not requested. Go back and send a new code.'); return; }
      if((await emailCodeHash(pr.userId, code))!==pr.codeHash){
        pr.tries++; rkFail();
        logActivity('Password recovery failed', 'Email code — username: '+info.username);
        if(pr.tries>=5){ pendingEmailReset = null; err('Too many wrong codes. Send a new code.'); }
        else err('Incorrect code.');
        return;
      }
      const u = state.users.find(x=>x.id===pr.userId); if(!u){ err('User not found.'); return; }
      u.passHash = await sha256Hex(pw); delete u.mustChangePw;
      pendingEmailReset = null; rkClear(); save();
      logActivity('Password reset (email code)', u.username);
      finish(u);
    });
  };

  draw();
}

/* ============================================================
   HELPERS
   ============================================================ */
function money(n){
  n = Number(n)||0;
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'-₹':'₹') + v;
}
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function amountInWordsIndian(n){
  n = Math.round(Number(n)||0);
  if(n===0) return 'Zero Rupees Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(num){
    if(num < 20) return ones[num];
    return tens[Math.floor(num/10)] + (num%10 ? ' '+ones[num%10] : '');
  }
  function threeDigits(num){
    if(num >= 100) return ones[Math.floor(num/100)] + ' Hundred' + (num%100 ? ' '+twoDigits(num%100) : '');
    return twoDigits(num);
  }
  const neg = n < 0;
  const original = Math.abs(n);
  let n2 = original;
  const crore = Math.floor(n2 / 10000000); n2 %= 10000000;
  const lakh = Math.floor(n2 / 100000); n2 %= 100000;
  const thousand = Math.floor(n2 / 1000); n2 %= 1000;
  const hundred = n2;
  let parts = [];
  if(crore) parts.push(threeDigits(crore) + ' Crore');
  if(lakh) parts.push(threeDigits(lakh) + ' Lakh');
  if(thousand) parts.push(threeDigits(thousand) + ' Thousand');
  if(hundred) parts.push(threeDigits(hundred));
  return (neg?'Minus ':'') + (parts.join(' ') || 'Zero') + (original===1 ? ' Rupee Only' : ' Rupees Only');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.innerHTML = (kind==='success'?ICON.check:kind==='danger'?ICON.alert:'') + '<span>'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ============================================================
   COMPUTED TOTALS
   ============================================================ */
function totals(){
  const totalInvested = state.investments.reduce((s,x)=>s+x.amount,0);
  const totalRevenue = state.sales.reduce((s,x)=>s+x.total,0);
  const totalExpenses = state.expenses.reduce((s,x)=>s+x.amount,0);
  const stockPurchaseExpense = state.expenses.filter(x=>x.category==='Stock Purchase'||x.category==='Restock').reduce((s,x)=>s+x.amount,0);
  const operatingExpenses = totalExpenses - stockPurchaseExpense;
  const netProfit = totalRevenue - totalExpenses;
  const cashBalance = totalInvested + netProfit;
  const stockValue = state.inventory.reduce((s,x)=>s + (x.qty*x.costPrice), 0);
  const stockUnits = state.inventory.reduce((s,x)=>s+x.qty,0);
  const businessWorth = cashBalance + stockValue;
  return {totalInvested, totalRevenue, totalExpenses, stockPurchaseExpense, operatingExpenses, netProfit, cashBalance, stockValue, stockUnits, businessWorth};
}
function lowStockItems(){
  return state.inventory.filter(x => x.qty <= (x.minQty!=null?x.minQty:3));
}
function totalGstCollected(){
  return state.bills.reduce((s,b)=>s+(b.gstAmount||0),0);
}
function billNoStr(n){ return 'INV-' + String(n).padStart(4,'0'); }
function piNoStr(n){ return 'PI-' + String(n).padStart(4,'0'); }
function pendingProformas(){ return state.proformas.filter(p=>p.status!=='converted'); }
function dcNoStr(n){ return 'DC-' + String(n).padStart(4,'0'); }
const DC_REASONS = ['Job Work','Sample / Approval','Exhibition / Demo','Return of Goods','Branch Transfer','Line Sale (Sale on Approval)','Other'];

/* GST math for a subtotal, given rate/type/priceMode. Returns taxable value,
   cgst/sgst/igst and grand total (what the customer actually pays). */
function computeGst(subtotal, gstEnabled, rate, type, priceMode){
  if(!gstEnabled || !rate){
    return {taxable:subtotal, gstAmount:0, cgst:0, sgst:0, igst:0, grandTotal:subtotal};
  }
  let taxable, gstAmount;
  if(priceMode==='inclusive'){
    taxable = subtotal / (1 + rate/100);
    gstAmount = subtotal - taxable;
  } else {
    taxable = subtotal;
    gstAmount = subtotal * rate/100;
  }
  const grandTotal = priceMode==='inclusive' ? subtotal : subtotal + gstAmount;
  const cgst = type==='inter' ? 0 : gstAmount/2;
  const sgst = type==='inter' ? 0 : gstAmount/2;
  const igst = type==='inter' ? gstAmount : 0;
  return {taxable, gstAmount, cgst, sgst, igst, grandTotal};
}

let reportRange = 6;   // months shown in the charts
function shortNum(n){
  const a = Math.abs(n), sg = n<0 ? '-' : '';
  const f = (v,u)=> sg + (v%1===0 ? v : v.toFixed(1)) + u;
  if(a>=1e7) return f(+(a/1e7).toFixed(1),'Cr');
  if(a>=1e5) return f(+(a/1e5).toFixed(1),'L');
  if(a>=1e3) return f(+(a/1e3).toFixed(1),'k');
  return sg + Math.round(a);
}
function niceMax(v){
  if(v<=0) return 100;
  const raw = v/4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=raw);
  return step*4;
}
function monthShortLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-IN',{month:'short'});
}
function lastMonths(n){
  const out = []; const [y0,m0] = currentMonthStr().split('-').map(Number);
  for(let i=n-1;i>=0;i--){ const d = new Date(y0, m0-1-i, 1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}
function monthlySeries(n){
  const months = lastMonths(n), first = months[0];
  const sum = (arr, fld, ym)=> arr.filter(x=>(x.date||'').slice(0,7)===ym).reduce((t,x)=>t+(Number(x[fld])||0),0);
  const before = (arr, fld)=> arr.filter(x=>(x.date||'').slice(0,7)<first).reduce((t,x)=>t+(Number(x[fld])||0),0);
  let cash = before(state.investments,'amount') + before(state.sales,'total') - before(state.expenses,'amount');
  return months.map(ym=>{
    const rev = sum(state.sales,'total',ym), exp = sum(state.expenses,'amount',ym), inv = sum(state.investments,'amount',ym);
    cash += inv + rev - exp;
    return {ym, label:monthShortLabel(ym), rev, exp, inv, profit:rev-exp, cash};
  });
}
function chartAxis(W,H,L,B,T,max){
  let g = '';
  for(let i=0;i<=4;i++){
    const y = T + (H-T-B)*(1-i/4), v = max*i/4;
    g += '<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"'+(i?' stroke-dasharray="3 3"':'')+'/>'
       + '<text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--text-faint)">'+shortNum(v)+'</text>';
  }
  return g;
}
function chartRevenueExpenses(data){
  const W=340,H=200,L=34,B=22,T=10, max = niceMax(Math.max(...data.map(d=>Math.max(d.rev,d.exp)),0));
  const plotW = W-L-6, slot = plotW/data.length, bw = Math.min(16, slot/2.6);
  const y = v => T + (H-T-B)*(1 - v/max);
  let g = chartAxis(W,H,L,B,T,max);
  data.forEach((d,i)=>{
    const cx = L + slot*i + slot/2;
    g += '<rect x="'+(cx-bw-1)+'" y="'+y(d.rev)+'" width="'+bw+'" height="'+Math.max(0,(H-B)-y(d.rev))+'" rx="2" fill="var(--accent2)"/>'
       + '<rect x="'+(cx+1)+'" y="'+y(d.exp)+'" width="'+bw+'" height="'+Math.max(0,(H-B)-y(d.exp))+'" rx="2" fill="var(--accent)"/>'
       + '<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--text-dim)">'+d.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Monthly revenue and expenses">'+g+'</svg>';
}
function chartCashTrend(data){
  const W=340,H=170,L=34,B=22,T=10;
  const vals = data.map(d=>d.cash), lo = Math.min(0,...vals), hi = Math.max(0,...vals);
  const span = niceMax(hi-lo)/1, max = lo + span;
  const y = v => T + (H-T-B)*(1 - (v-lo)/(max-lo));
  const slot = (W-L-30)/Math.max(1,data.length-1);
  const pts = data.map((d,i)=>[L+12+slot*i, y(d.cash)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+' L'+pts[pts.length-1][0].toFixed(1)+' '+y(Math.max(lo,0))+' L'+pts[0][0].toFixed(1)+' '+y(Math.max(lo,0))+' Z';
  let g = '';
  for(let i=0;i<=4;i++){
    const v = lo + (max-lo)*i/4, yy = y(v);
    g += '<line x1="'+L+'" x2="'+(W-6)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--border)" stroke-dasharray="3 3"/><text x="'+(L-4)+'" y="'+(yy+3)+'" text-anchor="end" font-size="9" fill="var(--text-faint)">'+shortNum(v)+'</text>';
  }
  if(lo<0) g += '<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--text-faint)" stroke-width="1"/>';
  g += '<path d="'+area+'" fill="var(--accent2)" opacity=".14"/><path d="'+line+'" fill="none" stroke="var(--accent2)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  data.forEach((d,i)=>{
    g += '<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="3" fill="var(--surface)" stroke="var(--accent2)" stroke-width="2"/>'
       + '<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--text-dim)">'+d.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Cash balance by month">'+g+'</svg>';
}
function chartExpenseBreakdown(){
  const by = {}; state.expenses.forEach(x=>{ by[x.category] = (by[x.category]||0) + (Number(x.amount)||0); });
  const rows = Object.entries(by).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  const total = rows.reduce((t,r)=>t+r[1],0);
  if(!rows.length) return '<div class="field-hint" style="text-align:center;padding:14px 0;">No expenses yet</div>';
  return rows.map(([c,v])=>{
    const pct = total ? v/total*100 : 0;
    return '<div style="margin:9px 0;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span>'+esc(c)+'</span><span style="font-family:\'IBM Plex Mono\',monospace;">'+money(v)+' <span style="color:var(--text-faint);">· '+pct.toFixed(0)+'%</span></span></div>'
      + '<div style="height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:var(--accent);border-radius:5px;"></div></div></div>';
  }).join('');
}
function chartCapitalVsProfit(t){
  const cap = Math.max(0,t.totalInvested), prof = t.netProfit;
  const total = cap + Math.max(0,prof);
  if(total<=0) return '<div class="field-hint" style="text-align:center;padding:14px 0;">Add an investment or some sales to see this</div>';
  const cp = cap/total*100, pp = 100-cp;
  return '<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface2);">'
    + (cp?'<div style="width:'+cp.toFixed(1)+'%;background:var(--accent2);"></div>':'')
    + (pp?'<div style="width:'+pp.toFixed(1)+'%;background:var(--accent);"></div>':'')+'</div>'
    + '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:8px;">'
    + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent2);margin-right:5px;"></i>Owner capital '+money(t.totalInvested)+' ('+cp.toFixed(0)+'%)</span>'
    + '<span style="text-align:right;"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:5px;"></i>'+(prof>=0?'Profit earned ':'Loss ')+money(prof)+'</span></div>'
    + (prof<0?'<div class="field-hint" style="margin-top:6px;color:var(--danger);">The business is running at a loss, so it is using up the owner\'s capital.</div>':'');
}
function reportChartsHtml(){
  const data = monthlySeries(reportRange), t = totals();
  const legend = (c,l)=>'<span style="display:inline-flex;align-items:center;gap:5px;"><i style="width:10px;height:10px;border-radius:2px;background:'+c+';display:inline-block;"></i>'+l+'</span>';

  return `

  <div class="subtabs" style="margin-bottom:12px;">
    ${[3,6,12].map(n=>`<button class="subtab ${reportRange===n?'active':''}" data-report-range="${n}">${n} months</button>`).join('')}

    <div style="overflow-x:auto;margin-top:6px;"><table class="report-table" style="font-size:12px;">

      ${data.slice().reverse().map(d=>`<tr><td>${d.label} ${d.ym.slice(2,4)}</td><td style="text-align:right;">${money(d.rev)}</td><td style="text-align:right;">${money(d.exp)}</td><td style="text-align:right;color:${d.profit>=0?'var(--success)':'var(--danger)'};">${money(d.profit)}</td></tr>`).join('')}

  const isSelf = editing && currentUser && editing.id===currentUser.id;
  openModal(`
    <div class="modal-head"><span class="modal-title">${editing?'Edit user':'Add user'}</span>
      <button class="modal-close" id="modalCloseBtn">${ICON.close}</button></div>
    <div class="field"><label>Full name</label><input type="text" id="u_name" value="${editing?esc(editing.name||''):''}"></div>
    <div class="field"><label>Username</label><input type="text" id="u_username" value="${editing?esc(editing.username):''}" ${editing?'':''}></div>
    <div class="field-row">
      <div class="field"><label>Mobile number</label><input type="tel" id="u_mobile" inputmode="tel" autocomplete="off" placeholder="10-digit number" value="${editing?esc(editing.mobile||''):''}"></div>
      <div class="field"><label>Email ID</label><input type="email" id="u_email" autocomplete="off" placeholder="name@example.com" value="${editing?esc(editing.email||''):''}"></div>
    </div>
    <div class="field"><label>Role</label>
      <select id="u_role" ${isSelf?'disabled':''}>
        ${Object.keys(ROLES).map(r=>`<option value="${r}" ${editing&&editing.role===r?'selected':''}>${ROLES[r].label}</option>`).join('')}
      </select>
      ${isSelf?'<div class="field-hint">You can\'t change your own role.</div>':''}
    </div>
    <div class="field"><label>${editing?'New password (leave blank to keep current)':'Password'}</label><input type="password" id="u_pass" autocomplete="new-password"></div>
    ${editing?`<div class="field-check"><input type="checkbox" id="u_active" ${editing.active?'checked':''} ${isSelf?'disabled':''}><span class="field-check-text">Account active (unchecking blocks sign-in)</span></div>`:''}
    <div class="modal-actions">
      ${editing && !isSelf ? `<button class="btn btn-danger" id="u_deleteBtn" style="flex:0.6;">${ICON.trash}</button>` : ''}
      <button class="btn btn-primary" id="u_saveBtn">Save</button>
    </div>
  `);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('u_saveBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('u_name').value.trim();
    const username = document.getElementById('u_username').value.trim();
    const role = document.getElementById('u_role').value;
    const pass = document.getElementById('u_pass').value;
    const mobile = document.getElementById('u_mobile').value.replace(/[\s-]+/g,'');
    const email = document.getElementById('u_email').value.trim();
    if(!username){ toast('Username is required','danger'); return; }
    if(mobile && !/^\+?\d{10,15}$/.test(mobile)){ toast('Enter a valid mobile number (10–15 digits)','danger'); return; }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ toast('Enter a valid email ID','danger'); return; }
    const dup = findUser(username);
    if(dup && (!editing || dup.id!==editing.id)){ toast('That username is already taken','danger'); return; }
    if(!editing && !pass){ toast('Password is required for a new user','danger'); return; }
    if(pass && pass.length<minPwLen()){ toast('Password must be at least '+minPwLen()+' characters','danger'); return; }
    if(editing && needsApproval('Edit user: '+editing.username, ()=>document.getElementById('u_saveBtn').click())) return;
    if(editing){
      const userBefore = {name:editing.name, username:editing.username, mobile:editing.mobile, email:editing.email, role:editing.role, active:editing.active};
      editing.name = name; editing.username = username; editing.mobile = mobile; editing.email = email; editing.role = isSelf?editing.role:role;
      if(!isSelf) editing.active = document.getElementById('u_active').checked;
      if(pass) editing.passHash = await sha256Hex(pass);
      logActivity('Edit user', diffText(userBefore, editing, ['name','username','mobile','email','role','active'], userBefore.username)+(pass?'; password changed':''));
      toast('User updated','success');
    } else {
      state.users.push({id:uid(), username, name, mobile, email, role, passHash:await sha256Hex(pass), active:true, createdAt:todayISO()});
      logActivity('Add user', username+' ('+role+')');
      toast('User added','success');
    }
    save(); closeModal(); renderAll();
  });
  const delBtn = document.getElementById('u_deleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    confirmModal('Remove user "'+editing.username+'"? This cannot be undone.', ()=>{
      state.users = state.users.filter(u=>u.id!==editing.id);
      logActivity('Delete user', editing.username);
      save(); closeModal(); renderAll();
      toast('User removed','success');
    });
  });
}

function monthLabel(ym){
  if(!ym) return '';
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'});
}
function currentMonthStr(){ return todayISO().slice(0,7); }
/* Employee ID format:  RRK + DOB (DDMMYYYY) + "-" + serial number   e.g. RRK15081995-001 */
function empSerialOf(id){ const m = /(\d+)$/.exec(id||''); return m ? parseInt(m[1],10) : 0; }
function nextEmpSerial(){
  let max = 0;
  (state.employees||[]).forEach(e=>{ max = Math.max(max, empSerialOf(e.empId)); });
  return max + 1;
}
function buildEmpId(dob, serial){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dob||'');
  if(!m) return '';
  return empPrefix() + m[3] + m[2] + m[1] + '-' + String(serial).padStart(3,'0');
}
function ensureEmployeeIds(){
  let changed = false;
  (state.employees||[]).forEach(e=>{
    if(!e.empId){ const sn = nextEmpSerial(); e.empId = buildEmpId(e.dob, sn) || ('EMP-' + String(sn).padStart(3,'0')); changed = true; }
  });
  if(changed) save();
}
/* Employee information is for admins. Other roles must get an admin to enter the admin password. */
let employeeViewUntil = 0;
let empTab = 'staff';
function isAdmin(){ return !!currentUser && currentUser.role==='admin'; }
function canViewEmployees(){ return isAdmin() || Date.now() < employeeViewUntil; }
function openEmployeesWithAccess(){
  const go = ()=>{ currentPage='employees'; empTab='staff'; renderAll(); window.scrollTo({top:0}); };
  if(canViewEmployees()){ go(); return; }
  requestAdminApproval('View employee information', ()=>{
    employeeViewUntil = Date.now() + unlockMs();   // 10 minutes
    logActivity('Employee information opened', 'Admin approved access for '+(currentUser?currentUser.username:''));
    go();
  });
}
const BLOOD_GROUPS = ['A+','A-','B+','B-','AB+','AB-','O+','O-'];
function qrSvg(text, px, level){
  const q = qrcode(0, level||'M'); q.addData(String(text)); q.make();
  const n = q.getModuleCount(), m = 3; let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += 'M'+(c+m)+' '+(r+m)+'h1v1h-1z';
  const t = n+m*2;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+(px||160)+'" height="'+(px||160)+'" shape-rendering="crispEdges"><rect width="'+t+'" height="'+t+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

function vcardText(e){
  const L = ['BEGIN:VCARD','VERSION:3.0','FN:'+e.name,'ORG:'+state.shopName];
  if(e.designation) L.push('TITLE:'+e.designation);
  if(e.phone) L.push('TEL;TYPE=CELL:'+e.phone);
  if(e.email) L.push('EMAIL:'+e.email);
  L.push('END:VCARD');
  return L.join('\n');
}
/* Visiting card, 90 mm x 54 mm. The QR code is a contact card: scanning it offers "Save contact". */
function visitingCardHtml(e, n){
  const line = (k,v)=> v ? `<div style="display:flex;gap:1.6mm;margin-top:.9mm;"><span style="flex:0 0 3mm;font-weight:700;color:#B5651D;">${k}</span><span style="min-width:0;word-break:break-word;">${v}</span></div>` : '';
  return `<div style="position:relative;width:90mm;height:54mm;box-sizing:border-box;overflow:hidden;background:#fff;border:.25mm solid #cfd6df;font-family:Arial,Helvetica,sans-serif;color:#1F2A33;break-inside:avoid;">
    <div style="position:absolute;left:0;top:0;bottom:0;width:2.6mm;background:linear-gradient(180deg,#B5651D,#2D6E68);"></div>
    <div style="position:absolute;left:6.5mm;top:3.5mm;display:flex;align-items:center;gap:2.5mm;">
      <img src="${BRAND_LOGO}" alt="" style="width:29mm;height:auto;display:block;">
      <div><div style="font-size:12pt;font-weight:800;letter-spacing:.3mm;line-height:1;color:#1F2A33;">${esc(state.shopName)}</div><div style="font-size:4.6pt;letter-spacing:.35mm;color:#4A5A6E;margin-top:.9mm;">${esc(VC_TAGLINE)}</div></div>
    </div>
    <div style="position:absolute;left:6.5mm;top:21mm;right:30mm;">
      <div style="font-size:11.5pt;font-weight:700;line-height:1.1;">${esc(e.name)}</div>
      <div style="font-size:7.5pt;color:#4A5A6E;margin-top:.6mm;">${esc(e.designation||'')}</div>
      <div style="font-size:7pt;margin-top:1.8mm;">
        ${line('M', e.phone?esc(e.phone):'')}
        ${line('E', e.email?esc(e.email):'')}
        ${line('A', state.shopAddress?esc(state.shopAddress).replace(/\n/g,', '):'')}
      </div>
    </div>

function maskAcc(n){ n = String(n||''); return n.length>4 ? '••••'+n.slice(-4) : n; }
function empBankLines(emp){

/* Every salary payment must also be an expense, so it reduces net profit and cash balance. */
function salaryExpenseNote(p){ return p.employeeName+' — '+monthLabel(p.month)+' ('+p.payslipNo+')'; }
function syncSalaryExpenses(){
  if(!state.salaryPayments) return;
  let changed = false;
  state.salaryPayments.forEach(p=>{
    const linked = p.expenseId && state.expenses.some(x=>x.id===p.expenseId);
    if(linked || p.expenseRemoved) return;
    if(p.expenseId){ p.expenseRemoved = true; changed = true; return; }   // user deleted it on purpose
    const ex = {id:uid(), category:'Salary', amount:p.netPay, note:salaryExpenseNote(p), date:p.paidDate||todayISO(), salaryPaymentId:p.id};
    state.expenses.push(ex); p.expenseId = ex.id; changed = true;
  });
  if(changed) save();
}
function employeeNetForMonth(emp, ym){
  const existing = (state.salaryPayments||[]).find(p=>p.employeeId===emp.id && p.month===ym);
  return existing || null;
}

function recordSalaryPayment(emp, o){
  const netPay = o.basic + o.allowances - o.deductions;
  const payslipNo = 'PS-' + String(state.nextPayslipNo).padStart(4,'0');
  const payment = {
    id:uid(), payslipNo, employeeId: emp.id, employeeName: emp.name, designation: emp.designation||'',
    month:o.month, basic:o.basic, allowances:o.allowances, deductions:o.deductions, netPay, paidDate:o.paidDate, notes:o.notes||''
  };
  const salaryExpense = {id:uid(), category:'Salary', amount:netPay, note:salaryExpenseNote(payment), date:o.paidDate, salaryPaymentId:payment.id};
  payment.expenseId = salaryExpense.id;
  state.expenses.push(salaryExpense);
  state.salaryPayments.push(payment);
  state.nextPayslipNo += 1;
  logActivity('Pay salary', emp.name+' — '+monthLabel(o.month)+' — '+money(netPay)+' (deducted from profit/cash as Salary expense)');
  return payment;
}

  {id:'merriweather', label:'Merriweather (serif)', stack:"'Merriweather',Georgia,serif", gf:'Merriweather:wght@400;700'},

  {id:'system', label:'Phone default (no download)', stack:"system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif", gf:null},
  {id:'mono', label:'Typewriter (IBM Plex Mono)', stack:"'IBM Plex Mono',ui-monospace,monospace", gf:null}
];
function fontById(id){ return FONT_OPTIONS.find(f=>f.id===id) || FONT_OPTIONS[0]; }
function loadFontFile(f){
  if(!f.gf || document.getElementById('gf-'+f.id)) return;
  const l = document.createElement('link');
  l.id = 'gf-'+f.id; l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family='+f.gf+'&display=swap';   // needs internet the first time; falls back to a similar font offline
  document.head.appendChild(l);
}
function applyFont(id){
  const f = fontById(id || (state.uiSettings && state.uiSettings.font));
  loadFontFile(f);
  document.body.style.fontFamily = f.id==='default' ? '' : f.stack;
}
function applyBackground(mode){
  document.body.setAttribute('data-bg', mode);
  if(mode==='image' && state.uiSettings && state.uiSettings.bgImage){
    document.body.style.backgroundImage = `url("${state.uiSettings.bgImage}")`;
  } else {
    document.body.style.backgroundImage = '';
  }
}
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode failed'));
      img.onload = ()=>{
        let {width:w, height:h} = img;
        if(w>maxDim || h>maxDim){
          const scale = maxDim / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

function generateCode(category){
  const prefix = CAT_PREFIX[category] || (category||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'GEN';
  const existing = state.inventory.filter(x=>x.code.startsWith(prefix+'-'));
  let max = 0;
  existing.forEach(x=>{ const n = parseInt(x.code.split('-')[1],10); if(!isNaN(n) && n>max) max=n; });
  return prefix + '-' + String(max+1).padStart(4,'0');
}

      </div>

        logActivity('Delete supplier', s.name);
        save(); closeModal(); toast('Supplier deleted'); if(onSaved) onSaved(null);
      });
    });

    const phone = document.getElementById('sf_phone').value.trim();

    const address = document.getElementById('sf_address').value.trim();
